changelogHtml: |
  <h3 id="1.0.0" data-text="Version 1.0.0" tabindex="-1">Version 1.0.0</h3>
  <p>June 17, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-location-altitude:1.0.0</code>
    ,
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-external-protobuf:1.0.0</code>
    , and
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-proto:1.0.0</code>
    are released. Version 1.0.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ee961773bd6a83b5a65e1eded92c3ac09e4fe81f..a95266623bd2e6b286cbd12c2eefec5b9845316a/core">these commits</a>
    .
  </p>
  <p><strong>Major features of 1.0.0:</strong></p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Moves libraries to use Java 11 target. This means produced bytecode will be Java 11 (class file version 55) and might require desugaring to use the library (
      <a href="https://android-review.googlesource.com/#/q/If4c2a6fdda1278f42ea080fa365e8b437b2c2ae6">If4c2a</a>
      ,
      <a href="https://issuetracker.google.com/issues/457821470">b/457821470</a>
      )
    </li>
    <li>
      Add ViewBoundsTracker class to continuously track the view bounds for setting sourceRectHint in PictureInPictureParamsCompat (
      <a href="https://android-review.googlesource.com/#/q/Id203aa25cb63addc6585c6eb721d99e5b195177b">Id203a</a>
      ,
      <a href="https://issuetracker.google.com/issues/474454111">b/474454111</a>
      )
    </li>
    <li>
      Add PictureInPictureParamsValidator class to validate the app provided PictureInPictureParamsCompat (
      <a href="https://android-review.googlesource.com/#/q/I89b4d813f42c42687eb10bb45005f6765c210990">I89b4d</a>
      ,
      <a href="https://issuetracker.google.com/issues/470149490">b/470149490</a>
      )
    </li>
    <li>
      Add the Pixel Dec release to the list of fixed build fingerprints in KI_398591036 (
      <a href="https://android-review.googlesource.com/#/q/I65f51f92c528ca7483476bb5ab9d0f0e7f603ca1">I65f51</a>
      ,
      <a href="https://issuetracker.google.com/issues/398591036">b/398591036</a>
      )
    </li>
    <li>
      Add the Pixel Nov release to the list of fixed build fingerprints in KI_398591036 (
      <a href="https://android-review.googlesource.com/#/q/I60c10c18a5cbe68a2a5aaa45aae6caf314de0179">I60c10</a>
      ,
      <a href="https://issuetracker.google.com/issues/398591036">b/398591036</a>
      )
    </li>
    <li>
      Add the Pixel Oct release to the list of fixed build fingerprints in KI_398591036 (
      <a href="https://android-review.googlesource.com/#/q/I6438cbd8db15b8ad545eff1c3b492385a1002a5f">I6438c</a>
      ,
      <a href="https://issuetracker.google.com/issues/398591036">b/398591036</a>
      )
    </li>
    <li>
      Removed references to FingerprintManager class from FingerprintManagerCompat and updated all methods to return false or no-op. (
      <a href="https://android-review.googlesource.com/#/q/I0360b3ef856865097df80d3d98953978d1e86de7">I0360b</a>
      ,
      <a href="https://issuetracker.google.com/issues/330524057">b/330524057</a>
      )
    </li>
    <li>
      Fix the code links in documentation for KI_452390376 (
      <a href="https://android-review.googlesource.com/#/q/I9a554376ca3be01cc6a79cda3349d0d4fb23c070">I9a554</a>
      ,
      <a href="https://issuetracker.google.com/issues/454020407">b/454020407</a>
      )
    </li>
    <li>
      Mark specifig pixel builds as fixed. (
      <a href="https://android-review.googlesource.com/#/q/I4c7519189c6fd1a792333925e0a1bd3cbb37c712">I4c751</a>
      ,
      <a href="https://issuetracker.google.com/issues/398591036">b/398591036</a>
      )
    </li>
    <li>
      Add support for specifying a list of manually tested build fingerprints for a KnownIssue. (
      <a href="https://android-review.googlesource.com/#/q/Iea9f9f14a4c81a66689552d59ecaf2b41f02c494">Iea9f9</a>
      ,
      <a href="https://issuetracker.google.com/issues/453691379">b/453691379</a>
      )
    </li>
  </ul>
  <h4 id="1.0.0-rc01" data-text="Version 1.0.0-rc01" tabindex="-1">Version 1.0.0-rc01</h4>
  <p>March 11, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-location-altitude:1.0.0-rc01</code>
    ,
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-external-protobuf:1.0.0-rc01</code>
    , and
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-proto:1.0.0-rc01</code>
    are released with no notable changes since last beta. Version 1.0.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b7446a78657b91b088b062544628faaf3c5a5582..5efc18b3cff6a5fe94edf31670a2a91e56618208/core">these commits</a>
    .
  </p>
  <h4 id="core-location-altitude-1.0.0-beta01" data-text="Version 1.0.0-beta01" tabindex="-1">Version 1.0.0-beta01</h4>
  <p>November 05, 2025</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-location-altitude:1.0.0-beta01</code>
    ,
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-external-protobuf:1.0.0-beta01</code>
    , and
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-proto:1.0.0-beta01</code>
    are released with no notable changes since the last alpha. Version 1.0.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b8a68b0896897fa158508d73a31998a26161d9a7..b7446a78657b91b088b062544628faaf3c5a5582/core">these commits</a>
    .
  </p>
  <h4 id="core-location-altitude-1.0.0-alpha03" data-text="Version 1.0.0-alpha03" tabindex="-1">Version 1.0.0-alpha03</h4>
  <p>October 16, 2024</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-location-altitude:1.0.0-alpha03</code>
    ,
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-external-protobuf:1.0.0-alpha03</code>
    , and
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-proto:1.0.0-alpha03</code>
    are released. Version 1.0.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f5541f29d045c6ba9734689ec67891f8d667412b..b8a68b0896897fa158508d73a31998a26161d9a7/core">these commits</a>
    .
  </p>
  <p><strong>Security fix</strong></p>
  <ul>
    <li>
      As of
      <a href="https://android-review.googlesource.com/q/topic:%22protobuf-4.28.2%22">this change</a>
      , androidx compiles against protobuf 4.28.2 in order to address
      <a href="https://nvd.nist.gov/vuln/detail/CVE-2024-7254">CVE-2024-7254</a>
      . Upgrade your dependency on
      <code translate="no" dir="ltr">androidx.core:core-location-altitude-proto</code>
      and
      <code translate="no" dir="ltr">androidx.core:core-location-altitude-external-protobuf</code>
      to 1.1.0-alpha03 to address the vulnerability risk.
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Removed manual outlining of access to new platform APIs since this happens automatically via API modeling when using R8 with AGP 7.3 or later (e.g. R8 version 3.3) and for all builds when using AGP 8.1 or later (e.g. D8 version 8.1). Clients who are not using AGP are advised to update to D8 version 8.1 or later. See
      <a href="https://medium.com/androiddevelopers/mitigating-soft-verification-issues-in-r8-and-d8-7e9e06827dfd">this article</a>
      for more details. (
      <a href="https://android-review.googlesource.com/#/q/Ieb9aecd2af5587c5b82833146fee6e912693ab7b">Ieb9ae</a>
      ,
      <a href="https://issuetracker.google.com/issues/345472586">b/345472586</a>
      )
    </li>
  </ul>
  <h4 id="core-location-altitude-1.0.0-alpha02" data-text="Version 1.0.0-alpha02" tabindex="-1">Version 1.0.0-alpha02</h4>
  <p>June 12, 2024</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-location-altitude:1.0.0-alpha02</code>
    ,
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-external-protobuf:1.0.0-alpha02</code>
    , and
    <code translate="no" dir="ltr">androidx.core:core-location-altitude-proto:1.0.0-alpha02</code>
    are released. Version 1.0.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f5541f29d045c6ba9734689ec67891f8d667412b/core">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>Fixes proguard failure caused by the repackaging of proto libraries.</li>
  </ul>
  <p><strong>External Contribution</strong></p>
  <ul>
    <li>Bug fix above provided by andrekir@pm.me</li>
  </ul>
  <h4 id="core-location-altitude-1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h4>
  <p>July 26, 2023</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-i18n:1.0.0-alpha01</code>
    and
    <code translate="no" dir="ltr">androidx.core:core-location-altitude:1.0.0-alpha01</code>
    are released.
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/4aed940027a19667e67d155563fc5fa8b7279313/core/core-location-altitude">Version 1.0.0-alpha01 contains these commits.</a>
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">AltitudeConverterCompat</code>
      class with a single static method
      <code translate="no" dir="ltr">addMslAltitudeToLocation(Context, Location)</code>
      (
      <a href="https://android.googlesource.com/platform/frameworks/support/+/340afce6e1887c3322e839fe311748580bdd517c">I11168</a>
      ).
    </li>
  </ul>
  <h2 id="core-pip_2" data-text="Core-pip" tabindex="-1">Core-pip</h2>
  <h3 id="version_10_23" data-text="Version 1.0" tabindex="-1">Version 1.0</h3>
  <h4 id="core-pip-1.0.0-alpha04" data-text="Version 1.0.0-alpha04" tabindex="-1">Version 1.0.0-alpha04</h4>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-pip:1.0.0-alpha04</code>
    is released. Version 1.0.0-alpha04 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ba3014c143b9c9782fe30bc766c5dced55e13453..0772d6d66c62698e7f7ef7c63313d8107364e7e8/core/core-pip">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add
      <code translate="no" dir="ltr">disablePipOnAppSwitch</code>
      to
      <code translate="no" dir="ltr">ContentPipExt</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ie5badea51bda65184ddd96d55986725f78fff275">Ie5bad</a>
      ,
      <a href="https://issuetracker.google.com/issues/542307174">b/542307174</a>
      )
    </li>
    <li>
      Introduced a fallback
      <code translate="no" dir="ltr">PiP</code>
      solution in
      <code translate="no" dir="ltr">androidx.core.pip</code>
      to maintain Picture-in-Picture functionality during navigation gestures (like quick switch) where native
      <code translate="no" dir="ltr">PiP</code>
      may be suppressed. (
      <a href="https://android-review.googlesource.com/#/q/If289a70b583cc87b323cf95e5cbc005dc3fb784a">If289a</a>
      ,
      <a href="https://issuetracker.google.com/issues/540480397">b/540480397</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Callback
      <code translate="no" dir="ltr">onFinishContentPip</code>
      if
      <code translate="no" dir="ltr">enterPip</code>
      fails (
      <a href="https://android-review.googlesource.com/#/q/I04b7761fb0b5ad379d16b9207771abad0f76d9e1">I04b77</a>
      ,
      <a href="https://issuetracker.google.com/issues/540480397">b/540480397</a>
      )
    </li>
  </ul>
  <h4 id="core-pip-1.0.0-alpha03" data-text="Version 1.0.0-alpha03" tabindex="-1">Version 1.0.0-alpha03</h4>
  <p>July 01, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-pip:1.0.0-alpha03</code>
    is released. Version 1.0.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/cdf076c6abd0f3125cb0302756fcb77fe981ab7c..596f5c3c9e4fda91d275bfb53e84702f0bba6e04/core/core-pip">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">BasicPictureInPicture</code>
      and
      <code translate="no" dir="ltr">VideoPlaybackPictureInPicture</code>
      classes now require an Executor in their constructors. A new commit() method has been introduced and must be called to apply parameter changes. (
      <a href="https://android-review.googlesource.com/#/q/Ib9150d2d4bba801dd10d279fc56dcfdbb5be5ef1">Ib9150</a>
      ,
      <a href="https://issuetracker.google.com/issues/493673311">b/493673311</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Catch exception in
      <code translate="no" dir="ltr">setPictureInPictureParams</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ibfeb29ee777d82e1ee6b2e3a82240bed3d21d61d">Ibfeb2</a>
      ,
      <a href="https://issuetracker.google.com/issues/519706801">b/519706801</a>
      )
    </li>
  </ul>
  <h4 id="core-pip-1.0.0-alpha02" data-text="Version 1.0.0-alpha02" tabindex="-1">Version 1.0.0-alpha02</h4>
  <p>February 11, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-pip:1.0.0-alpha02</code>
    is released. Version 1.0.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/c4e491baa54e95e632dbbac0df9b66a7e62ad17f..2e98d140740558dc55710bde96311d2e0e8d5cfd/core/core-pip">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">BasicPictureInPicture</code>
      and
      <code translate="no" dir="ltr">VideoPlaybackPictureInPicture</code>
      to streamline standard implementations. The new
      <code translate="no" dir="ltr">VideoPlaybackPictureInPicture</code>
      class allows the library to handle view-bounds tracking automatically, ensuring smoother visual transitions.
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Remove the
      <code translate="no" dir="ltr">onViewBoundsChanged</code>
      API (
      <a href="https://android-review.googlesource.com/#/q/Ie56d0c9472eee965067a9f598a8225ea5df7aaef">Ie56d0</a>
      ,
      <a href="https://issuetracker.google.com/issues/475328144">b/475328144</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">BasicPictureInPicture</code>
      and
      <code translate="no" dir="ltr">VideoPlaybackPictureInPicture</code>
      classes for typical PiP usages (
      <a href="https://android-review.googlesource.com/#/q/I7f9895dd5a0c6a5853dda519faf0ac62a4f9d5c1">I7f989</a>
      ,
      <a href="https://issuetracker.google.com/issues/475328144">b/475328144</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Add
      <code translate="no" dir="ltr">ViewBoundsTracker</code>
      class to continuously track the view bounds for setting
      <code translate="no" dir="ltr">sourceRectHint</code>
      in
      <code translate="no" dir="ltr">PictureInPictureParamsCompat</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Id203aa25cb63addc6585c6eb721d99e5b195177b">Id203a</a>
      ,
      <a href="https://issuetracker.google.com/issues/474454111">b/474454111</a>
      )
    </li>
  </ul>
  <h4 id="core-pip-1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h4>
  <p>January 14, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-pip:1.0.0-alpha01</code>
    is released. Version 1.0.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/c4e491baa54e95e632dbbac0df9b66a7e62ad17f/core/core-pip">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <p>The PiP Jetpack library is introduced to address several challenges in Android's Picture-in-Picture (PiP) mode:</p>
  <ul>
    <li>
      OS Fragmentation: The library handles differences in PiP API calls across Android versions, such as
      <code translate="no" dir="ltr">enterPictureInPictureMode</code>
      before Android S and
      <code translate="no" dir="ltr">isAutoEnterEnabled</code>
      after.
    </li>
    <li>Incorrect PiP Parameters: It provides a unified solution for setting correct PiP parameters, especially for playback, to ensure smooth animations (e.g., source rect hint).</li>
    <li>
      Fragmented PiP State Callbacks: The library consolidates
      <code translate="no" dir="ltr">onPictureInPictureModeChanged</code>
      and
      <code translate="no" dir="ltr">onPictureInPictureUiStateChanged</code>
      into a single, unified callback interface for simplified state management.
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">PictureInPictureDelegate</code>
      class that helps setup PiP (Picture-in-Picture) functionalities on behalf of the given
      <code translate="no" dir="ltr">PictureInPictureProvider</code>
      instance (
      <a href="https://android-review.googlesource.com/c/platform/frameworks/support/+/3857454">8cf9588</a>
      ).
    </li>
    <li>
      <code translate="no" dir="ltr">PictureInPictureDelegate.onPictureInPictureEvent</code>
      interface that provides a unified callback for application to listen on Picture-in-Picture events (
      <a href="https://android-review.googlesource.com/c/platform/frameworks/support/+/3857454">8cf9588</a>
      ).
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Add
      <code translate="no" dir="ltr">PictureInPictureParamsValidator</code>
      class to validate the app provided
      <code translate="no" dir="ltr">PictureInPictureParamsCompat</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I89b4d813f42c42687eb10bb45005f6765c210990">I89b4d</a>
      ,
      <a href="https://issuetracker.google.com/issues/470149490">b/470149490</a>
      )
    </li>
    <li>
      A dedicated
      <code translate="no" dir="ltr">:core:core-pip</code>
      library is introduced to help app developers implementing the Android PiP (Picture-in-Picture) feature (
      <a href="https://android-review.googlesource.com/#/q/I8ebc5081a0067d80f1ae9e01578e36370a71be1a">I8ebc5</a>
      ,
      <a href="https://issuetracker.google.com/issues/462178249">b/462178249</a>
      )
    </li>
  </ul>
  <h2 id="core-role_2" data-text="Core-Role" tabindex="-1">Core-Role</h2>
  <h3 id="version_11_11" data-text="Version 1.1" tabindex="-1">Version 1.1</h3>
  <h4 id="core-role-1.1.0" data-text="Version 1.1.0" tabindex="-1">Version 1.1.0</h4>
  <p>March 12, 2025</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-role:1.1.0</code>
    is released. Version 1.1.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/d950727ec55346f048816bcb77c6962881527405..62be11e8b31def4aa2cfd77694c26ea6f23e2019/core/core-role">these commits</a>
    .
  </p>
  <h4 id="core-role-1.1.0-rc01" data-text="Version 1.1.0-rc01" tabindex="-1">Version 1.1.0-rc01</h4>
  <p>December 15, 2021</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-role:1.1.0-rc01</code>
    is released with no changes since
    <code translate="no" dir="ltr">1.1.0-alpha01</code>
    .
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/24daa503442fcd3e44ada60cf1da41df2815c045..d950727ec55346f048816bcb77c6962881527405/core/core-role">Version 1.1.0-rc01 contains these commits.</a>
  </p>
  <h4 id="core-role-1.1.0-alpha01" data-text="Core-Role Version 1.1.0-alpha01" tabindex="-1">Core-Role Version 1.1.0-alpha01</h4>
  <p>April 15, 2020</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-role:1.1.0-alpha01</code>
    is released.
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b3acda6aadff279fb002c49e9d0d4bd5b21f0566..24daa503442fcd3e44ada60cf1da41df2815c045/core/core-role">Version 1.1.0-alpha01 contains these commits.</a>
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>Added role name for system gallery.</li>
  </ul>
  <h3 id="version_10_24" data-text="Version 1.0" tabindex="-1">Version 1.0</h3>
