  <h2 id="core-telecom_2" data-text="Core-telecom" tabindex="-1">Core-telecom</h2>
  <h3 id="version_11_12" data-text="Version 1.1" tabindex="-1">Version 1.1</h3>
  <h4 id="core-telecom-1.1.0" data-text="Version 1.1.0" tabindex="-1">Version 1.1.0</h4>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-telecom:1.1.0</code>
    is released. Version 1.1.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/0fb3f6f93fe07a7858b056f97ce456ff6bed7f86..b44a77505e345a9f0af437b0405e3f6cd3b534b2/core/core-telecom">these commits</a>
    .
  </p>
  <p><strong>Important changes since 1.0.0:</strong></p>
  <p>
    Version 1.1.0 makes migrating to
    <code translate="no" dir="ltr">core-telecom</code>
    even smoother by giving
    <code translate="no" dir="ltr">VoIP</code>
    developers granular rollout control over the underlying platform implementation (
    <code translate="no" dir="ltr">ConnectionService</code>
    vs. transactional APIs), promotes core Call Extensions to stable, introduces new call-logging and network-slicing controls, and further hardens call setup and audio routing across Android SDKs.
  </p>
  <p><strong>New Features &amp; API Changes</strong></p>
  <ul>
    <li>
      <strong>
        Seamless Migration &amp; Rollout Control (
        <code translate="no" dir="ltr">ConnectionService</code>
        vs. Transactional APIs):
      </strong>
      <code translate="no" dir="ltr">core-telecom</code>
      abstracts two underlying Android framework Telecom implementations behind a single unified API surface: the
      <code translate="no" dir="ltr">ConnectionService</code>
      APIs and the transactional
      <code translate="no" dir="ltr">TelecomManager#addCall</code>
      APIs (used by default on SDK 34+).
      <code translate="no" dir="ltr">CallsManager#registerAppWithTelecom(int, int)</code>
      now includes an optional
      <code translate="no" dir="ltr">backwardsCompatSdkLevel</code>
      parameter (defaulting to SDK 33) that lets
      <code translate="no" dir="ltr">VoIP</code>
      apps configure the upper SDK bound (inclusive) that uses the
      <code translate="no" dir="ltr">ConnectionService</code>
      -backed implementation. For apps migrating from a direct platform
      <code translate="no" dir="ltr">ConnectionService</code>
      integration, this enables a low-risk, phased rollout: you can adopt
      <code translate="no" dir="ltr">core-telecom</code>
      once using the familiar
      <code translate="no" dir="ltr">ConnectionService</code>
      backing across your target SDK range to avoid production regressions, and smoothly ramp up to the modern transactional platform APIs at your own pace—without changing your call management code. (
      <a href="https://android-review.googlesource.com/#/q/Ib9571c205b36308ddaa588bde066e1b7c2d4dd79">Ib9571</a>
      )
    </li>
    <li>
      <strong>Call Extensions Graduated to Stable:</strong>
      Removed the
      <code translate="no" dir="ltr">@ExperimentalAppActions</code>
      opt-in requirement from
      <code translate="no" dir="ltr">CallsManager#addCallWithExtensions</code>
      ,
      <code translate="no" dir="ltr">InCallServiceCompat#connectExtensions</code>
      ,
      <code translate="no" dir="ltr">LocalCallSilenceExtension</code>
      ,
      <code translate="no" dir="ltr">ParticipantExtension</code>
      , and
      <code translate="no" dir="ltr">MeetingSummaryRemote</code>
      , promoting them to stable APIs for syncing call state with remote surfaces such as Android Auto and Wear OS. (
      <a href="https://android-review.googlesource.com/#/q/I25ab240a315affc39c7b694242a05766c6d519dd">I25ab2</a>
      )
    </li>
    <li>
      <strong>Remote Microphone Mute Control:</strong>
      Extended
      <code translate="no" dir="ltr">LocalCallSilenceExtension</code>
      with
      <code translate="no" dir="ltr">updateCanUserUpdateSilence(Boolean)</code>
      and an optional
      <code translate="no" dir="ltr">onCanUserUpdateSilence</code>
      callback so
      <code translate="no" dir="ltr">VoIP</code>
      apps can dynamically enable or disable microphone mute controls on remote surfaces (for example, when a user joins as a passive viewer, is muted by a meeting moderator, or uses Companion Mode). (
      <a href="https://android-review.googlesource.com/#/q/I55acff5d35fdfff83d4bba83fc7adcd97d826c05">I55acf</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/Ibb0c2f91ee510704d38f1fc7f8620e5475bac9bb">Ibb0c2</a>
      )
    </li>
    <li>
      <strong>
        Per-Call Call Log Exclusion (
        <code translate="no" dir="ltr">CallAttributesCompat.isLogExcluded</code>
        ):
      </strong>
      Added an optional
      <code translate="no" dir="ltr">isLogExcluded</code>
      property to
      <code translate="no" dir="ltr">CallAttributesCompat</code>
      , allowing
      <code translate="no" dir="ltr">VoIP</code>
      apps that opt into system call logging to exclude specific calls from being saved to the system call log on Android 16 QPR (
      <code translate="no" dir="ltr">Build.VERSION_CODES_FULL.BAKLAVA_1</code>
      ) and higher. (
      <a href="https://android-review.googlesource.com/#/q/Ia2a3a86b05f70c4a4313a84031607cbee356011d">Ia2a3a</a>
      )
    </li>
    <li>
      <strong>Opt-Out of Premium Network Slicing:</strong>
      Introduced
      <code translate="no" dir="ltr">CallsManager.CAPABILITY_OPT_OUT_OF_PREMIUM_NETWORK</code>
      for
      <code translate="no" dir="ltr">registerAppWithTelecom</code>
      , allowing
      <code translate="no" dir="ltr">VoIP</code>
      applications to opt out of automatic platform requests for premium network slices during voice and video calls. (
      <a href="https://android-review.googlesource.com/#/q/I2dfdb6499748a48fb728cd92e04158445778b5a8">I2dfdb</a>
      )
    </li>
    <li>
      <strong>Dynamic Call Type Observation &amp; Upgrades:</strong>
      Added
      <code translate="no" dir="ltr">CallControlScope#callTypeFlow()</code>
      and
      <code translate="no" dir="ltr">CallControlScope#requestCallType(int)</code>
      so apps can observe live audio/video state transitions and dynamically upgrade or downgrade call types mid-session. (
      <a href="https://android-review.googlesource.com/#/q/I510657e4ebad6bc72c920543ee0e560e3f0984f9">I51065</a>
      )
    </li>
    <li>
      <strong>
        <code translate="no" dir="ltr">DisconnectCause.ERROR</code>
        Support with Cross-SDK Fallback:
      </strong>
      Allowed
      <code translate="no" dir="ltr">VoIP</code>
      apps to disconnect calls with
      <code translate="no" dir="ltr">DisconnectCause.ERROR</code>
      starting in SDK 38, with automatic Jetpack-layer remapping to
      <code translate="no" dir="ltr">DisconnectCause.LOCAL</code>
      on older Android versions so apps do not need version checks. (
      <a href="https://android-review.googlesource.com/#/q/I5a58cd455804532a8f605ab6ba34d4ef43075a13">I5a58c</a>
      )
    </li>
  </ul>
  <p><strong>Cross-SDK Audio Routing &amp; Call Setup Reliability</strong></p>
  <ul>
    <li>
      <strong>Faster, Non-Blocking Call Setup:</strong>
      Decoupled starting audio endpoint resolution and Bluetooth stabilization from the synchronous
      <code translate="no" dir="ltr">CallsManager#addCall</code>
      path, eliminating a delay of up to 2 seconds before entering
      <code translate="no" dir="ltr">CallControlScope</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia1e89af7a3e18a9feaefc3a79d5e9ceaefa2e952">Ia1e89</a>
      )
    </li>
    <li>
      <strong>
        OS
        <code translate="no" dir="ltr">TransactionManager</code>
        Deadlock Prevention:
      </strong>
      Added a transitory call-setup gatekeeper that immediately rejects overlapping or un-debounced
      <code translate="no" dir="ltr">addCall</code>
      and
      <code translate="no" dir="ltr">addCallWithExtensions</code>
      requests with
      <code translate="no" dir="ltr">CallException(ERROR_CALL_NOT_PERMITTED_AT_PRESENT_TIME)</code>
      , preventing 5-second timeouts and serial queue deadlocks in the platform
      <code translate="no" dir="ltr">TransactionManager</code>
      while preserving full multi-call and call-waiting support. (
      <a href="https://android-review.googlesource.com/#/q/If0ac8aeefdff2ad4be661b6bff0df97b9c7a999e">If0ac8</a>
      )
    </li>
    <li>
      <strong>Cross-SDK Audio vs. Video Routing Mitigations:</strong>
      <ul>
        <li>
          Fixed a platform constant mapping issue across SDK 34–36 where incoming audio-only
          <code translate="no" dir="ltr">VoIP</code>
          calls could be misinterpreted by the OS as video calls and erroneously routed to the speakerphone instead of the earpiece, including a Jetpack fallback for missing platform video-state callbacks on SDK 34. (
          <a href="https://android-review.googlesource.com/#/q/I959025dfd4231ca7beea7287a19e8094608a7d3a">I95902</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/Ic7000c50f1817065c25538abe7274018367662cc">Ic7000</a>
          )
        </li>
        <li>
          Fixed video call routing on older Android versions and the
          <code translate="no" dir="ltr">ConnectionService</code>
          compatibility path so incoming or dynamically upgraded video calls reliably default or fall back to speakerphone when no headset is connected. (
          <a href="https://android-review.googlesource.com/#/q/I29fd225926d4830b36e09e7e15e7e66471eff7da">I29fd2</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I0fc797186e4d22c29f3a45f9cf584015472597d7">I0fc79</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I9f2bd0ac012555277e189543fe6eda3a6bbd0854">I9f2bd</a>
          )
        </li>
      </ul>
    </li>
    <li>
      <strong>Preferred Endpoint, Wired Headset &amp; Bluetooth Preservation:</strong>
      <ul>
        <li>
          Prevented platform call-start defaults from overriding a user's pre-call
          <code translate="no" dir="ltr">preferredStartingCallEndpoint</code>
          (such as earpiece on video calls) or reverting an intentional early user switch to speakerphone. (
          <a href="https://android-review.googlesource.com/#/q/I38ea69d9b482e694f4032bc2b4e86eeffa7448fc">I38ea6</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I9e251ce4c81b60e3e1712984483981682eb837e7">I9e251</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I62871b5072d87930238b1fc920d28caaaf79a38a">I62871</a>
          )
        </li>
        <li>
          Fixed an issue where starting a video call with a connected wired/USB-C headset (
          <code translate="no" dir="ltr">TYPE_WIRED_HEADSET</code>
          ) or a connecting Bluetooth headset would prematurely switch audio to the device speaker. (
          <a href="https://android-review.googlesource.com/#/q/I575a8437740b801903921abbf96abcab67904a9d">I575a8</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I82463385ce37ef6d3f55f10f49702a3755cdb0bc">I82463</a>
          )
        </li>
        <li>
          Added a permissionless fallback heuristic to identify paired wearables/watches for audio routing when
          <code translate="no" dir="ltr">BLUETOOTH_CONNECT</code>
          is not granted (
          <a href="https://android-review.googlesource.com/#/q/Iec271c4a9a56a02bfd15824cae1bd25debe14e00">Iec271</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I4d2182264cf97803695df310e665b8c9bf401e94">I4d218</a>
          ), and removed unsupported A2DP-only media devices from
          <code translate="no" dir="ltr">getAvailableStartingCallEndpoints()</code>
          to match platform Telecom voice routing (
          <a href="https://android-review.googlesource.com/#/q/I98b729e518cca5b4f9087236838f50469350bfed">I98b72</a>
          ).
        </li>
      </ul>
    </li>
    <li>
      <strong>ANR, Crash &amp; Extension Lifecycle Hardening:</strong>
      <ul>
        <li>
          Filtered redundant
          <code translate="no" dir="ltr">CallAudioState</code>
          and
          <code translate="no" dir="ltr">CallEndpoint</code>
          updates in the legacy compatibility path to prevent main-thread congestion and potential ANRs. (
          <a href="https://android-review.googlesource.com/#/q/Ibd794ea1e1c326a7e17075293142170d35fc74e8">Ibd794</a>
          )
        </li>
        <li>
          Fixed race conditions and null-pointer crashes across
          <code translate="no" dir="ltr">JetpackConnectionService</code>
          (
          <a href="https://android-review.googlesource.com/#/q/I24306d9c59362e95e9847996ac457bf7d9d1645a">I24306</a>
          ),
          <code translate="no" dir="ltr">PreCallEndpointsUpdater</code>
          (
          <a href="https://android-review.googlesource.com/#/q/Ifad5c37f197e57ee5118deffd1f0f3843d4c2ce5">Ifad5c</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I2d722be8dcdf5669e49dc78968ad62519cf1ffd6">I2d722</a>
          ),
          <code translate="no" dir="ltr">BluetoothProfileListener</code>
          (
          <a href="https://android-review.googlesource.com/#/q/Idbd57d31151d1d30f7190c305b91d13408e40485">Idbd57</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I1901ee87e73d7bae2ac2efbad86c9df7fc4fbd12">I1901e</a>
          ), and remote extension binder teardown/setup (
          <a href="https://android-review.googlesource.com/#/q/I73a527d7f41b166b1f61a611c0d241011dcda146">I73a52</a>
          ,
          <a href="https://android-review.googlesource.com/#/q/I00f829a4a2317d4a9d136df2712df450257f3681">I00f82</a>
          ).
        </li>
      </ul>
    </li>
  </ul>
  <h4 id="core-telecom-1.1.0-rc01" data-text="Version 1.1.0-rc01" tabindex="-1">Version 1.1.0-rc01</h4>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-telecom:1.1.0-rc01</code>
    is released. Version 1.1.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/df9c056f542deb04aeb0c1e38bfc39b0538805d3..d0aef16d5047fadf798d2861eb25abb5eea4cbc6/core/core-telecom">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Bump core-telecom to 1.1.0-rc01. (
      <a href="https://android-review.googlesource.com/#/q/Iba0530fd92731fbd4e31cd2d6ac903c229422f8d">Iba053</a>
      )
    </li>
    <li>
      Fixed an issue where video calls started with a preferred audio endpoint (such as the phone earpiece) would erroneously revert to the device speaker shortly after connecting. (
      <a href="https://android-review.googlesource.com/#/q/I38ea69d9b482e694f4032bc2b4e86eeffa7448fc">I38ea6</a>
      )
    </li>
    <li>
      Fixed an issue where video calls would incorrectly route audio to the device speaker instead of a connected wired headset on call start. (
      <a href="https://android-review.googlesource.com/#/q/I575a8437740b801903921abbf96abcab67904a9d">I575a8</a>
      )
    </li>
    <li>
      Allow
      <code translate="no" dir="ltr">VoIP</code>
      apps to disconnect with
      <code translate="no" dir="ltr">DisconnectCause.ERROR</code>
      starting in SDK 38, with automatic remapping to LOCAL on older platform versions. (
      <a href="https://android-review.googlesource.com/#/q/I5a58cd455804532a8f605ab6ba34d4ef43075a13">I5a58c</a>
      )
    </li>
  </ul>
  <h4 id="core-telecom-1.1.0-beta01" data-text="Version 1.1.0-beta01" tabindex="-1">Version 1.1.0-beta01</h4>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.core:core-telecom:1.1.0-beta01</code>
    is released. Version 1.1.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/36e054a434241b1a13950458560fac44bac6ba35..8d3b23e12649b579ee037ebe0ea959237c39d198/core/core-telecom">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Bump core-telecom to 1.1.0-beta01. (
      <a href="https://android-review.googlesource.com/#/q/I5b514adb8020ba8cf672a1cb46ef7bbac9ce68a0">I5b514</a>
      ,
      <a href="https://issuetracker.google.com/issues/529775455">b/529775455</a>
      )
    </li>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">CallsManager#addCall</code>
      could delay
      <code translate="no" dir="ltr">CallControlScope</code>
      entry by up to 2 seconds while waiting for starting audio endpoint resolution and Bluetooth stabilization. (
      <a href="https://android-review.googlesource.com/#/q/Ia1e89af7a3e18a9feaefc3a79d5e9ceaefa2e952">Ia1e89</a>
      ,
      <a href="https://issuetracker.google.com/issues/540450085">b/540450085</a>
      )
    </li>
    <li>
      Fixed a race condition where invoking
      <code translate="no" dir="ltr">CallsManager#addCall</code>
      or
      <code translate="no" dir="ltr">CallsManager#addCallWithExtensions</code>
      while another call setup is in progress could lead to deadlocks or silent failures in the OS
      <code translate="no" dir="ltr">TransactionManager</code>
      . Overlapping call setups are now immediately rejected with
      <code translate="no" dir="ltr">CallException(ERROR_CALL_NOT_PERMITTED_AT_PRESENT_TIME)</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If0ac8aeefdff2ad4be661b6bff0df97b9c7a999e">If0ac8</a>
      ,
      <a href="https://issuetracker.google.com/issues/491156745">b/491156745</a>
      )
    </li>
  </ul>
