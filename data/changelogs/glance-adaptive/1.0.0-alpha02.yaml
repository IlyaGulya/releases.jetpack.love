#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha02" data-text="Version 1.0.0-alpha02" tabindex="-1">Version 1.0.0-alpha02</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-appwidget:1.0.0-alpha02</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-core:1.0.0-alpha02</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-wear:1.0.0-alpha02</code>
    are released. Version 1.0.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..e4bd62f853853bf3522ed15681c58ef28b09ed44/glance/adaptive">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
  <h4 id="1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h4>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-appwidget:1.0.0-alpha01</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-core:1.0.0-alpha01</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-wear:1.0.0-alpha01</code>
    are released. Version 1.0.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea/glance/adaptive">these commits</a>
    .
  </p>
  <p>
    This is the initial release of the Glance Adaptive library - the library for building template-first
    <code translate="no" dir="ltr">RemoteCompose</code>
    Widgets for multiple form factors and surfaces across Android ecosystem.
  </p>
