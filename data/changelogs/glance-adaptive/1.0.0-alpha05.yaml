libraryId: glance-adaptive
groupId: androidx.glance
version: 1.0.0-alpha05
releaseDate: 2026-11-18
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha05" data-text="Version 1.0.0-alpha05" tabindex="-1">Version 1.0.0-alpha05</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-appwidget:1.0.0-alpha05</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-core:1.0.0-alpha05</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-wear:1.0.0-alpha05</code>
    are released. Version 1.0.0-alpha05 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..e683ad6020f7629bdd6fc05d123693449e741ecd/glance/adaptive">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">GlanceAdaptiveWidgetManager.setConfigurationResult</code>
      to glance-adaptive-appwidget. (
      <a href="https://android-review.googlesource.com/#/q/Id375169e224c1faea0bd6306317b40b47c230979">Id3751</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">GlanceAdaptiveWidgetManager</code>
      to glance-adaptive as an entry point for managing Glance Adaptive widgets. (
      <a href="https://android-review.googlesource.com/#/q/I9d4f2c5e8b0316a7f2345b9c0d1e2f3a4b5c6d7e">I9d4f2</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">GlanceSurface</code>
      ,
      <code translate="no" dir="ltr">AppWidgetSurface</code>
      ,
      <code translate="no" dir="ltr">WidgetInstanceInfo</code>
      , and
      <code translate="no" dir="ltr">GlanceAdaptiveTemplate</code>
      interface to glance-adaptive. (
      <a href="https://android-review.googlesource.com/#/q/I8c3e1b4d7a9205f6e1234a8b9c0d1e2f3a4b5c6d">I8c3e1</a>
      )
    </li>
  </ul>
