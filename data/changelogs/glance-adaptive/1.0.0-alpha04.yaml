libraryId: glance-adaptive
groupId: androidx.glance
version: 1.0.0-alpha04
releaseDate: 2026-11-04
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha04" data-text="Version 1.0.0-alpha04" tabindex="-1">Version 1.0.0-alpha04</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-appwidget:1.0.0-alpha04</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-core:1.0.0-alpha04</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.adaptive:adaptive-wear:1.0.0-alpha04</code>
    are released. Version 1.0.0-alpha04 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..a021adf44194ae86e596ae25ca43d5e4e18f6926/glance/adaptive">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">GlanceAdaptiveWidgetReceiver</code>
      base
      <code translate="no" dir="ltr">AppWidgetProvider</code>
      class as the main entry point for Glance Adaptive widgets. (
      <a href="https://android-review.googlesource.com/#/q/Iddecc86920578ee4f5c6a66d96278ceae72758b7">Iddecc</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">@integer/glance_adaptive_widget_category_all_known</code>
      resource for
      <code translate="no" dir="ltr">&lt;appwidget-provider&gt;</code>
      's
      <code translate="no" dir="ltr">android:widgetCategory</code>
      declaration, to opt in into all supported Widget surfaces. (
      <a href="https://android-review.googlesource.com/#/q/I4582e2140f96b5911d674a6892d726f7e8cda4ff">I4582e</a>
      )
    </li>
  </ul>
