changelogHtml: |
  <h3 id="1.1.2" data-text="Version 1.1.2" tabindex="-1">Version 1.1.2</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.constraintlayout:constraintlayout-compose:1.1.2</code>
    ,
    <code translate="no" dir="ltr">androidx.constraintlayout:constraintlayout-compose-android:1.1.2</code>
    , and
    <code translate="no" dir="ltr">androidx.constraintlayout:constraintlayout-core:1.1.2</code>
    are released. Version 1.1.2 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a31205d256dd1a1629467c503b3fca269f765ebe..78f8b2a41ed3f58f9addad07e3f694182a8a441c/constraintlayout">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Removed a protobuf dependency with a known security vulnerability from constraintlayout-compose's bundled lint check.
      <strong>Note</strong>
      : since this protobuf dependency is only present on the developer machine as part of running lint (it is not contained inside the library code / included in the APK), the actual security risk here does not affect Android applications using constraintlayout-compose, the risk is only present on the local developer machine. (
      <a href="https://android-review.googlesource.com/#/q/Ia94a8e836b501e0488b0b9fb794a5ad467da88c9">Ia94a8</a>
      ,
      <a href="https://issuetracker.google.com/issues/401068466">b/401068466</a>
      )
    </li>
  </ul>
  <h2 id="constraintlayout-compose_and_constraintlayout-core_11_2" data-text="ConstraintLayout-compose, and ConstraintLayout-Core 1.1" tabindex="-1">ConstraintLayout-compose, and ConstraintLayout-Core 1.1</h2>
