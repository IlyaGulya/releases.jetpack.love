libraryId: credentials
groupId: androidx.credentials
version: 1.7.0-alpha03
releaseDate: 2026-07-29
#language=html
changelogHtml: |
  <h3 id="1.7.0-alpha03" data-text="Version 1.7.0-alpha03" tabindex="-1">Version 1.7.0-alpha03</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.credentials:credentials:1.7.0-alpha03</code>
    and
    <code translate="no" dir="ltr">androidx.credentials:credentials-play-services-auth:1.7.0-alpha03</code>
    are released. Version 1.7.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e29a10982f4299b1fa812e229d76792092a62814..b146361fae7b52916fc0aca813c5ae33c38a598c/credentials">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">credentials: List&lt;Credential&gt;</code>
      property to
      <code translate="no" dir="ltr">GetCredentialResponse</code>
      to support returning multiple credentials. (
      <a href="https://android-review.googlesource.com/#/q/Ifdf66728ecc4b6fdd2cd6c5b57888f2f381e06fb">Ifdf66</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Added automatic context-swapping for
      <code translate="no" dir="ltr">MutableContextWrapper</code>
      in
      <code translate="no" dir="ltr">CredentialManager</code>
      to prevent Activity memory leaks across configuration changes during coroutine suspensions. (
      <a href="https://android-review.googlesource.com/#/q/Ie959bdbffe607432c6fabc92036d5e47737d40e1">Ie959b</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/Ide0e2ac6c7a8fcf9ee1f5164aef5318f2d57ed1d">Ide0e2</a>
      )
    </li>
  </ul>
