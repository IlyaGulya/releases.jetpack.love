changelogHtml: |
  <h3 id="1.4.0-alpha01" data-text="Version 1.4.0-alpha01" tabindex="-1">Version 1.4.0-alpha01</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3.adaptive:adaptive-*:1.4.0-alpha01</code>
    is released. Version 1.4.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/504aa1b018e948f4c9141864a58f90f6efc0f081..f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea/compose/material3/adaptive">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Remove Component Override APIs for
      <code translate="no" dir="ltr">NavigationSuiteScaffold</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ie63405700ba969d573139c24f43f8c126a6a6964">Ie6340</a>
      )
    </li>
    <li>
      Remove Component Override APIs for
      <code translate="no" dir="ltr">ThreePaneScaffold</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I9ceb51e5f53c4c33f6db261a4688df856a6a6964">I9ceb5</a>
      )
    </li>
    <li>
      Support shapes in
      <code translate="no" dir="ltr">AnimatedPane</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ie7c6030333bd11075483ef9ceedfcad931f6c5a4">Ie7c60</a>
      ,
      <a href="https://issuetracker.google.com/issues/470517507">b/470517507</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fix
      <code translate="no" dir="ltr">SupportingPaneScaffold</code>
      state sync on config changes (
      <a href="https://android-review.googlesource.com/#/q/e295964345f14d9fa353da77bf1e9a6d21549a82">e29596</a>
      )
    </li>
  </ul>
  <h2 id="compose_material3_adaptive_version_13_2" data-text="Compose Material3 Adaptive Version 1.3" tabindex="-1">Compose Material3 Adaptive Version 1.3</h2>
