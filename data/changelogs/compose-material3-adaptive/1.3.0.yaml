groupId: androidx.compose
version: 1.3.0
releaseDate: 2026-08-12
#language=html
changelogHtml: |
  <h3 id="1.3.0" data-text="Version 1.3.0" tabindex="-1">Version 1.3.0</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3.adaptive:adaptive-*:1.3.0</code>
    is released. Version 1.3.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/bda0327f6fc5c110aeed6f8802d8e5210cdefc38..504aa1b018e948f4c9141864a58f90f6efc0f081/compose/material3/adaptive">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      <p>We are excited to announce the release of the adaptive-navigation3 library. This new library, part of the Material Adaptive and Navigation3 ecosystem, is designed to help you build adaptive Material UIs integrated with the Navigation3 library.</p>

      <p>
        Use scene strategies to implement a canonical list-detail pane scaffold (
        <code translate="no" dir="ltr">ListDetailSceneStrategy</code>
        ,
        <code translate="no" dir="ltr">rememberListDetailSceneStrategy</code>
        ) or a supporting pane scaffold (
        <code translate="no" dir="ltr">SupportingPaneSceneStrategy</code>
        ,
        <code translate="no" dir="ltr">rememberSupportingPaneSceneStrategy</code>
        ). For more information about scenes, scene strategies, and other new concepts introduced in Navigation 3, refer to the
        <a href="https://developer.android.com/guide/navigation/navigation-3">Navigation3 guide</a>
        .
      </p>
    </li>
    <li>
      <p>
        <code translate="no" dir="ltr">ListDetailPaneScaffold</code>
        and
        <code translate="no" dir="ltr">SupportingPaneScaffold</code>
        are now supporting margins and edge-to-edge.
      </p>
    </li>
  </ul>
  <p><strong>Important changes since 1.2.0:</strong></p>
  <ul>
    <li>
      Support RTL with pane expansion anchors (
      <a href="https://android-review.googlesource.com/#/q/I0770bf84ce74eb1ba0534712a47689bebc7f8765">I0770b</a>
      )
    </li>
  </ul>
