changelogHtml: |
  <h3 id="1.0.0" data-text="Version 1.0.0" tabindex="-1">Version 1.0.0</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.scenecore:scenecore-*:1.0.0</code>
    is released. Version 1.0.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e2e2729abc59df52d40af80a8bbfe010c02455c6..9b00eff832fffc1d21c92cc05e2dc7fc9fad5072/xr/scenecore">these commits</a>
    .
  </p>
  <p><strong>Major features of 1.0.0:</strong></p>
  <ul>
    <li>Jetpack XR SceneCore is now stable! SceneCore lets you place and arrange 3D content, defined by entities, relative to each other and your environment. With SceneCore, you can create, place, and manipulate 2D panels and 3D models in virtual and mixed-reality scenes; specify spatial environments and spatial audio sources; and anchor virtual content to the real world.</li>
    <li>
      For more information, see our
      <a href="https://developer.android.com/develop/xr/jetpack-xr-sdk#jetpack-scenecore">Overview Page</a>
      and
      <a href="https://developer.android.com/reference/kotlin/androidx/xr/scenecore">API Reference</a>
      .
    </li>
  </ul>
