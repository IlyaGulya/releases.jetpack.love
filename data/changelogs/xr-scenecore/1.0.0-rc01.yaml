changelogHtml: |
  <h3 id="1.0.0-rc01" data-text="Version 1.0.0-rc01" tabindex="-1">Version 1.0.0-rc01</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.scenecore:scenecore-*:1.0.0-rc01</code>
    is released. Version 1.0.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/5e16bb06cf26d3e2a2d555059216c43831826f57..6fb59a3b2759476e6992ff0fc2fbb10c833eeeea/xr/scenecore">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">xr:scenecore:scenecore-openxr</code>
      library. (
      <a href="https://android-review.googlesource.com/#/q/Ic49f2c1d02530dabaea20bfc08bd621b0b877444">Ic49f2</a>
      )
    </li>
    <li>Removed several deprecated APIs ahead of the 1.0.0 stable release.</li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Resolved a memory leak bug where the Activity reference could be retained by the system when the Activity is destroyed. (
      <a href="https://android-review.googlesource.com/#/q/I6dcd7c427eae4b21390d9d8cda168247d12a1c5b">I6dcd7</a>
      )
    </li>
  </ul>
  <p><strong>Behavior Changes</strong></p>
  <ul>
    <li>
      Removed logcat output from SceneCore. (
      <a href="https://android-review.googlesource.com/#/q/I10c3c70e84aab07c754eefb6db36b6bbaea1cd70">I10c3c</a>
      )
    </li>
  </ul>
