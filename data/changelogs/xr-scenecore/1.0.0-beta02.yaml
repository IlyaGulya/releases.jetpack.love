  <h3 id="1.0.0-beta02" data-text="Version 1.0.0-beta02" tabindex="-1">Version 1.0.0-beta02</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.scenecore:scenecore-*:1.0.0-beta02</code>
    is released. Version 1.0.0-beta02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e3bbb4aa3f4ca7e3eee99b35365971fa699c8a69..5e16bb06cf26d3e2a2d555059216c43831826f57/xr/scenecore">these commits</a>
    .
  </p>
  <p><strong>Bug fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">toMoveEvent()</code>
      will return
      <code translate="no" dir="ltr">null</code>
      if the parent entity has been garbage collected. (
      <a href="https://android-review.googlesource.com/#/q/Ia7a1bf73146b410e247c98c1301e9700d9cb988a">Ia7a1b</a>
      )
    </li>
  </ul>
