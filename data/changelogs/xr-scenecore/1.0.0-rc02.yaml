changelogHtml: |
  <h3 id="1.0.0-rc02" data-text="Version 1.0.0-rc02" tabindex="-1">Version 1.0.0-rc02</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.scenecore:scenecore-*:1.0.0-rc02</code>
    is released. Version 1.0.0-rc02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/6fb59a3b2759476e6992ff0fc2fbb10c833eeeea..2e3660870c84fabc0f4ecdc2f7b87a6f853d7bf1/xr/scenecore">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed a potential memory leak by removing the
      <code translate="no" dir="ltr">perceptionRuntimeCache</code>
      in
      <code translate="no" dir="ltr">SessionExt</code>
      and refactored it to retrieve the
      <code translate="no" dir="ltr">PerceptionRuntime</code>
      directly from the
      <code translate="no" dir="ltr">Session</code>
      instance. (
      <a href="https://android-review.googlesource.com/q/Ie35b122d001f45198b5f9fed88b53fa6345b03c3">Ie35b1</a>
      )
    </li>
    <li>
      Fixed a potential context leak by using
      <code translate="no" dir="ltr">applicationContext</code>
      for
      <code translate="no" dir="ltr">OpenXR</code>
      native handles to ensure the native runtime does not hold references to an
      <code translate="no" dir="ltr">Activity</code>
      context. (
      <a href="https://android-review.googlesource.com/q/Ie35b122d001f45198b5f9fed88b53fa6345b03c3">Ie35b1</a>
      )
    </li>
    <li>
      Fixed race conditions in
      <code translate="no" dir="ltr">XrInstanceManager</code>
      by introducing proper synchronization and initialization locking. (
      <a href="https://android-review.googlesource.com/q/Ie35b122d001f45198b5f9fed88b53fa6345b03c3">Ie35b1</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">ReferenceCleaner</code>
      to support de-registration of cleaning actions and ensured
      <code translate="no" dir="ltr">Entity</code>
      cleanup actions are run explicitly during
      <code translate="no" dir="ltr">dispose()</code>
      , preventing duplicate execution upon garbage collection. (
      <a href="https://android-review.googlesource.com/q/Ie35b122d001f45198b5f9fed88b53fa6345b03c3">Ie35b1</a>
      )
    </li>
    <li>
      Fixed a memory leak in
      <code translate="no" dir="ltr">Scene</code>
      by removing the
      <code translate="no" dir="ltr">sceneCache</code>
      in
      <code translate="no" dir="ltr">SessionExt</code>
      and refactoring
      <code translate="no" dir="ltr">Scene</code>
      to fetch the instance directly from
      <code translate="no" dir="ltr">sessionConnectors</code>
      . (
      <a href="https://android-review.googlesource.com/q/Ie35b122d001f45198b5f9fed88b53fa6345b03c3">Ie35b1</a>
      )
    </li>
  </ul>
