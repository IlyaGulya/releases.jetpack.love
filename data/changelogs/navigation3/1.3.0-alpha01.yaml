  <h3 id="1.3.0-alpha01" data-text="Version 1.3.0-alpha01" tabindex="-1">Version 1.3.0-alpha01</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigation3:navigation3-*:1.3.0-alpha01</code>
    is released. Version 1.3.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/811e8c9c37f4955d520fe0cf7e39d96866066abc..b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f/navigation3">these commits</a>
    .
  </p>
  <p>** Bug Fixes **</p>
  <ul>
    <li>
      Fixed predictive back animation handoff in
      <code translate="no" dir="ltr">NavDisplay</code>
      by migrating to
      <code translate="no" dir="ltr">DeferredAnimatedContent</code>
      and resolving transition handoff issues.
      <a href="https://android-review.googlesource.com/q/I145eaedd3e2074826b14164f19369002f1cde37a">I145eaedd</a>
      <a href="https://buganizer.corp.google.com/issues/430807423">b/430807423</a>
    </li>
  </ul>
  <p>There are no release notes for this artifact.</p>
