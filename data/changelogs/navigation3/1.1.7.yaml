changelogHtml: |
  <h3 id="1.1.7" data-text="Version 1.1.7" tabindex="-1">Version 1.1.7</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigation3:navigation3-*:1.1.7</code>
    is released. Version 1.1.7 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/bc33726aa2025e67bbf11ac9142b3e33e29596a3..e4c75cb32a85803fd367372061035e6e358ad650/navigation3">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue where predictive back gestures that are triggered during a forward transition does not animate in response to swipe progress. The predictive back will now animate and complete properly. (
      <a href="https://android-review.googlesource.com/#/q/Icdcb0b769208613ffd299938a892dda8f33fcc6b">Icdcb0</a>
      ,
      <a href="https://issuetracker.google.com/issues/456218398">b/456218398</a>
      )
    </li>
  </ul>
