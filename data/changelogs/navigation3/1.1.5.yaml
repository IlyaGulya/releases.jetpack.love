changelogHtml: |
  <h3 id="1.1.5" data-text="Version 1.1.5" tabindex="-1">Version 1.1.5</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigation3:navigation3-*:1.1.5</code>
    is released. Version 1.1.5 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a93f4841a72f48f4d873afc522c7f2678e6316ba..5ff1c339d0aff2ca5a06b8ee0de282ba9cd95268/navigation3">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      The
      <code translate="no" dir="ltr">entryProvider</code>
      DSL now prioritizes
      <code translate="no" dir="ltr">NavEntry</code>
      built with a key instance, for example
      <code translate="no" dir="ltr">entry(key = userKey) { ... }</code>
      over
      <code translate="no" dir="ltr">NavEntry</code>
      built with a key class such as
      <code translate="no" dir="ltr">entry&lt;UserKey&gt;{ ... }</code>
      .(
      <a href="https://android-review.googlesource.com/#/q/Ib5ec9345e801b63cb67ecfac821428163b1b0f13">Ib5ec9</a>
      ,
      <a href="https://issuetracker.google.com/issues/533331924">b/533331924</a>
      )
    </li>
  </ul>
