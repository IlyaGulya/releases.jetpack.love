changelogHtml: |
  <h3 id="1.3.0-alpha02" data-text="Version 1.3.0-alpha02" tabindex="-1">Version 1.3.0-alpha02</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigation3:navigation3-*:1.3.0-alpha02</code>
    is released. Version 1.3.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..988ac9734e8223273eb7f186ee1639ee68deb025/navigation3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">SceneInfo</code>
      class has added
      <code translate="no" dir="ltr">title</code>
      and
      <code translate="no" dir="ltr">url</code>
      properties which are automatically populated from the Scene's last
      <code translate="no" dir="ltr">NavEntry's</code>
      metadata. Use
      <code translate="no" dir="ltr">TitleMetadataKey</code>
      and
      <code translate="no" dir="ltr">UrlMetadataKey</code>
      to define destination titles and URLs in the entry's metadata.. (
      <a href="https://android-review.googlesource.com/#/q/I78a209a080a2dbe0748eb1e3bf82c7a981ab4052">I78a20</a>
      ,
      <a href="https://issuetracker.google.com/issues/542693522">b/542693522</a>
      )
    </li>
  </ul>
