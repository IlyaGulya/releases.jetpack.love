  <p>
    <code translate="no" dir="ltr">androidx.navigation3:navigation3-*:1.2.1</code>
    is released. Version 1.2.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/811e8c9c37f4955d520fe0cf7e39d96866066abc..65822252146d26e872acf03dc11bda43f11efa3b/navigation3">these commits</a>
