changelogHtml: |
  <h3 id="1.2.0-alpha01" data-text="Version 1.2.0-alpha01" tabindex="-1">Version 1.2.0-alpha01</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.enterprise:enterprise-feedback:1.2.0-alpha01</code>
    and
    <code translate="no" dir="ltr">androidx.enterprise:enterprise-feedback-testing:1.2.0-alpha01</code>
    are released. Version 1.2.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/55d7bedcdcca20013223c29e0cde8d11c86970ae..9c8961185ed7c431b9e78870acb3393f8f27cd1e/enterprise">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Merged public and experimental API files for d,e,f,g-paths (
      <a href="https://android-review.googlesource.com/#/q/I03646bc0839d44b40105cff9bd4662c77e0d3c50">I03646</a>
      ,
      <a href="https://issuetracker.google.com/issues/278769092">b/278769092</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Moving the default
      <code translate="no" dir="ltr">minSdk</code>
      from API 21 to API 23 (
      <a href="https://android-review.googlesource.com/#/q/Ibdfca5942dbb414ca07594ba240093db14aad4df">Ibdfca</a>
      ,
      <a href="https://issuetracker.google.com/issues/380448311">b/380448311</a>
      ,
      <a href="https://issuetracker.google.com/issues/435705964">b/435705964</a>
      ,
      <a href="https://issuetracker.google.com/issues/435705223">b/435705223</a>
      )
    </li>
    <li>
      This library now uses
      <a href="https://jspecify.dev/">JSpecify nullness annotations</a>
      , which are type-use. Kotlin developers should use the following compiler arguments to enforce correct usage: -Xjspecify-annotations=strict, -Xtype-enhancement-improvements-strict-mode (
      <a href="https://android-review.googlesource.com/#/q/I3d340562cef73af357f6a763dc663893f6a46be2">I3d340</a>
      ,
      <a href="https://issuetracker.google.com/issues/326456246">b/326456246</a>
      )
    </li>
    <li>
      Fixed a
      <code translate="no" dir="ltr">ClassCastException</code>
      or
      <code translate="no" dir="ltr">NullPointerException</code>
      that could occur in
      <code translate="no" dir="ltr">KeyedAppStatesService</code>
      when processing received application states.
      <a href="https://android-review.googlesource.com/q/I6909a28aa177923ff594652adb24d1175564d93b">I6909a28a</a>
    </li>
  </ul>
