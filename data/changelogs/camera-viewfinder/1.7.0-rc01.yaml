changelogHtml: |
  <h3 id="1.7.0-rc01" data-text="Version 1.7.0-rc01" tabindex="-1">Version 1.7.0-rc01</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.camera.viewfinder:viewfinder-compose:1.7.0-rc01</code>
    ,
    <code translate="no" dir="ltr">androidx.camera.viewfinder:viewfinder-core:1.7.0-rc01</code>
    , and
    <code translate="no" dir="ltr">androidx.camera.viewfinder:viewfinder-view:1.7.0-rc01</code>
    are released. Version 1.7.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/bb117e26ce89b888d6f928ff7b604913a1da43f2..678ffa9bb7ff9b6d63e55a32c452a45716cfdd71/camera/viewfinder">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
