changelogHtml: |
  <h3 id="1.7.0-alpha03" data-text="Version 1.7.0-alpha03" tabindex="-1">Version 1.7.0-alpha03</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.camera.viewfinder:viewfinder-compose:1.7.0-alpha03</code>
    ,
    <code translate="no" dir="ltr">androidx.camera.viewfinder:viewfinder-core:1.7.0-alpha03</code>
    , and
    <code translate="no" dir="ltr">androidx.camera.viewfinder:viewfinder-view:1.7.0-alpha03</code>
    are released. Version 1.7.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/01f3396e92df911805f22836f27c7057324e40ff..bb117e26ce89b888d6f928ff7b604913a1da43f2/camera/viewfinder">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed a resource leak in Viewfinder where SurfaceControl was not properly released. (
      <a href="https://android-review.googlesource.com/#/q/If9da74a407ef76195309f7aaa9bf108a93c0d87b">If9da7</a>
      ,
      <a href="https://issuetracker.google.com/issues/532595493">b/532595493</a>
      )
    </li>
  </ul>
