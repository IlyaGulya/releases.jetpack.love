    <li>
      Added
      <code translate="no" dir="ltr">default</code>
      parameters to the enum, number, and boolean
      <code translate="no" dir="ltr">A2uiProperty</code>
      types. (
      <a href="https://android-review.googlesource.com/#/q/Id509ea0050b3e3a0e075057ea56683727fe72f3d">Id509e</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
