    </li>
    <li>
      Added an
      <code translate="no" dir="ltr">A2uiMessageParser</code>
      factory function. (
      <a href="https://android-review.googlesource.com/#/q/I8596a193904d3b64666d23b5ee3974d7cf7be20d">I8596a</a>
      ,
      <a href="https://issuetracker.google.com/issues/524122705">b/524122705</a>
