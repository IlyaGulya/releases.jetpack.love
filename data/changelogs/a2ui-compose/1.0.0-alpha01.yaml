changelogHtml: |
  <h3 id="1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.a2ui.compose:compose-runtime:1.0.0-alpha01</code>
    ,
    <code translate="no" dir="ltr">androidx.a2ui.compose:compose-ui:1.0.0-alpha01</code>
    , and
    <code translate="no" dir="ltr">androidx.a2ui.compose:compose-ui-testing:1.0.0-alpha01</code>
    are released. Version 1.0.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b1263fbaa920727652ed50caea8ba2ebafa5fe02/a2ui/compose">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <p>
    The Jetpack Compose Agent-to-UI (A2UI) renderer provides an implementation of the
    <a href="https://a2ui.org/">A2UI protocol</a>
    , enabling AI agents to generate rich, interactive user interfaces that render native Compose components—without executing arbitrary code. This library maps the A2UI protocol messages to Compose primitives while providing fine-grained reactivity based on the Compose Snapshot state system. The library also provides APIs for creating custom components and catalogs.
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Updated
      <code translate="no" dir="ltr">A2uiBasicCatalogV1.CatalogId</code>
      from
      <code translate="no" dir="ltr">.../v0_9_1/...</code>
      to
      <code translate="no" dir="ltr">.../v0_9/...</code>
      to align with the canonical A2UI protocol specification. (
      <a href="https://android-review.googlesource.com/#/q/Idcc200a889013467320122c875f5fd5fd44de290">Idcc20</a>
      )
    </li>
    <li>
      Update the order of components in
      <code translate="no" dir="ltr">A2uiBasicCatalogV</code>
      to exactly match the basic catalog specification. (
      <a href="https://android-review.googlesource.com/#/q/I230939bd796e442c60e4a9ca5b5965878916f802">I23093</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">ChecksProperty</code>
      to all relevant component interfaces under
      <code translate="no" dir="ltr">A2uiBasicCatalogV1</code>
      and made the property value available via a parameter passed to
      <code translate="no" dir="ltr">TypedContent</code>
      of each component. (
      <a href="https://android-review.googlesource.com/#/q/I9f39367d32484b6a5b728562acd3dbe7edfb7ccd">I9f393</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">A2uiBasicCatalogV1.ChoicePicker</code>
      and
      <code translate="no" dir="ltr">MaterialA2uiBasicCatalogV1Defaults.choicePicker</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I875a6aea544fe4efd44cd8b8d010b081d72cc66d">I875a6</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">A2uiBasicCatalogV1.Modal</code>
      and
      <code translate="no" dir="ltr">MaterialA2uiBasicCatalogV1Defaults.modal</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Icd553cf262a716b992a27c940d4bda2d8b4119d5">Icd553</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
    </li>
    <li>
      Renamed properties in
      <code translate="no" dir="ltr">A2uiBasicCatalogV1</code>
      to follow the pascal-case naming style. (
      <a href="https://android-review.googlesource.com/#/q/I91512359e62c5276d3adf60e04cac95772d8a209">I91512</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">AccessibilityProperty</code>
