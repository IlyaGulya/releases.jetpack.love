      <a href="https://android-review.googlesource.com/#/q/I7283655b702d654e9ee64a463e81939327cadf89">I72836</a>
      ,
      <a href="https://issuetracker.google.com/issues/547815898">b/547815898</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">minItems</code>
      and
      <code translate="no" dir="ltr">maxItems</code>
      parameters to the list
      <code translate="no" dir="ltr">A2uiProperty</code>
      types. (
      <a href="https://android-review.googlesource.com/#/q/I716d39da2dd792d8738e153fa733c70afae9ea6b">I716d3</a>
      ,
      <a href="https://issuetracker.google.com/issues/547798330">b/547798330</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">A2uiProperty.enum</code>
      ,
      <code translate="no" dir="ltr">A2uiProperty.custom</code>
      , and
      <code translate="no" dir="ltr">A2uiProperty.dynamicCustom</code>
      property types. (
      <a href="https://android-review.googlesource.com/#/q/I0647d44fc52e7cb17830b44c597fa28e91ff277b">I0647d</a>
