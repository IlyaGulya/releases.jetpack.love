    </li>
    <li>
      Added the
      <code translate="no" dir="ltr">A2uiRuntimeCatalog</code>
      marker interface, and APIs in
      <code translate="no" dir="ltr">androidx.a2ui.compose.ui</code>
      for defining components and catalogs. (
      <a href="https://android-review.googlesource.com/#/q/Ibea7af8717ff058cbfce0dcb5d39acfb5ec6318f">Ibea7a</a>
      ,
      <a href="https://issuetracker.google.com/issues/527415547">b/527415547</a>
      ,
      <a href="https://issuetracker.google.com/issues/524122705">b/524122705</a>
      )
    </li>
    <li>
      Moved
      <code translate="no" dir="ltr">androidx.compose.runtime:runtime-a2ui</code>
