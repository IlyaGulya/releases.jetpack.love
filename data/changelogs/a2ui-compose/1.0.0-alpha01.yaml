    <li>
      Added
      <code translate="no" dir="ltr">A2uiBasicCatalogV1.Card</code>
      and
      <code translate="no" dir="ltr">MaterialA2uiBasicCatalogV1Defaults.card</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Icf604e02bd57ac18730e2058dc2e77f038b6dc31">Icf604</a>
      ,
      <a href="https://issuetracker.google.com/issues/547851648">b/547851648</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">isAdditionalPropertiesAllowed</code>
      and
      <code translate="no" dir="ltr">additionalPropertiesSchema</code>
      parameters to
      <code translate="no" dir="ltr">A2uiProperty.nested</code>
      and
      <code translate="no" dir="ltr">A2uiProperty.nestedList</code>
