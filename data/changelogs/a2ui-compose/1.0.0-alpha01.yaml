      <a href="https://issuetracker.google.com/issues/524122705">b/524122705</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/Id18ea0acdf0e152f649ce8e2435bf3d6e39d5947">Id18ea</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
    <li>
      Updated default
      <code translate="no" dir="ltr">Column</code>
      horizontal alignment to
      <code translate="no" dir="ltr">Alignment.Start</code>
      in
      <code translate="no" dir="ltr">A2UI Basic Catalog V1</code>
      .
      <a href="https://android-review.googlesource.com/q/Ia1c6db2a2902e951bee353981ad26db57c61e251">Ia1c6db</a>
    </li>
    <li>
      Updated default
      <code translate="no" dir="ltr">Row</code>
      vertical alignment to
      <code translate="no" dir="ltr">Alignment.Top</code>
      in
      <code translate="no" dir="ltr">A2UI Basic Catalog V1</code>
      .
      <a href="https://android-review.googlesource.com/q/If0bca47da9917016a075c2537e4f82c44ddbde4e">If0bca4</a>
    </li>
  </ul>
