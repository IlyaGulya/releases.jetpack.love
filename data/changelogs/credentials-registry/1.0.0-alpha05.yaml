libraryId: credentials-registry
groupId: androidx.credentials
version: 1.0.0-alpha05
releaseDate: 2026-07-29
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha05" data-text="Version 1.0.0-alpha05" tabindex="-1">Version 1.0.0-alpha05</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.credentials.registry:registry-*:1.0.0-alpha05</code>
    is released. Version 1.0.0-alpha05 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ec985eed3cba8444e5aaa52a748333397a1298f3..511bc67370bf35672a0f99026b32f8cc850f59e9/credentials/registry">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">supportedProtocols</code>
      optional parameter to
      <code translate="no" dir="ltr">OpenId4VpRegistry</code>
      constructor for
      <code translate="no" dir="ltr">OpenID4VP</code>
      protocol registrations. (
      <a href="https://android-review.googlesource.com/#/q/Id50530b771f923bc761b37b1e19099369bb97ba1">Id5053</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">metadataDisplayText</code>
      property to
      <code translate="no" dir="ltr">VerificationEntryDisplayProperties</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I62ba54cfc9e62c1b3bdeecd215316dd51041eb55">I62ba54</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">explainer</code>
      and
      <code translate="no" dir="ltr">warning</code>
      fields were missing from the verification JSON payload generated by
      <code translate="no" dir="ltr">OpenId4VpRegistry</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I933e073762b34b95e4f0e8224cd967310d33bc69">I933e07</a>
      )
    </li>
  </ul>
  <h2 id="credentials_registry_10_2" data-text="Credentials Registry 1.0" tabindex="-1">Credentials Registry 1.0</h2>
