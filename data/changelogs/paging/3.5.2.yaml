changelogHtml: |
  <h3 id="3.5.2" data-text="Version 3.5.2" tabindex="-1">Version 3.5.2</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.paging:paging-*:3.5.2</code>
    is released. Version 3.5.2 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a529819e192125f997c07106fe4c2878d7279bdb..a617b93b1fc9fc1d0ce47dc52dd1454ab99823de/paging">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">Pager.append()</code>
      calls before initial refresh completes will no longer throw
      <code translate="no" dir="ltr">NoSuchElementException</code>
      . The append call will be no-op. (
      <a href="https://android-review.googlesource.com/#/q/Ide38759c5173093b1b26bf3902454c60052e344c">Ide387</a>
      ,
      <a href="https://issuetracker.google.com/issues/556780796">b/556780796</a>
      )
    </li>
  </ul>
