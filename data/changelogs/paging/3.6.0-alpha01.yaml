changelogHtml: |
  <h3 id="3.6.0-alpha01" data-text="Version 3.6.0-alpha01" tabindex="-1">Version 3.6.0-alpha01</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.paging:paging-*:3.6.0-alpha01</code>
    is released. Version 3.6.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/0989c329f4dba2ac30bba57247e28fe6d99e1244..3e55c1ad889c6c0087b0bf6720b1a970b6e8ea3b/paging">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">ItemSnapshotList</code>
      extensions for Lazy foundations. You can now call
      <code translate="no" dir="ltr">ItemSnapshotList#itemKey</code>
      and
      <code translate="no" dir="ltr">ItemSnapshotList#itemContentType</code>
      to auto generate
      <code translate="no" dir="ltr">itemKey</code>
      and
      <code translate="no" dir="ltr">contentType</code>
      for Lazy foundation. (
      <a href="https://android-review.googlesource.com/#/q/I7345578e82feb7e0d423ea63120a29289fb9bf57">I73455</a>
      ,
      <a href="https://issuetracker.google.com/issues/560754841">b/560754841</a>
      )
    </li>
  </ul>
  <p><strong>External Contribution</strong></p>
  <ul>
    <li>
      Thank you
      <a href="https://github.com/kfaraj">Kamal</a>
      for adding the
      <code translate="no" dir="ltr">ItemSnapshotList</code>
      extensions.
    </li>
  </ul>
  <h2 id="version_35_2" data-text="Version 3.5" tabindex="-1">Version 3.5</h2>
