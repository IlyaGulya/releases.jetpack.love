changelogHtml: |
  <h3 id="3.5.1" data-text="Version 3.5.1" tabindex="-1">Version 3.5.1</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.paging:paging-*:3.5.1</code>
    is released. Version 3.5.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/d0f5daa3f889fbbaad88763d8e0bc8dfbf90f03f..a529819e192125f997c07106fe4c2878d7279bdb/paging">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed
      <code translate="no" dir="ltr">PagingSource.getRefreshKey</code>
      providing an incorrect
      <code translate="no" dir="ltr">anchorPosition</code>
      that is too large when refreshing a page with separators while scrolling into placeholders. (
      <a href="https://android-review.googlesource.com/#/q/I475f09990005e3bcd7143cc4cf99a1a1cf2fb33a">I475f0</a>
      ,
      <a href="https://issuetracker.google.com/issues/516565503">b/516565503</a>
      )
    </li>
  </ul>
