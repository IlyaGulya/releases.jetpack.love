changelogHtml: |
  <h3 id="3.5.3" data-text="Version 3.5.3" tabindex="-1">Version 3.5.3</h3>
  <p>October 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.paging:paging-*:3.5.3</code>
    is released. Version 3.5.3 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a617b93b1fc9fc1d0ce47dc52dd1454ab99823de..0989c329f4dba2ac30bba57247e28fe6d99e1244/paging">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">ItemSnapshotListFlow</code>
      will no longer throw
      <code translate="no" dir="ltr">IllegalArgumentException</code>
      when a
      <code translate="no" dir="ltr">RemoteMediator</code>
      has reached the end of pagination in either direction and a Header or Footer is converted to a terminal separator. (
      <a href="https://android-review.googlesource.com/#/q/I821c7ecd7be663f9851d3804bab5795547ef4a4c">I821c7</a>
      ,
      <a href="https://issuetracker.google.com/issues/566336825">b/566336825</a>
      )
    </li>
    <li>
      When loaded page exceed
      <code translate="no" dir="ltr">PagingConfig.maxSize</code>
      , loaded pages will not drop to under two pages to ensure the viewport is properly populated with data. (
      <a href="https://android-review.googlesource.com/#/q/I037a0b6b5d203badc7fa5ecb279a67290fe7575e">I037a0</a>
      ,
      <a href="https://issuetracker.google.com/issues/565835910">b/565835910</a>
      )
    </li>
  </ul>
  <p><strong>External Contribution</strong></p>
  <p>
    Thank you
    <a href="https://github.com/Igorpetinik">Igor</a>
    for submitting the bug fix
    <a href="https://issuetracker.google.com/issues/565835910">b/565835910</a>
  </p>
