changelogHtml: |
  <h3 id="1.7.0-beta02" data-text="Version 1.7.0-beta02" tabindex="-1">Version 1.7.0-beta02</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose:compose-*:1.7.0-beta02</code>
    is released. Version 1.7.0-beta02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/73e22c60975d7fb8491f51f0de9d82843e170f82..4d31d8cda78e225595adc4a3d5ebc5b5f1abc1d9/wear/compose">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Updated baseline profiles for Wear Compose Foundation, Material3, and Navigation3 libraries. (
      <a href="https://android-review.googlesource.com/#/q/I9b0a3340a892d8adce9df11fcc35c4591670e702">I9b0a3</a>
      )
    </li>
    <li>
      Fix gesture hint animation flicker in
      <code translate="no" dir="ltr">OneHandedGestureScrollIndicator</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I650c6c7fb9d147294c2b446a8c8838b25c8ae15d">6e0c1cb</a>
      )
    </li>
  </ul>
