changelogHtml: |
  <h3 id="1.7.1" data-text="Version 1.7.1" tabindex="-1">Version 1.7.1</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose:compose-*:1.7.1</code>
    is released. Version 1.7.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/974f75a2305793f54e6bb6e29da386db7b44b202..1bb7f7817e31806882acfe7e83ce184fc89db859/wear/compose">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fix
      <code translate="no" dir="ltr">OneHandedGestureHintScrollIndicator</code>
      animation flicker (
      <a href="https://android-review.googlesource.com/#/q/I650c6c7fb9d147294c2b446a8c8838b25c8ae15d">I650c6</a>
      )
    </li>
    <li>
      Remove scroll lock from
      <code translate="no" dir="ltr">OneHandedGestureScrollIndicator</code>
      and manage indicator visibility in
      <code translate="no" dir="ltr">ScreenScaffold</code>
      with a composition local (
      <a href="https://android-review.googlesource.com/#/q/I13050fd124d53861b6012a1beb236584e21513d3">I13050</a>
      )
    </li>
    <li>
      Fix
      <code translate="no" dir="ltr">IllegalStateException</code>
      in
      <code translate="no" dir="ltr">Modifier.oneHandedGesture</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I351518f5b72edca8d46b45f96f9c874865841fc7">I35151</a>
      )
    </li>
  </ul>
