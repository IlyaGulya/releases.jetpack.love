changelogHtml: |
  <h3 id="1.4.2" data-text="Version 1.4.2" tabindex="-1">Version 1.4.2</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.protolayout:protolayout-*:1.4.2</code>
    is released. Version 1.4.2 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/81d018cf57252f81bc13a95eb11dc08f2e3bf723..a7c65b8f3ace04dcaca1dd5e12b45c27b2baf8ce/wear/protolayout">these commits</a>
    .
  </p>
  <p><strong>Vulnerability &amp; Security Fixes</strong></p>
  <ul>
    <li><p>Prevented crashes in the expression pipeline caused by invalid cubic bezier parameters in animations by falling back to a default interpolator.</p></li>
    <li>
      <p>
        Improved
        <code translate="no" dir="ltr">ProtoLayout</code>
        's renderer by wrapping exception handling to prevent crashes by guarding against non-finite values or invalid animations.
      </p>
    </li>
  </ul>
