changelogHtml: |
  <h3 id="1.9.0-alpha03" data-text="Version 1.9.0-alpha03" tabindex="-1">Version 1.9.0-alpha03</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.car.app:app-*:1.9.0-alpha03</code>
    is released. Version 1.9.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/6ff76682a45583f1f17c9e3c945d4fb6704bb9f8..79a2dcb030436c38d006807afc5ada74c93890bf/car/app">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <strong>Tab Global End Action</strong>
      : Added support for a global end action to
      <code translate="no" dir="ltr">TabTemplate</code>
      via
      <code translate="no" dir="ltr">setEndAction</code>
      and
      <code translate="no" dir="ltr">getEndAction</code>
      , along with
      <code translate="no" dir="ltr">ActionsConstraints.ACTIONS_CONSTRAINTS_TAB_ACTIONS</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I5c2032880a2cafdbf792ab3193cabf326ece7f34">I5c203</a>
      )
    </li>
    <li>
      <strong>Section Header Enhancements</strong>
      : Added
      <code translate="no" dir="ltr">setHeadline</code>
      to
      <code translate="no" dir="ltr">SectionHeader.Builder</code>
      (headline and subtitle are mutually exclusive), and relaxed icon constraints in
      <code translate="no" dir="ltr">SectionHeader.Builder.setStartIcon()</code>
      and
      <code translate="no" dir="ltr">setEndIcon()</code>
      to allow
      <code translate="no" dir="ltr">TYPE_URI</code>
      (
      <code translate="no" dir="ltr">content://</code>
      ) icons. (
      <a href="https://android-review.googlesource.com/#/q/I55e08f512ae49c062fd3b5c440fab5bcf860ced4">I55e08</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/I97243d547687726f0ca602f9b6d1239793a01d6a">I97243</a>
      )
    </li>
    <li>
      <strong>Progress Bar Track Color</strong>
      : Added
      <code translate="no" dir="ltr">trackColor</code>
      to
      <code translate="no" dir="ltr">CarProgressBarStyle</code>
      to customize the unfilled portion of a progress bar. (
      <a href="https://android-review.googlesource.com/#/q/I1c819bdb0336f76494bc213f49b9537014528d0d">I1c819</a>
      )
    </li>
    <li>
      <strong>
        Custom Tinted
        <code translate="no" dir="ltr">CarIcon</code>
      </strong>
      : Added
      <code translate="no" dir="ltr">CarIcon.createTintedIcon(IconCompat, CarColor)</code>
      to create a tinted icon with a custom tint color. (
      <a href="https://android-review.googlesource.com/#/q/Icb80453dc595c2acebd6c11f72e07b0c3152d2c8">Icb804</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Clarified documentation on
      <code translate="no" dir="ltr">CarProgressBar.Builder.setStyle()</code>
      and
      <code translate="no" dir="ltr">CarIcon.Builder.setStyle()</code>
      , and updated
      <code translate="no" dir="ltr">bouncycastle</code>
      dependency in
      <code translate="no" dir="ltr">:car:app:app-testing</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I2cdb36b8e315c806bf53fb1865361e6a6dfbb0df">I2cdb3</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/Ie02d5f36493fd8f16350e3d2443f2e2924b94f44">Ie02d5</a>
      )
    </li>
  </ul>
  <h2 id="version_19_4" data-text="Version 1.9" tabindex="-1">Version 1.9</h2>
