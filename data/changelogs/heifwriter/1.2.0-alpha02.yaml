changelogHtml: |
  <h3 id="heifwriter-1.2.0-alpha02" data-text="Version 1.2.0-alpha02" tabindex="-1">Version 1.2.0-alpha02</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.heifwriter:heifwriter:1.2.0-alpha02</code>
    is released. Version 1.2.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/46bcdef6281ae0f03c3a2bb2812edfc2c0e66d05..f623a42f7601579dc05a708d865816bfa0a0133d/heifwriter/heifwriter">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>Color Aspects &amp; HDR: Explicitly configured color range, standard, and transfer characteristics during encoding for 10-bit HDR and 8-bit SDR inputs.</li>
    <li>
      AVIF Encoding: Fixed
      <code translate="no" dir="ltr">EncoderBase</code>
      to use the correct MIME type for AVIF image encoding, and added a fallback to frame decoding when AVIF image metadata is missing.
    </li>
    <li>Buffer &amp; EXIF Handling: Fixed buffer sizing, EXIF bounds validation, and 10-bit YUV copy logic.</li>
    <li>Compatibility &amp; Tests: Resolved AV1 encoder configuration and 10-bit EGL test failures across supported devices.</li>
  </ul>
