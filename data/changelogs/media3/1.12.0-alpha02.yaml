libraryId: media3
groupId: androidx.media3
version: 1.12.0-alpha02
releaseDate: 2026-10-26
#language=html
changelogHtml: |
  <h3 id="1.12.0-alpha02" data-text="Version 1.12.0-alpha02" tabindex="-1">Version 1.12.0-alpha02</h3>
  <p>October 26, 2026</p>
  <p>
    Version 1.12.0-alpha02 contains the following
    <a href="https://github.com/androidx/media/commits/1.12.0-alpha02">commits</a>
    .
  </p>
  <ul>
    <li>
      Effect Play services:
      <ul>
        <li>
          Introduce a new
          <code translate="no" dir="ltr">media3-effect-play-services</code>
          module providing Google Play services media effects, including
          <code translate="no" dir="ltr">EnhancementSessionDecorator</code>
          for video enhancement and
          <code translate="no" dir="ltr">StudioSoundAudioProcessor</code>
          for audio source separation.
        </li>
      </ul>
    </li>
  </ul>
