libraryId: media3
groupId: androidx.media3
version: 1.12.0-rc01
releaseDate: 2026-11-25
#language=html
changelogHtml: |
  <h3 id="1.12.0-rc01" data-text="Version 1.12.0-rc01" tabindex="-1">Version 1.12.0-rc01</h3>
  <p>November 25, 2026</p>
  <p>
    Version 1.12.0-rc01 contains the following
    <a href="https://github.com/androidx/media/commits/1.12.0-rc01">commits</a>
    .
  </p>
  <ul>
    <li>
      ExoPlayer:
      <ul>
        <li>
          <code translate="no" dir="ltr">SampleStream.FLAG_OMIT_SAMPLE_DATA</code>
          now ensures that
          <code translate="no" dir="ltr">DecoderInputBuffer.cryptoInfo</code>
          is populated for encrypted samples. Custom
          <code translate="no" dir="ltr">SampleStream</code>
          implementations must be updated to adhere to this contract.
        </li>
        <li>
          Fix
          <code translate="no" dir="ltr">CryptoInfo.numBytesOfEncryptedData</code>
          over-reporting the encrypted payload size for full-sample encrypted samples with supplemental data (such as encrypted WebM/Matroska streams with block additions).
        </li>
        <li>
          Fix an issue where calling
          <code translate="no" dir="ltr">seekTo</code>
          while an ad is playing could freeze
          <code translate="no" dir="ltr">getCurrentPosition()</code>
          if another player operation (such as
          <code translate="no" dir="ltr">setPlayWhenReady</code>
          ) was still pending on the playback thread (
          <a href="https://github.com/androidx/media/issues/3512">#3512</a>
          ).
        </li>
        <li>
          Add support for dynamic scheduling in
          <code translate="no" dir="ltr">MetadataRenderer</code>
          to better align scheduling work and CPU wake-cycles to when metadata samples can be read or output. You can enable this using
          <code translate="no" dir="ltr">Flags.enableFlag(Flags.FLAG_METADATA_RENDERER_DURATION_TO_PROGRESS)</code>
          .
        </li>
        <li>
          Fix issue where
          <code translate="no" dir="ltr">ExoPlayer.isLoading()</code>
          remains
          <code translate="no" dir="ltr">true</code>
          when playback transitions to
          <code translate="no" dir="ltr">STATE_ENDED</code>
          or
          <code translate="no" dir="ltr">STATE_IDLE</code>
          , causing an
          <code translate="no" dir="ltr">IllegalArgumentException</code>
          in
          <code translate="no" dir="ltr">ForwardingSimpleBasePlayer</code>
          (
          <a href="https://github.com/androidx/media/issues/3467">#3467</a>
          ).
        </li>
        <li>
          Immediately wake up the playback loop to handle asynchronous
          <code translate="no" dir="ltr">MediaCodec</code>
          errors instead of waiting for the next scheduled rendering iteration.
        </li>
        <li>
          Fix an issue where
          <code translate="no" dir="ltr">Player.getCurrentPosition()</code>
          could freeze during audio offload playback (
          <a href="https://github.com/androidx/media/issues/3546">#3546</a>
          ).
        </li>
      </ul>
    </li>
    <li>
      Extractors:
      <ul>
        <li>
          Matroska: Fix
          <code translate="no" dir="ltr">ParserException</code>
          when parsing files with a non-standard
          <code translate="no" dir="ltr">0x80</code>
          element outside
          <code translate="no" dir="ltr">ChapterAtom</code>
          , such as
          <code translate="no" dir="ltr">MuxingApp</code>
          written by
          <code translate="no" dir="ltr">libmkv</code>
          0.6.4 / HandBrake 0.9.4 (
          <a href="https://github.com/androidx/media/issues/3562">#3562</a>
          ).
        </li>
      </ul>
    </li>
    <li>
      Inspector:
      <ul>
        <li>
          Fix
          <code translate="no" dir="ltr">MediaExtractorCompat.getSampleCryptoInfo</code>
          to copy all array fields into the caller's
          <code translate="no" dir="ltr">MediaCodec.CryptoInfo</code>
          , matching the platform
          <code translate="no" dir="ltr">MediaExtractor</code>
          and preventing subsequent calls or reads from overwriting previously returned arrays.
        </li>
        <li>
          Fix
          <code translate="no" dir="ltr">ParserException</code>
          in
          <code translate="no" dir="ltr">MetadataRetriever</code>
          when retrieving metadata from MP4 and MOV files with MPEG (MP1, MP2, MP3) or DTS audio tracks.
        </li>
      </ul>
    </li>
    <li>
      Text:
      <ul>
        <li>
          Fix
          <code translate="no" dir="ltr">IndexOutOfBoundsException</code>
          when parsing a WebVTT cue with multiple
          <code translate="no" dir="ltr">&lt;ruby&gt;</code>
          tags nested inside another tag (
          <a href="https://github.com/androidx/media/issues/3549">#3549</a>
          ).
        </li>
      </ul>
    </li>
    <li>
      Session:
      <ul>
        <li>
          Fix a bug where controllers from apps with notification listener access were marked as untrusted when the controller package wasn't explicitly queried in the session app's manifest (fixed for platform and legacy controllers on API 33+, and for all controllers on API 30+ when the listener service is exported) (
          <a href="https://github.com/androidx/media/issues/3507">#3507</a>
          ).
        </li>
      </ul>
    </li>
    <li>
      UI:
      <ul>
        <li>
          Fix an issue where
          <code translate="no" dir="ltr">PlayerSurface</code>
          and
          <code translate="no" dir="ltr">ContentFrame</code>
          with
          <code translate="no" dir="ltr">SURFACE_TYPE_SURFACE_VIEW</code>
          turned surrounding Compose backgrounds black on Android 11 and earlier (
          <a href="https://github.com/androidx/media/issues/2638">#2638</a>
          ,
          <a href="https://github.com/androidx/media/issues/3285">#3285</a>
          ,
          <a href="https://github.com/androidx/media/issues/3466">#3466</a>
          ).
        </li>
        <li>
          Configure a width-based fractional seek tolerance in
          <code translate="no" dir="ltr">ExoPlayer.getScrubbingModeParameters()</code>
          when
          <code translate="no" dir="ltr">ProgressSlider</code>
          in
          <code translate="no" dir="ltr">media3-ui-compose-material3</code>
          is used with
          <code translate="no" dir="ltr">ExoPlayer</code>
          .
        </li>
        <li>
          Fix
          <code translate="no" dir="ltr">PlayerControlView</code>
          settings popup alignment when the control view or its parent has padding or window insets applied (
          <a href="https://github.com/androidx/media/issues/234">#234</a>
          ).
        </li>
        <li>
          Apply the user's system caption style and text size in
          <code translate="no" dir="ltr">SubtitleView</code>
          (and therefore
          <code translate="no" dir="ltr">PlayerView</code>
          ) even if the system "Show captions" setting is off, so that subtitles turned on in the app match the user's preferences. This is guarded by
          <code translate="no" dir="ltr">Flags.FLAG_APPLY_USER_CAPTION_STYLE_IF_CAPTIONS_DISABLED</code>
          , which is enabled in canary mode.
        </li>
      </ul>
    </li>
    <li>
      OkHttp extension:
      <ul>
        <li>
          Fix the error code of failures in
          <code translate="no" dir="ltr">OkHttpDataSource.open</code>
          before a response arrives, which was always
          <code translate="no" dir="ltr">ERROR_CODE_IO_NETWORK_CONNECTION_FAILED</code>
          . For example, a timeout now gets
          <code translate="no" dir="ltr">ERROR_CODE_IO_NETWORK_CONNECTION_TIMEOUT</code>
          , and a cleartext request that the network security policy blocks now throws
          <code translate="no" dir="ltr">CleartextNotPermittedException</code>
          .
        </li>
      </ul>
    </li>
    <li>
      HLS extension:
      <ul>
        <li>
          Fix playback failure for multivariant playlists that declare a non-positive
          <code translate="no" dir="ltr">FRAME-RATE</code>
          (for example
          <code translate="no" dir="ltr">FRAME-RATE=0.000</code>
          ), which are now parsed as having an unknown frame rate (
          <a href="https://github.com/androidx/media/issues/3540">#3540</a>
          ).
        </li>
      </ul>
    </li>
    <li>
      Cast extension:
      <ul>
        <li>
          Fix an issue where
          <code translate="no" dir="ltr">RemoteCastPlayer</code>
          cleared its timeline before transferring playback state back to the local player in
          <code translate="no" dir="ltr">CastPlayer</code>
          when the receiver app stopped externally (
          <a href="https://github.com/androidx/media/issues/2182">#2182</a>
          ).
        </li>
      </ul>
    </li>
  </ul>
