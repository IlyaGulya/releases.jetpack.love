changelogHtml: |
  <h3 id="1.4.0-alpha01" data-text="Version 1.4.0-alpha01" tabindex="-1">Version 1.4.0-alpha01</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.coordinatorlayout:coordinatorlayout:1.4.0-alpha01</code>
    is released. Version 1.4.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/c75bdbab8bebc2c00788ed8427172c46b9463345..47204469ad7a534a5fac14a8059c3935ab220f62/coordinatorlayout/coordinatorlayout">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added a
      <code translate="no" dir="ltr">CoordinatorLayout.Behavior#onRequestChildRectangleOnScreen</code>
      overload that provides the request source to Behaviors and updated compileSdk to API 36.1 (
      <a href="https://android-review.googlesource.com/#/q/Ibddfdf906bc11dfef550688ebbcf9b086be0abf8">Ibddfd</a>
      )
    </li>
    <li>
      Removing obsolete @RequiresApi(21) annotations (
      <a href="https://android-review.googlesource.com/#/q/Ic47923dcc82f4b7c4638fadb10c2c0268b414fcd">Ic4792</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Moving the default minSdk from API 21 to API 23 (
      <a href="https://android-review.googlesource.com/#/q/Ibdfca5942dbb414ca07594ba240093db14aad4df">Ibdfca</a>
      ,
      <a href="https://issuetracker.google.com/issues/380448311">b/380448311</a>
      ,
      <a href="https://issuetracker.google.com/issues/435705964">b/435705964</a>
      ,
      <a href="https://issuetracker.google.com/issues/435705223">b/435705223</a>
      )
    </li>
  </ul>
  <h2 id="version_13_2" data-text="Version 1.3" tabindex="-1">Version 1.3</h2>
