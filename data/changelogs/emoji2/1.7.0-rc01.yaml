changelogHtml: |
  <h3 id="1.7.0-rc01" data-text="Version 1.7.0-rc01" tabindex="-1">Version 1.7.0-rc01</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.emoji2:emoji2-*:1.7.0-rc01</code>
    is released. Version 1.7.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/8a1952bf7de9742b8d81da766a2849d2c51f8803..dc5da9e3ab63099a55bab9baf115d72000763773/emoji2">these commits</a>
    .
  </p>
  <p>This release focuses on performance improvements and is recommended for all users of emoji2.</p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
