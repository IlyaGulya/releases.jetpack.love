changelogHtml: |
  <h3 id="1.0.0-alpha18" data-text="Version 1.0.0-alpha18" tabindex="-1">Version 1.0.0-alpha18</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.compose.material3:material3:1.0.0-alpha18</code>
    is released. Version 1.0.0-alpha18 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/92a04f7c6f34453321c5cf56381648170950a0c5..091d76ac871fdd07fb106d973634cfa739fede9c/xr/compose/material3/material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Renamed
      <code translate="no" dir="ltr">OrbiterAlignment</code>
      to
      <code translate="no" dir="ltr">OrbiterPosition</code>
      and added support for configuring independent horizontal and vertical edge alignments on Orbiter corner alignment subclasses. Deprecated
      <code translate="no" dir="ltr">OrbiterEdgeOffsetType</code>
      in favor of
      <code translate="no" dir="ltr">EdgeAlignment</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ib2fbcee3b36dcfa3a59b27b20cc3a25479918f33">Ib2fbc</a>
      )
    </li>
    <li>
      Prefix Material XR components with
      <code translate="no" dir="ltr">Spatial</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I0e6453e8afe0e61ded532ef55159065a6a6a6964">I0e645</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">EnableXrComponentOverrides</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I09652fa9a53a22ef5a72b98ecee37e1a6a6a6964">I09652</a>
      )
    </li>
    <li>
      Remove Component Override APIs for
      <code translate="no" dir="ltr">NavigationSuiteScaffold</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ie63405700ba969d573139c24f43f8c126a6a6964">Ie6340</a>
      )
    </li>
    <li>
      Remove Component Override APIs for
      <code translate="no" dir="ltr">ThreePaneScaffold</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I9ceb51e5f53c4c33f6db261a4688df856a6a6964">I9ceb5</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">AnimatedSpatialVisibility</code>
      and associated usages (
      <a href="https://android-review.googlesource.com/#/q/I1dffa919595e92cd9e27f082d0ef39bb3c4aec22">I1dffa</a>
      )
    </li>
    <li>
      Deprecated
      <code translate="no" dir="ltr">FloatingToolbarScrollBehavior.floatingScrollBehavior</code>
      extension function in favor of
      <code translate="no" dir="ltr">val floatingScrollBehaviorModifier: Modifier</code>
      property. (
      <a href="https://android-review.googlesource.com/#/q/Ifbbec5cd2487b263216b51d7fb156cc0839791a9">Ifbbec</a>
      )
    </li>
    <li>
      Update Material to use new Orbiter API and
      <code translate="no" dir="ltr">OrbiterEdgeOffsetType</code>
      API (
      <a href="https://android-review.googlesource.com/#/q/Ifa08514c979918c24f5a798a0af8b7244b032feb">Ifa085</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">ComponentOverride</code>
      APIs (
      <a href="https://android-review.googlesource.com/#/q/I3784b34708b1721a9b866f7ae808431a6a6a6964">I3784b</a>
      )
    </li>
    <li>
      Introduced a new Orbiter API variant using
      <code translate="no" dir="ltr">SpatialAlignment</code>
      ,
      <code translate="no" dir="ltr">DpVolumeOffset</code>
      , and
      <code translate="no" dir="ltr">OrbiterOffsetType</code>
      for true 3D spatial placement using continuous layout biases. The previous
      <code translate="no" dir="ltr">OrbiterAnchorPoint</code>
      -based variant has been deprecated (
      <a href="https://android-review.googlesource.com/#/q/Ibdcb56123b766f273fee0e79c05a31687b3d7c95">Ibdcb5</a>
      )
    </li>
    <li>
      Make Animation/Transition Apis experimental (
      <a href="https://android-review.googlesource.com/#/q/I07d9835a5451c1be31f931d1d4f54656a131ba8b">I07d98</a>
      )
    </li>
    <li>
      Update resizable modifier to use a
      <code translate="no" dir="ltr">ResizePolicy</code>
      instead of two modifiers (
      <a href="https://android-review.googlesource.com/#/q/I7fb0fff7c7abe5ab3cffe2a118fec42cf61f4684">I7fb0f</a>
      )
    </li>
    <li>
      Added movable overload with
      <code translate="no" dir="ltr">movePolicy</code>
      param and deprecate
      <code translate="no" dir="ltr">transformingMovable</code>
      and
      <code translate="no" dir="ltr">movable</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ic88c1d6acf919b741f6f50bca3f61da958caab70">Ic88c1</a>
      )
    </li>
    <li>
      Deprecated
      <code translate="no" dir="ltr">ResizePolicy</code>
      and the old resizable modifier, replacing it with a new
      <code translate="no" dir="ltr">SubspaceModifier.resizable</code>
      overload and
      <code translate="no" dir="ltr">SubspaceModifier.transformingResizable</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I9e4bc9d09bfe3403584598201b1ca06169553660">I9e4bc</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Updated Compose dependencies in Material 3 to 1.13.0-alpha03. (
      <a href="https://android-review.googlesource.com/#/q/I6f41b016b8759c3388c93453d784f8b83535d171">I6f41b</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
