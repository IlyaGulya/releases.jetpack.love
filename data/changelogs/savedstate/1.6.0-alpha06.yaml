changelogHtml: |
  <h3 id="1.6.0-alpha06" data-text="Version 1.6.0-alpha06" tabindex="-1">Version 1.6.0-alpha06</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.savedstate:savedstate-*:1.6.0-alpha06</code>
    is released. Version 1.6.0-alpha06 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/3566803898b060d7136357220affc9ece8236019..3e55c1ad889c6c0087b0bf6720b1a970b6e8ea3b/savedstate">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Migrate
      <code translate="no" dir="ltr">LocalSavedStateRegistryOwner</code>
      to use
      <code translate="no" dir="ltr">compositionLocalWithHostDefaultOf</code>
      and
      <code translate="no" dir="ltr">SavedStateRegistryOwnerHostDefaultKey</code>
      detaching it from being directly retrieved as part of the view tree outside of Android. (
      <a href="https://android-review.googlesource.com/#/q/I6768fa3b94b5b8c72132c5e61e60bcab674ae057">I6768f</a>
      )
    </li>
  </ul>
