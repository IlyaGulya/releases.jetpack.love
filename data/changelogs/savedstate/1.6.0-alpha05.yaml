version: 1.6.0-alpha05
releaseDate: 2026-10-21
#language=html
changelogHtml: |
  <h3 id="1.6.0-alpha05" data-text="Version 1.6.0-alpha05" tabindex="-1">Version 1.6.0-alpha05</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.savedstate:savedstate-*:1.6.0-alpha05</code>
    is released. Version 1.6.0-alpha05 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..3566803898b060d7136357220affc9ece8236019/savedstate">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Introduced a new
      <code translate="no" dir="ltr">SavedStateContainer</code>
      API to serve as the common implementation base for
      <code translate="no" dir="ltr">SaveableStateRegistry</code>
      ,
      <code translate="no" dir="ltr">SavedStateHandle</code>
      , and
      <code translate="no" dir="ltr">SavedStateRegisty</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I1da6d8e861f0d3fa6167744d96f05f1a7431b5a0">I1da6d</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">asContainer()</code>
      ,
      <code translate="no" dir="ltr">getOrCreateContainer()</code>
      to
      <code translate="no" dir="ltr">SavedStateRegistry</code>
      to allow creating child contains from a
      <code translate="no" dir="ltr">SavedStateRegistry</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Icb70933ca23e4006d2347d4f2734eacbf6401dda">Icb709</a>
      )
    </li>
  </ul>
