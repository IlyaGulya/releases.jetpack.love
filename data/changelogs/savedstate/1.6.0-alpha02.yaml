version: 1.6.0-alpha02
releaseDate: 2026-08-26
#language=html
changelogHtml: |
  <h3 id="1.6.0-alpha02" data-text="Version 1.6.0-alpha02" tabindex="-1">Version 1.6.0-alpha02</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.savedstate:savedstate-*:1.6.0-alpha02</code>
    is released. Version 1.6.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea/savedstate">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added public constructors to
      <code translate="no" dir="ltr">SavedStateRegistry</code>
      and made
      <code translate="no" dir="ltr">SavedStateRegistry</code>
      implement
      <code translate="no" dir="ltr">SavedStateProvider</code>
      and
      <code translate="no" dir="ltr">SavedStateRestorer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I3c6965da24b07771b21238110a5cbb207857a0fa">I3c696</a>
      )
    </li>
    <li>
      Added top-level
      <code translate="no" dir="ltr">SavedStateProvider</code>
      interface. (
      <a href="https://android-review.googlesource.com/#/q/I20f9ddaa6985ab899269e45057eab27cb13c627e">I20f9d</a>
      )
    </li>
    <li>
      Added top-level
      <code translate="no" dir="ltr">SavedStateRestorer</code>
      interface with
      <code translate="no" dir="ltr">restoreState(savedState: SavedState?)</code>
      and removed unreleased
      <code translate="no" dir="ltr">SavedStateRegistry.SavedStateConsumer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Idc01d36624ae9ea6e391e28b59282ef9529990ed">Idc01d</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">AutoRecreated</code>
      and
      <code translate="no" dir="ltr">runOnNextRecreation</code>
      are deprecated in favor of
      <code translate="no" dir="ltr">SavedStateProvider</code>
      and
      <code translate="no" dir="ltr">SavedStateRestorer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iadc007bb0fcc0699e6ee7e9cfe9df0b81e3ac83b">Iadc00</a>
      )
    </li>
    <li>
      Introduce
      <code translate="no" dir="ltr">SavedStateConsumer</code>
      interface on
      <code translate="no" dir="ltr">SavedStateRegistry</code>
      . Allows registered providers to automatically receive and consume restored state during restoration, or immediately upon registration if state is already restored. (
      <a href="https://android-review.googlesource.com/#/q/I9a37878f0ec721c5b1030316e432e322a8bc3a5c">I9a378</a>
      )
    </li>
  </ul>
