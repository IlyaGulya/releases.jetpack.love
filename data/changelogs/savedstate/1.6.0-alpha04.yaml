  <p>
    <code translate="no" dir="ltr">androidx.savedstate:savedstate-*:1.6.0-alpha04</code>
    is released. Version 1.6.0-alpha04 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f/savedstate">these commits</a>
