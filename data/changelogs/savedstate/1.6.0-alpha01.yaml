changelogHtml: |
  <h3 id="1.6.0-alpha01" data-text="Version 1.6.0-alpha01" tabindex="-1">Version 1.6.0-alpha01</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.savedstate:savedstate-*:1.6.0-alpha01</code>
    is released. Version 1.6.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/696d8ec0adf47d3d677cb0f42a5974f1f97fb411..84c5d1a43793a411eac9868e4e16a8a62cfb08b7/savedstate">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Require Compose UI 1.8.0+ to use
      <code translate="no" dir="ltr">LocalSavedStateRegistryOwner</code>
      . This removes internal reflection fallbacks, improving performance but enforcing a strict dependency upgrade for clients. (
      <a href="https://android-review.googlesource.com/#/q/I16fb0e5d5241a9f5586c9c8d23987f666b7ea2bb">I16fb0</a>
      )
    </li>
  </ul>
  <h2 id="version_15_2" data-text="Version 1.5" tabindex="-1">Version 1.5</h2>
