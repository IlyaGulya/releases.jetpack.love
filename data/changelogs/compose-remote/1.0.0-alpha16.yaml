libraryId: compose-remote
groupId: androidx.compose
version: 1.0.0-alpha16
releaseDate: 2026-07-29
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha16" data-text="Version 1.0.0-alpha16" tabindex="-1">Version 1.0.0-alpha16</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote:remote-*:1.0.0-alpha16</code>
    is released. Version 1.0.0-alpha16 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e37cf4eae99bdc35def1209921d658612e2edbc3..71326c6294706a0c9bb08b8ed17a18a7778bd762/compose/remote">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Exposed companion object and invoke factories for
      <code translate="no" dir="ltr">RemoteImageBitmap</code>
      to allow instantiating remote image bitmaps from a URL or
      <code translate="no" dir="ltr">ImageBitmap</code>
      in non-composable contexts. (
      <a href="https://android-review.googlesource.com/#/q/I4dbc72e06d603f3cb8754d9ec0bf56810e634c1b">I4dbc7</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">LineBreak</code>
      strategy and hyphenation frequency in
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I7f2e6e44b7d83c67d64a5f0fd45dc9616a6a6964">I7f2e6</a>
      ,
      <a href="https://issuetracker.google.com/issues/510078059">b/510078059</a>
      )
    </li>
    <li>
      Promoted
      <code translate="no" dir="ltr">RemotePaint</code>
      interface to public. (
      <a href="https://android-review.googlesource.com/#/q/Ida62b8e1c51de02aa174f63c41eb31ca75d670f4">Ida62b</a>
      ,
      <a href="https://issuetracker.google.com/issues/465743273">b/465743273</a>
      )
    </li>
    <li>
      Removed deprecated shorthand comparison operators (
      <code translate="no" dir="ltr">eq</code>
      ,
      <code translate="no" dir="ltr">ne</code>
      ,
      <code translate="no" dir="ltr">lt</code>
      ,
      <code translate="no" dir="ltr">le</code>
      ,
      <code translate="no" dir="ltr">gt</code>
      ,
      <code translate="no" dir="ltr">ge</code>
      ) across
      <code translate="no" dir="ltr">RemoteFloat</code>
      ,
      <code translate="no" dir="ltr">RemoteInt</code>
      , and
      <code translate="no" dir="ltr">RemoteBoolean</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ie01a909f914ccef2ef1f11e28cd7822e0d8bae79">Ie01a9</a>
      ,
      <a href="https://issuetracker.google.com/issues/532022248">b/532022248</a>
      ,
      <a href="https://issuetracker.google.com/issues/532022248">b/532022248</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixes line height calculation in
      <code translate="no" dir="ltr">RemoteText</code>
      and constraints scaling in
      <code translate="no" dir="ltr">widthIn</code>
      /
      <code translate="no" dir="ltr">heightIn</code>
      modifiers. (
      <a href="https://android-review.googlesource.com/#/q/I89814d649923a6517cf760980aa6a16c64f3ef00">I89814</a>
      )
    </li>
    <li>
      Fixed state leak in
      <code translate="no" dir="ltr">RemoteComposePlayer</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I95630eae0ec536b4c9cbc7dd05b2b583b7297a77">I95630</a>
      ,
      <a href="https://issuetracker.google.com/issues/531743466">b/531743466</a>
      )
    </li>
  </ul>
