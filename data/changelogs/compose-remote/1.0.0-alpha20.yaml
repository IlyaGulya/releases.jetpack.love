libraryId: compose-remote
groupId: androidx.compose
version: 1.0.0-alpha20
releaseDate: 2026-09-23
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha20" data-text="Version 1.0.0-alpha20" tabindex="-1">Version 1.0.0-alpha20</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote:remote-*:1.0.0-alpha20</code>
    is released. Version 1.0.0-alpha20 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..7b7434f12dfb811bb3828261e14cd5c87ce8fa66/compose/remote">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Expose
      <code translate="no" dir="ltr">animateRemoteFloatAsState</code>
      ,
      <code translate="no" dir="ltr">animateRemoteDpAsState</code>
      ,
      <code translate="no" dir="ltr">RemoteAnimationSpec</code>
      ,
      <code translate="no" dir="ltr">RemoteModifier.sharedElement</code>
      ,
      <code translate="no" dir="ltr">RemoteModifier.sharedBounds</code>
      , and
      <code translate="no" dir="ltr">RemoteModifier.animateEnterExit</code>
      as public APIs (
      <a href="https://android-review.googlesource.com/#/q/I382ec85638618ee838f2c46cb400257cf86040e9">I382ec</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">relative*To</code>
      naming aliases and
      <code translate="no" dir="ltr">quadraticTo</code>
      /
      <code translate="no" dir="ltr">cubicTo</code>
      overloads to
      <code translate="no" dir="ltr">RemotePathScope</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I4ebcadde1d7cfdc918b3191d50b36217daeceeb1">I4ebca</a>
      )
    </li>
    <li>
      Added shape helpers (
      <code translate="no" dir="ltr">addRect</code>
      ,
      <code translate="no" dir="ltr">addOval</code>
      ,
      <code translate="no" dir="ltr">addCircle</code>
      ,
      <code translate="no" dir="ltr">addRoundRect</code>
      ,
      <code translate="no" dir="ltr">addArc</code>
      ,
      <code translate="no" dir="ltr">addPath</code>
      ) and
      <code translate="no" dir="ltr">RemoteOffset</code>
      /
      <code translate="no" dir="ltr">RemoteSize</code>
      overloads to
      <code translate="no" dir="ltr">RemotePathScope</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I14972b389d644bebe3d33b38e43b46bd9bea9dfb">I14972</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">arcTo</code>
      with
      <code translate="no" dir="ltr">forceMoveTo</code>
      support to
      <code translate="no" dir="ltr">RemotePathScope</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ib5cf078fadebe8fa46143611a6acdba6f0096b1b">Ib5cf0</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">CollapsibleColumnLayout</code>
      and
      <code translate="no" dir="ltr">CollapsibleRowLayout</code>
      <code translate="no" dir="ltr">minIntrinsicWidth</code>
      /Height exceeded exact constraints when children were present. (
      <a href="https://android-review.googlesource.com/#/q/Ic2a6fd28d9d4c471ab78b3fbb165711a411a1b5d">Ic2a6f</a>
      )
    </li>
    <li>
      Added a new
      <code translate="no" dir="ltr">EventActionOperation</code>
      that allows users to specify custom event handlers. (
      <a href="https://android-review.googlesource.com/#/q/I161bc655d32d1f8f88be945b21bb1bdf3c0cbc3f">I161bc</a>
      )
    </li>
    <li>
      Fixed named
      <code translate="no" dir="ltr">RemoteDp</code>
      expressions mis-scaling by display density. (
      <a href="https://android-review.googlesource.com/#/q/I78bf529c347148ca071ff999d55fca4edfb09ff4">I78bf5</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/I99bfdb355ffd7f1083dbdac4167b1f5577740116">I99bfd</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
    <li>
      Added Brush styling, alpha, winding (
      <code translate="no" dir="ltr">PathFillType</code>
      ), and procedural drawing support to
      <code translate="no" dir="ltr">RemoteVectorPainter</code>
      and
      <code translate="no" dir="ltr">RemoteImageVector</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I7e69e8894de5daab01900415190ad9667e0691d5">I7e69e</a>
      )
    </li>
    <li>
      Added support for Animated Vector Drawables (AVD) in Remote Compose with injectable progress and default continuous animation. (
      <a href="https://android-review.googlesource.com/#/q/Ic02232e72411b5fdbf0ac2727415d358132fe933">Ic0223</a>
      )
    </li>
    <li>
      Fixed performance regression when recording padding and offset modifiers with
      <code translate="no" dir="ltr">RemoteDp</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Id8bc9abb69cc814316b57675a97c0d83650d3969">Id8bc9</a>
      ,
      <a href="https://issuetracker.google.com/issues/555795653">b/555795653</a>
      )
    </li>
  </ul>
