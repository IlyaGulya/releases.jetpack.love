libraryId: compose-remote
groupId: androidx.compose
version: 1.0.0-alpha18
releaseDate: 2026-08-26
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha18" data-text="Version 1.0.0-alpha18" tabindex="-1">Version 1.0.0-alpha18</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote:remote-*:1.0.0-alpha18</code>
    is released. Version 1.0.0-alpha18 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..0f510de14252cfbba4cf679e0f847d84f7821531/compose/remote">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">RemoteAbsoluteAlignment</code>
      is now public and accessible outside of the library group. (
      <a href="https://android-review.googlesource.com/#/q/Id9ceb191c4ed9bdca555a96bbfa31309b34f2a9d">Id9ceb</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">fontFeatureSettings</code>
      and
      <code translate="no" dir="ltr">fontVariationSettings</code>
      support in
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      ,
      <code translate="no" dir="ltr">RemoteText</code>
      , and
      <code translate="no" dir="ltr">RemoteTimeText</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I6e78d7a602506d1a5741ad4dbe6f713720214527">I6e78d</a>
      ,
      <a href="https://issuetracker.google.com/issues/544644370">b/544644370</a>
      )
    </li>
    <li>
      Added support for
      <code translate="no" dir="ltr">fontVariationSettings</code>
      in
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I2c44ac1efd17e49a575ec53f0336c8c666275a48">I2c44a</a>
      ,
      <a href="https://issuetracker.google.com/issues/542047368">b/542047368</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteCollapsibleColumn</code>
      and
      <code translate="no" dir="ltr">RemoteCollapsibleRow</code>
      are now public and accessible outside of the library group. (
      <a href="https://android-review.googlesource.com/#/q/I5ec72f7f918dee26d9d70885bbaa42a30fd4da6b">I5ec72</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteFitBox</code>
      (formerly
      <code translate="no" dir="ltr">FitBox</code>
      ) is now public and accessible outside of the library group. (
      <a href="https://android-review.googlesource.com/#/q/I689be830248f9a933752871f5a07da4a93f1c1fd">I689be</a>
      )
    </li>
    <li>
      Exposed
      <code translate="no" dir="ltr">RemoteMatrix3x3</code>
      and
      <code translate="no" dir="ltr">RemoteShaderBrush</code>
      .
      <code translate="no" dir="ltr">applyTo</code>
      to allow applying matrix transformations to shaders. (
      <a href="https://android-review.googlesource.com/#/q/I59594c0926aa8524c92535d0114abcbd3c33448d">I59594</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteModifier</code>
      .
      <code translate="no" dir="ltr">graphicsLayer</code>
      is now public and accessible outside of the library group. (
      <a href="https://android-review.googlesource.com/#/q/I59c2ccc26031725b7447add4fe04f7b9c2252cb8">I59c2c</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fix border width scaling and alignment in
      <code translate="no" dir="ltr">RemoteButton</code>
      and
      <code translate="no" dir="ltr">RemoteCard</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I8458bb022067d3b3decf4d9a1ef9746ab46f2827">I8458b</a>
      ,
      <a href="https://issuetracker.google.com/issues/544653389">b/544653389</a>
      )
    </li>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">animateRemoteFloat</code>
      discarded animation specifications when operating on expressions or using default parameters. (
      <a href="https://android-review.googlesource.com/#/q/I80e988f85a5ae5d4e89c97699ae5e02f8e721551">I80e98</a>
      ,
      <a href="https://issuetracker.google.com/issues/544687132">b/544687132</a>
      )
    </li>
  </ul>
