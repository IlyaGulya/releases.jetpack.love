libraryId: compose-remote
groupId: androidx.compose
version: 1.0.0-alpha17
releaseDate: 2026-08-12
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha17" data-text="Version 1.0.0-alpha17" tabindex="-1">Version 1.0.0-alpha17</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote:remote-*:1.0.0-alpha17</code>
    is released. Version 1.0.0-alpha17 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/61ee8cd421d0c0252d8db0253b739de537999371..e25ec03c7788f3a71bd0290253e35cb311fa4f5f/compose/remote">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Promoted several
      <code translate="no" dir="ltr">RemoteCompose</code>
      unit and type conversion APIs to public, including
      <code translate="no" dir="ltr">toRemoteFloat()</code>
      ,
      <code translate="no" dir="ltr">toRemoteLong()</code>
      ,
      <code translate="no" dir="ltr">toPx(density)</code>
      ,
      <code translate="no" dir="ltr">asRdp()</code>
      ,
      <code translate="no" dir="ltr">toRemoteDp()</code>
      ,
      <code translate="no" dir="ltr">asRemoteTextUnit()</code>
      , and
      <code translate="no" dir="ltr">toRsp()</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Idca36af6cab36eb22de99b70d45a4cb367659252">Idca36</a>
      ,
      <a href="https://issuetracker.google.com/issues/465743273">b/465743273</a>
      )
    </li>
    <li>
      Promoted
      <code translate="no" dir="ltr">drawCircle</code>
      ,
      <code translate="no" dir="ltr">drawOval</code>
      , and
      <code translate="no" dir="ltr">drawLine</code>
      in
      <code translate="no" dir="ltr">RemoteDrawScope</code>
      to public. (
      <a href="https://android-review.googlesource.com/#/q/Iccf346a83f6830b6f37935909e762996fbe8bf46">Iccf34</a>
      ,
      <a href="https://issuetracker.google.com/issues/465743273">b/465743273</a>
      )
    </li>
    <li>
      Added arithmetic and comparison operations to
      <code translate="no" dir="ltr">RemoteDp</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I4b7124d5e9a18fb48847028cbd28771c7b715976">I4b712</a>
      ,
      <a href="https://issuetracker.google.com/issues/467023174">b/467023174</a>
      )
    </li>
    <li>
      Exposed
      <code translate="no" dir="ltr">RemoteBrush</code>
      ,
      <code translate="no" dir="ltr">radialGradient</code>
      , and
      <code translate="no" dir="ltr">sweepGradient</code>
      as public APIs in remote-creation-compose. (
      <a href="https://android-review.googlesource.com/#/q/I24695287ebc231f83aa384c38418eeece4493882">I24695</a>
      ,
      <a href="https://issuetracker.google.com/issues/465743273">b/465743273</a>
      )
    </li>
  </ul>
  <p><strong>Other</strong></p>
  <ul>
    <li>
      Move to default
      <code translate="no" dir="ltr">minSdk</code>
      24. (
      <a href="https://android-review.googlesource.com/#/q/I972dab1c69d8d9ab1fe5a4dd73e07a4ddedd413d">I972da</a>
      ,
      <a href="https://issuetracker.google.com/issues/474169350">b/474169350</a>
      )
    </li>
    <li>
      Disallow parent touch interception when
      <code translate="no" dir="ltr">RemoteComposeView</code>
      handles touch. (
      <a href="https://android-review.googlesource.com/#/q/I4c6cd250030696ffa246023fc3a2d86591708b76">I4c6cd</a>
      ,
      <a href="https://issuetracker.google.com/issues/514549600">b/514549600</a>
      )
    </li>
  </ul>
