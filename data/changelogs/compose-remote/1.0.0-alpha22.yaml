libraryId: compose-remote
groupId: androidx.compose
version: 1.0.0-alpha22
releaseDate: 2026-10-21
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha22" data-text="Version 1.0.0-alpha22" tabindex="-1">Version 1.0.0-alpha22</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote:remote-*:1.0.0-alpha22</code>
    is released. Version 1.0.0-alpha22 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/988ac9734e8223273eb7f186ee1639ee68deb025..a0c645de83b353f2aa79c3b33a11e8ba853ca1e4/compose/remote">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      Introduced the
      <code translate="no" dir="ltr">androidx.compose.remote:remote-creation-expression</code>
      library, which will be expanded in upcoming releases with platform-agnostic expressions and remote state representations. (
      <a href="https://android-review.googlesource.com/#/q/I4f4f244f914224a40556f21cc8f738d826ce9629">I4f4f2</a>
      )
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteTimeVariables</code>
      and
      <code translate="no" dir="ltr">RemoteConfiguration</code>
      objects for accessing time, animation, and display/window context variables as
      <code translate="no" dir="ltr">RemoteFloat</code>
      ,
      <code translate="no" dir="ltr">RemoteInt</code>
      and
      <code translate="no" dir="ltr">RemoteDp</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I277c87acc8951b85340afd9bae7c290eb786fa99">I277c8</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">currentProfileSupportsThemedColors</code>
      (),
      <code translate="no" dir="ltr">currentProfileSupportsTouchModifiers</code>
      (), and
      <code translate="no" dir="ltr">currentProfileSupports</code>
      () to check whether the current
      <code translate="no" dir="ltr">RemoteCompose</code>
      creation profile supports themed colors, touch modifiers, or specific operations. (
      <a href="https://android-review.googlesource.com/#/q/I7b312b59a43356a759607b1af2150b1e2c9f4ea0">I7b312</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RemoteModifier.animateEnterExit</code>
      to default
      <code translate="no" dir="ltr">animationId</code>
      to -1 instead of 0 so enter/exit transitions are enabled, added an optional
      <code translate="no" dir="ltr">animationId</code>
      parameter, and disallowed 0 in
      <code translate="no" dir="ltr">sharedElement</code>
      ,
      <code translate="no" dir="ltr">sharedBounds</code>
      , and
      <code translate="no" dir="ltr">animateEnterExit</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I3e5bf0722918b397dfe263c7e878510cd8d7e02f">I3e5bf</a>
      )
    </li>
    <li>
      Decoupled
      <code translate="no" dir="ltr">RemoteDp</code>
      and
      <code translate="no" dir="ltr">RemoteDensity</code>
      from Compose UI
      <code translate="no" dir="ltr">Dp</code>
      and
      <code translate="no" dir="ltr">TextUnit</code>
      types. (
      <a href="https://android-review.googlesource.com/#/q/Ib42cd934b8dae8aa8a178670014cd0188666dae1">Ib42cd</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/I31b37b1ce3b9e4208a9fc8c0fe07a8ece0620a57">I31b37</a>
      )
    </li>
    <li>
      Removed
      <code translate="no" dir="ltr">combinedFontVariationSettings</code>
      from
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      and added
      <code translate="no" dir="ltr">fontFeatureSettings</code>
      to
      <code translate="no" dir="ltr">RemotePaint</code>
      to honor Compose separation of font features and font variations. (
      <a href="https://android-review.googlesource.com/#/q/I91856d55995f0c08d0dd021a47397ff9d611b24c">I91856</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">RemoteTextStyle.fromTextStyle</code>
      now selects font variation settings from the font that matches the style's font weight and font style. (
      <a href="https://android-review.googlesource.com/#/q/I2ab3914794f82f425e1b256acec001e693faf7d2">I2ab39</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">pendingIntentAction</code>
      not sending its
      <code translate="no" dir="ltr">PendingIntent</code>
      in the embedded player and launcher widgets, and
      <code translate="no" dir="ltr">hostAction</code>
      with a dynamic name losing its value. (
      <a href="https://android-review.googlesource.com/#/q/Ic172667c58be06047deeab1c7e505e68acb88426">Ic1726</a>
      )
    </li>
    <li>
      Fixed multi-line
      <code translate="no" dir="ltr">Center</code>
      and
      <code translate="no" dir="ltr">End</code>
      text alignment in
      <code translate="no" dir="ltr">CoreText</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I9867c636718ab17248aa226ef913e9a6e8c75275">I9867c</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">captureSingleRemoteDocument</code>
      occasionally capturing stale state written by an effect when another thread applied a snapshot concurrently. (
      <a href="https://android-review.googlesource.com/#/q/Ib09f95da72d8f98480faef26bbd26368bc6554ad">Ib09f9</a>
      )
    </li>
    <li>
      Fixed nan encoded variable id comparisons in
      <code translate="no" dir="ltr">RemoteCompose</code>
      expression caches. (
      <a href="https://android-review.googlesource.com/#/q/Ibdc738cb33e8c386a05d6c230c0f3d4e0823d178">Ibdc73</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">TouchExpressions</code>
      not responding to touch in the embedded
      <code translate="no" dir="ltr">RcPlayer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ida924d4d61ec56d2bcd3dacf743f996048abd3f3">Ida924</a>
      )
    </li>
    <li>
      Remote scroll containers in the embedded
      <code translate="no" dir="ltr">RcPlayer</code>
      no longer pass leftover same-axis scroll to an enclosing host scroll container. (
      <a href="https://android-review.googlesource.com/#/q/Ia193bd4d93af0bf8dc328c02eef1da7c0d2faff5">Ia193b</a>
      )
    </li>
    <li>
      Fixed double and long clicks in the embedded
      <code translate="no" dir="ltr">RcPlayer</code>
      on components that also have a single click, and added support for touch down, up and cancel modifiers. (
      <a href="https://android-review.googlesource.com/#/q/I7372fe710ef8a48fa1b65a388bfc52f3f674b8ba">I7372f</a>
      )
    </li>
    <li>
      Fixed animated expression evaluation, document click areas, and haptic feedback in the embedded
      <code translate="no" dir="ltr">RcPlayer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I1156e89b38bc23380597226df0caac712d66ddbf">I1156e</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/I18831210cc8a9e4b76f5b4a60e0d9e0a81afb3e5">I18831</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/Idfc6ec33adff96519217b7343595b93d3f1763dc">Idfc6e</a>
      )
    </li>
  </ul>
