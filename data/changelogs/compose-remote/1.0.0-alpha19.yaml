libraryId: compose-remote
groupId: androidx.compose
version: 1.0.0-alpha19
releaseDate: 2026-09-09
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha19" data-text="Version 1.0.0-alpha19" tabindex="-1">Version 1.0.0-alpha19</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote:remote-*:1.0.0-alpha19</code>
    is released. Version 1.0.0-alpha19 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..e4bd62f853853bf3522ed15681c58ef28b09ed44/compose/remote">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">conicTo</code>
      and
      <code translate="no" dir="ltr">conicToRelative</code>
      to
      <code translate="no" dir="ltr">RemotePathScope</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Id49e51c1fee57f1f25506ea3f73e947d6580530c">Id49e5</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">createProfile</code>
      helper to remote-creation-compose (
      <a href="https://android-review.googlesource.com/#/q/I92f5cf8b16b875487dd622142fae6d6dfee8282b">I92f5c</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteModifier.defaultMinSize</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If86a524e62e4053fa404d841fb5c8d8444e26810">If86a5</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed density behavior scaling for
      <code translate="no" dir="ltr">RemoteDp</code>
      values across remote-compose modifiers, arrangements, and shapes. (
      <a href="https://android-review.googlesource.com/#/q/I55bb71e121102ce8106fd1d52e1e396b3a52e18e">I55bb7</a>
      )
    </li>
    <li>
      Fix horizontal alignment for autosized and centered/right-aligned complex text (
      <a href="https://android-review.googlesource.com/#/q/Ia4b9ba73aad31c7cd8a6b971bf5ac0bc3b0a9cf0">Ia4b9b</a>
      )
    </li>
  </ul>
