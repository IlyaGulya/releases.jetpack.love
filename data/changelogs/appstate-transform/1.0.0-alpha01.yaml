changelogHtml: |
  <h3 id="1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h3>
  <p>October 28, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.appstate.transform:transform-*:1.0.0-alpha01</code>
    is released. Version 1.0.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/56ca943f55b3d53ce513a0fa356fe8fe4c43fe9f/appstate/transform">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <p>
    <a href="https://developer.android.com/reference/kotlin/androidx/appstate/transform/package-summary"><code translate="no" dir="ltr">AppState Transform</code></a>
    is a new library built on the Compose runtime that allows for running a composition outside of your UI. The
    <code translate="no" dir="ltr">androidx.appstate.transform:transform</code>
    artifact provides the library APIs and it also comes with a
    <code translate="no" dir="ltr">androidx.appstate.transform:transform-testing</code>
    artifact for testing. Developers can use Transform to manage their composition anywhere within their app.
  </p>
