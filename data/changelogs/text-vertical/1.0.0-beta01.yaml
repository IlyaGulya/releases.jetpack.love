version: 1.0.0-beta01
releaseDate: 2026-08-26
#language=html
changelogHtml: |
  <h3 id="1.0.0-beta01" data-text="Version 1.0.0-beta01" tabindex="-1">Version 1.0.0-beta01</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.text:text-vertical:1.0.0-beta01</code>
    and
    <code translate="no" dir="ltr">androidx.text:text-vertical-compose:1.0.0-beta01</code>
    are released. Version 1.0.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/61ee8cd421d0c0252d8db0253b739de537999371..f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea/text">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Changed
      <code translate="no" dir="ltr">VerticalTextScope</code>
      from an interface to a concrete class. (
      <a href="https://android-review.googlesource.com/#/q/I44e71a46358c3633ef255d86e7a8d197c94268a3">I44e71</a>
      ,
      <a href="https://issuetracker.google.com/issues/549288808">b/549288808</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Updated documentation for
      <code translate="no" dir="ltr">combineUpright</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ib534bdb45f74a9174f9a543bee1d687209cd46ea">Ib534b</a>
      ,
      <a href="https://issuetracker.google.com/issues/548992014">b/548992014</a>
      )
    </li>
    <li>
      Removed incorrect API 36 minimum requirement documentation from
      <code translate="no" dir="ltr">VerticalText</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I4f8e9874ad7975354776c09609709d2f9c700f34">I4f8e9</a>
      ,
      <a href="https://issuetracker.google.com/issues/549288799">b/549288799</a>
      )
    </li>
    <li>
      Used calculated ascent ratio for vertical baseline offset in backport mode (
      <a href="https://android.googlesource.com/platform/frameworks/support/+/07339d708aa73fb814e9547ffa54d308071bd724">07339d7</a>
      ,
      <a href="https://issuetracker.google.com/issues/502088091">b/502088091</a>
      )
    </li>
  </ul>
