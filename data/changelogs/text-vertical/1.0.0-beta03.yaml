changelogHtml: |
  <h3 id="1.0.0-beta03" data-text="Version 1.0.0-beta03" tabindex="-1">Version 1.0.0-beta03</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.text:text-vertical:1.0.0-beta03</code>
    and
    <code translate="no" dir="ltr">androidx.text:text-vertical-compose:1.0.0-beta03</code>
    are released. Version 1.0.0-beta03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..5a2352ffc8afa3fb5a17bd7eb0c70ee5638bad18/text">these commits</a>
    .
  </p>
  <p>
    <strong>Note:</strong>
    This is intended to be the last beta release.
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      Added a "Subtitle Cue" tab to
      <code translate="no" dir="ltr">VerticalTextSampleActivity</code>
      to demonstrate
      <code translate="no" dir="ltr">VerticalText</code>
      capabilities, including rendering with wrapped height,
      <code translate="no" dir="ltr">toVerticalTextStyle()</code>
      ,
      <code translate="no" dir="ltr">RubySpan</code>
      ,
      <code translate="no" dir="ltr">EmphasisSpan</code>
      , Tate-chu-yoko,
      <code translate="no" dir="ltr">FontShearSpan</code>
      ,
      <code translate="no" dir="ltr">UnderlineSpan</code>
      , and
      <code translate="no" dir="ltr">StrikethroughSpan</code>
      .
      <a href="https://android-review.googlesource.com/q/I4799d1fec43f8be481c55c263599c3ed5def5f72">I4799d1</a>
      <a href="https://buganizer.corp.google.com/issues/571750156">b/571750156</a>
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed horizontal
      <code translate="no" dir="ltr">RubySpan</code>
      and
      <code translate="no" dir="ltr">EmphasisSpan</code>
      line height when using fonts with large top and bottom padding such as Noto Sans JP. (
      <a href="https://android-review.googlesource.com/#/q/Ib050716b4c36d500af06c51c094886db1209b6fa">Ib0507</a>
      ,
      <a href="https://issuetracker.google.com/issues/557316470">b/557316470</a>
      ) -
      <em>Thanks for the report, Numero-san!</em>
    </li>
    <li>
      Updated Compose dependencies to
      <code translate="no" dir="ltr">1.12.1</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I9ee7fd42956442635d8ca52c9fde4573a701e65e">I9ee7f</a>
      ,
      <a href="https://issuetracker.google.com/issues/569780191">b/569780191</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">VerticalText</code>
      now applies
      <code translate="no" dir="ltr">AnnotatedString</code>
      span styles and preserves
      <code translate="no" dir="ltr">AnnotatedString</code>
      spans and annotations in semantics. (
      <a href="https://android-review.googlesource.com/#/q/Ib077f6a7ea19193cebc8ee4c9ca6a65ddb300b91">Ib077f</a>
      ,
      <a href="https://issuetracker.google.com/issues/502088091">b/502088091</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RubySpan</code>
      and
      <code translate="no" dir="ltr">EmphasisSpan</code>
      not filling the background color of
      <code translate="no" dir="ltr">TextPaint.bgColor</code>
      or
      <code translate="no" dir="ltr">BackgroundColorSpan</code>
      in horizontal layout. (
      <a href="https://android-review.googlesource.com/#/q/I66ba8e34efdf50d2c5242dc1f7c51a05e042200a">I66ba8</a>
      ,
      <a href="https://issuetracker.google.com/issues/561269843">b/561269843</a>
      )
    </li>
    <li>
      Fixed background colors in vertical text that were drawn as outlines after a span set
      <code translate="no" dir="ltr">Paint.Style.STROKE</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I692edf199eb8203fc2a0b54cbd1a7148a16c21f1">I692ed</a>
      ,
      <a href="https://issuetracker.google.com/issues/566429122">b/566429122</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">CharacterStyle</code>
      spans that cover a full
      <code translate="no" dir="ltr">RubySpan</code>
      range in
      <code translate="no" dir="ltr">VerticalTextLayout</code>
      now also apply to the ruby text, and
      <code translate="no" dir="ltr">RubySpan.textScale</code>
      scales the font sizes that they set. Background colors now also fill the empty space above and below the shorter of the ruby text and the base text. (
      <a href="https://android-review.googlesource.com/#/q/I0dadc5a595659c9c6cddde5851b0751cf7ada4d1">I0dadc</a>
      ,
      <a href="https://issuetracker.google.com/issues/564268825">b/564268825</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">VerticalTextLayout</code>
      background height when upright text has multiple style runs. (
      <a href="https://android-review.googlesource.com/#/q/I7e31a64437ea4e306ca197bc65f6358c8eb87495">I7e31a</a>
      ,
      <a href="https://issuetracker.google.com/issues/565211671">b/565211671</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">VerticalText</code>
      retaining a stale background color when
      <code translate="no" dir="ltr">VerticalTextStyle.background</code>
      changes to
      <code translate="no" dir="ltr">Color.Unspecified</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia0861af33b5110db66c0e2f8a81b4b17087376f5">Ia0861</a>
      ,
      <a href="https://issuetracker.google.com/issues/565211671">b/565211671</a>
      )
    </li>
    <li>
      Fixed horizontal ruby and emphasis layouts skipping
      <code translate="no" dir="ltr">TextPaint</code>
      fields when copying the caller paint. (
      <a href="https://android-review.googlesource.com/#/q/Ia3043b72aa8155437aed08a17fddf19a197c0eac">Ia3043</a>
      ,
      <a href="https://issuetracker.google.com/issues/561269843">b/561269843</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">VerticalText</code>
      now draws the background color from
      <code translate="no" dir="ltr">VerticalTextStyle.background</code>
      behind plain
      <code translate="no" dir="ltr">String</code>
      text and behind plain
      <code translate="no" dir="ltr">String</code>
      ruby annotations in
      <code translate="no" dir="ltr">RubySpan</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If04930c29fdac4297afa9593176349cf45f80905">If0493</a>
      ,
      <a href="https://issuetracker.google.com/issues/564268825">b/564268825</a>
      )
    </li>
    <li>
      Fixed horizontal ruby layout leaving the shared working paint scaled after initialization. (
      <a href="https://android-review.googlesource.com/#/q/I3376022398a402d632d9d55ec310154607802fcb">I33760</a>
      ,
      <a href="https://issuetracker.google.com/issues/561269843">b/561269843</a>
      )
    </li>
    <li>
      Fixed the vertical text sample app so that a pan gesture cannot move the text out of view. (
      <a href="https://android-review.googlesource.com/#/q/If01084db6c6a72bcb665f803788860b1202aad70">If0108</a>
      ,
      <a href="https://issuetracker.google.com/issues/563461635">b/563461635</a>
      )
    </li>
    <li>
      Fixed the test app to demo emphasis mark position (
      <a href="https://android-review.googlesource.com/#/q/I3ffa3802cea6a2301afd8827d0c32db91261a9f5">I3ffa3</a>
      ,
      <a href="https://issuetracker.google.com/issues/559972132">b/559972132</a>
      )
    </li>
    <li>
      Added Kex symbolic execution branch tests for
      <code translate="no" dir="ltr">LineLayout</code>
      ,
      <code translate="no" dir="ltr">TextUtils</code>
      ,
      <code translate="no" dir="ltr">CanvasCompat</code>
      , and
      <code translate="no" dir="ltr">PaintCompat</code>
      .
      <a href="https://android-review.googlesource.com/q/I47edfe364a9eea5ee7c7be9bfbd01115827808b1">I47edf</a>
      <a href="https://buganizer.corp.google.com/issues/569212211">b/569212211</a>
    </li>
  </ul>
