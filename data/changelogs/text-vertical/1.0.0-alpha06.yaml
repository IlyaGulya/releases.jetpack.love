version: 1.0.0-alpha06
releaseDate: 2026-07-29
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha06" data-text="Version 1.0.0-alpha06" tabindex="-1">Version 1.0.0-alpha06</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.text:text-vertical:1.0.0-alpha06</code>
    and
    <code translate="no" dir="ltr">androidx.text:text-vertical-compose:1.0.0-alpha06</code>
    are released. Version 1.0.0-alpha06 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/df4b49eda6f6834b6bc4c8aa30a581fa577a511e..61ee8cd421d0c0252d8db0253b739de537999371/text">these commits</a>
    .
  </p>
  <p><strong>Important Changes</strong></p>
  <ul>
    <li>This release marks the final planned alpha version of the library.</li>
    <li>
      Finalized and refined the parameters in the
      <code translate="no" dir="ltr">VerticalText</code>
      composable
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Introduced
      <code translate="no" dir="ltr">VerticalTextStyle</code>
      for vertical text layout. (
      <a href="https://android-review.googlesource.com/#/q/I647a8f1f681b019f2a306575f9a83a73fd4602e3">I647a8</a>
      ,
      <a href="https://issuetracker.google.com/issues/512424512">b/512424512</a>
      )
    </li>
    <li>
      Introduced a new public DSL (
      <code translate="no" dir="ltr">VerticalTextScope</code>
      and
      <code translate="no" dir="ltr">buildVerticalText</code>
      ) in the
      <code translate="no" dir="ltr">text-vertical-compose</code>
      library (
      <a href="https://android-review.googlesource.com/#/q/I6faa75247b091a6bbc6e7f209e0c467e7a39b073">I6faa7</a>
      ,
      <a href="https://issuetracker.google.com/issues/502088091">b/502088091</a>
      )
    </li>
    <li>
      Introduce
      <code translate="no" dir="ltr">VerticalText</code>
      composable (
      <a href="https://android-review.googlesource.com/#/q/I96509c991366dfbd411b8125ba550753abda83fe">I96509</a>
      ,
      <a href="https://issuetracker.google.com/issues/502088091">b/502088091</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Clarified documentation for
      <code translate="no" dir="ltr">VerticalTextLayout</code>
      fallback behavior on older API levels. (
      <a href="https://android-review.googlesource.com/#/q/Ia7ccc156c5c1d1a8b69c106b331b8f1f7a89a304">Ia7ccc</a>
      ,
      <a href="https://issuetracker.google.com/issues/449184326">b/449184326</a>
      )
    </li>
  </ul>
