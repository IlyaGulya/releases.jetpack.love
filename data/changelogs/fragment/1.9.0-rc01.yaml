  <h3 id="1.9.0-rc01" data-text="Version 1.9.0-rc01" tabindex="-1">Version 1.9.0-rc01</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.fragment:fragment-*:1.9.0-rc01</code>
    is released. Version 1.9.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/9fc03893cb70909cdef7303e9f1c7dd1fa6d6a63..bede81fcebe81e2903482cd8611baecdc960c627/fragment">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      When using
      <code translate="no" dir="ltr">FragmentScenario.launchInContainer</code>
      the fragment under test will now be inside of a
      <code translate="no" dir="ltr">FragmentContainerView</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia6273c680180b5a3ea90450a2d0abf3e143667fe">Ia6273</a>
      ,
      <a href="https://issuetracker.google.com/issues/531550353">b/531550353</a>
      )
    </li>
  </ul>
