version: 1.9.0
releaseDate: 2026-08-12
#language=html
changelogHtml: |
  <h3 id="1.9.0" data-text="Version 1.9.0" tabindex="-1">Version 1.9.0</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.fragment:fragment-*:1.9.0</code>
    is released. Version 1.9.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f39ca3510efb2347ebfef231e25a3e804922450d..c3656c9a5f4a53bf56c5d6e2cb651be7ba362010/fragment">these commits</a>
    .
  </p>
  <p><strong>Important changes since 1.8.0:</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">Fragment</code>
      now implements the
      <code translate="no" dir="ltr">ContextAware</code>
      interface and can be used to execute code when the fragment is attached.
    </li>
    <li>
      The
      <code translate="no" dir="ltr">AndroidFragment</code>
      composable now accepts a
      <code translate="no" dir="ltr">maxLifecycle</code>
      paramater that allows you to cap the lifecycle state of the embedded
      <code translate="no" dir="ltr">Fragment</code>
      .
    </li>
    <li>
      <code translate="no" dir="ltr">Fragment</code>
      library now supports system tracing of the lifecycle event via
      <code translate="no" dir="ltr">Jetpack Tracing</code>
      .
    </li>
  </ul>
