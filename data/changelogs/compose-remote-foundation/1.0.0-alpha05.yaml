changelogHtml: |
  <h3 id="1.0.0-alpha05" data-text="Version 1.0.0-alpha05" tabindex="-1">Version 1.0.0-alpha05</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha05</code>
    is released. Version 1.0.0-alpha05 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/988ac9734e8223273eb7f186ee1639ee68deb025..95347b245f1527ec6856a3daa580a1c0abbddc11/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <h2 id="foundation_2" data-text="Foundation" tabindex="-1">Foundation</h2>
  <h3 id="version_10_5" data-text="Version 1.0" tabindex="-1">Version 1.0</h3>
  <h4 id="foundation-1.0.0-alpha04" data-text="Version 1.0.0-alpha04" tabindex="-1">Version 1.0.0-alpha04</h4>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha04</code>
    is released. Version 1.0.0-alpha04 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..dfba882dc7bd28aa4e7febb9c51b9a62fdfb14d0/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <h4 id="foundation-1.0.0-alpha03" data-text="Version 1.0.0-alpha03" tabindex="-1">Version 1.0.0-alpha03</h4>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha03</code>
    is released. Version 1.0.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..7b7434f12dfb811bb3828261e14cd5c87ce8fa66/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">ImageVector.toRemoteImageVector()</code>
      and
      <code translate="no" dir="ltr">RemoteImageVector.vectorResource(@DrawableRes id: Int)</code>
      to convert Compose UI
      <code translate="no" dir="ltr">ImageVector</code>
      and drawable vector resources to
      <code translate="no" dir="ltr">RemoteImageVector</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia8383096088ccfbf93f17af836cdff9fe34cc7e2">Ia8383</a>
      )
    </li>
  </ul>
  <h4 id="1.0.0-alpha02" data-text="Version 1.0.0-alpha02" tabindex="-1">Version 1.0.0-alpha02</h4>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha02</code>
    is released. Version 1.0.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..e4bd62f853853bf3522ed15681c58ef28b09ed44/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
  <h2 id="compose_remote_foundation_3" data-text="Compose Remote Foundation" tabindex="-1">Compose Remote Foundation</h2>
  <h3 id="version_10_6" data-text="Version 1.0" tabindex="-1">Version 1.0</h3>
  <h4 id="foundation-1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h4>
  <p>August 26, 2026</p>
  <p>
    The initial release of the
    <code translate="no" dir="ltr">androidx.compose.remote.foundation</code>
    library. The Remote Foundation library is designed to contain design system agnostic UI Components for Remote Compose.
  </p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha01</code>
    is released. Version 1.0.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/5790527f572101733cfbe2134e864d98fc1a3377/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Migrated basic Remote Compose widgets (
      <code translate="no" dir="ltr">RemoteBasicText</code>
      ,
      <code translate="no" dir="ltr">RemoteBasicImage</code>
      ,
      <code translate="no" dir="ltr">RemoteSpacer</code>
      ,
      <code translate="no" dir="ltr">RemoteBasicIcon</code>
      ) to the new remote-foundation library. (
      <a href="https://android-review.googlesource.com/#/q/I259b24dae1931f3508fba0eb0e40d6068ab82b5c">I259b2</a>
      ,
      <a href="https://issuetracker.google.com/issues/532028292">b/532028292</a>
      )
    </li>
  </ul>
