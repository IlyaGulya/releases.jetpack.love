changelogHtml: |
  <h3 id="1.0.0-alpha07" data-text="Version 1.0.0-alpha07" tabindex="-1">Version 1.0.0-alpha07</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha07</code>
    is released. Version 1.0.0-alpha07 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..58a4d1aa19df3743190e13146470e58c1c1aab8e/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Migrated
      <code translate="no" dir="ltr">RemoteBasicImage</code>
      and
      <code translate="no" dir="ltr">RemoteBasicText</code>
      to use
      <code translate="no" dir="ltr">Remote*</code>
      types (
      <code translate="no" dir="ltr">RemoteContentScale</code>
      ,
      <code translate="no" dir="ltr">RemoteTextOverflow</code>
      , etc.) instead of Compose UI types.
    </li>
  </ul>
