changelogHtml: |
  <h3 id="1.0.0-alpha06" data-text="Version 1.0.0-alpha06" tabindex="-1">Version 1.0.0-alpha06</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.remote.foundation:foundation:1.0.0-alpha06</code>
    is released. Version 1.0.0-alpha06 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/3566803898b060d7136357220affc9ece8236019..9b2acdf2ecd36aa5ddf9c43ebfc288ed11d2c49e/compose/remote/foundation/foundation">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Renamed
      <code translate="no" dir="ltr">remoteBitmap</code>
      to
      <code translate="no" dir="ltr">bitmap</code>
      on
      <code translate="no" dir="ltr">RemoteBasicImage</code>
      and moved
      <code translate="no" dir="ltr">style</code>
      to the final parameter on
      <code translate="no" dir="ltr">RemoteBasicText</code>
      to match Compose Foundation. (
      <a href="https://android-review.googlesource.com/#/q/I2b57acba50caad03246d3df009cf25533b1dbbd4">I2b57a</a>
      )
    </li>
  </ul>
