changelogHtml: |
  <h3 id="1.7.0-rc02" data-text="Version 1.7.0-rc02" tabindex="-1">Version 1.7.0-rc02</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.camera:camera-*:1.7.0-rc02</code>
    is released. Version 1.7.0-rc02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/678ffa9bb7ff9b6d63e55a32c452a45716cfdd71..c77cf64e9734c9c8f7497c161e5e631af91b111f/camera">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <p>
        Fixed an
        <code translate="no" dir="ltr">UnsupportedOperationException</code>
        on API 30 when apps with
        <code translate="no" dir="ltr">SYSTEM_ALERT_WINDOW</code>
        repeatedly bind camera use cases. (
        <a href="https://android-review.googlesource.com/q/I3235c1d64aa76a9084bdac63d81faa408e2f132f">I3235c</a>
        ,
        <a href="https://issuetracker.google.com/issues/575161911">b/575161911</a>
        )
      </p>
    </li>
    <li>
      <p>
        Fixed a native thread leak when unbinding
        <code translate="no" dir="ltr">VideoCapture</code>
        , which left one media framework thread behind per bind. (
        <a href="https://android-review.googlesource.com/#/q/If57302fe131c0771a60083be3a5128f99c1f5f77">If5730</a>
        ,
        <a href="https://issuetracker.google.com/issues/573671138">b/573671138</a>
        )
      </p>
    </li>
  </ul>
