  <h3 id="1.6.2" data-text="Version 1.6.2" tabindex="-1">Version 1.6.2</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.camera:camera-*:1.6.2</code>
    is released. Version 1.6.2 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/987b9ac8585b31424a397206c492196dd163997b..9046f07948c1e7a89aaec581463730f4d666611b/camera">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed a compilation crash on newer JDK versions when resolving transitively imported JSpecify type annotations on
      <code translate="no" dir="ltr">CameraX</code>
      internal fields. (
      <a href="https://android-review.googlesource.com/#/q/I00bb407877f4e608a23754eaff9a8f9cf572e6d1">I00bb4</a>
      ,
      <a href="https://issuetracker.google.com/issues/543937345">b/543937345</a>
      )
    </li>
  </ul>
