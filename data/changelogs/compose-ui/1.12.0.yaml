  <p>### Hardware-Accelerated Mesh Gradients (ui)</p>
  <p>
    • Painter API: Modifier.meshGradient is replaced by MeshGradientPainter, which uses hardware-accelerated Canvas.drawMesh.
    <br />
    • Usage: Use MeshGradientPainter inside Modifier.paint.
  </p>
  <devsite-code>
    <pre class="devsite-click-to-copy" translate="no" dir="ltr" is-upgraded="" syntax="Python" syntax-guessed=""><code translate="no" dir="ltr"><span class="devsite-syntax-kn">import</span><span class="devsite-syntax-w"> </span><span class="devsite-syntax-nn">androidx.compose.ui.draw.paint</span>                                                                                                                                                                                   
  <span class="devsite-syntax-kn">import</span><span class="devsite-syntax-w"> </span><span class="devsite-syntax-nn">androidx.compose.ui.geometry.Offset</span>                                                                                                                                                                              
  <span class="devsite-syntax-kn">import</span><span class="devsite-syntax-w"> </span><span class="devsite-syntax-nn">androidx.compose.ui.graphics.Color</span>                                                                                                                                                                               
  <span class="devsite-syntax-kn">import</span><span class="devsite-syntax-w"> </span><span class="devsite-syntax-nn">androidx.compose.ui.graphics.MeshGradientPainter</span>                                                                                                                                                                 

  <span class="devsite-syntax-n">val</span> <span class="devsite-syntax-n">meshPainter</span> <span class="devsite-syntax-o">=</span> <span class="devsite-syntax-n">remember</span> <span class="devsite-syntax-p">{</span>                                                                                                                                                                                            
      <span class="devsite-syntax-n">MeshGradientPainter</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-n">rows</span> <span class="devsite-syntax-o">=</span> <span class="devsite-syntax-mi">1</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-n">columns</span> <span class="devsite-syntax-o">=</span> <span class="devsite-syntax-mi">1</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-n">hasBicubicColor</span> <span class="devsite-syntax-o">=</span> <span class="devsite-syntax-n">true</span><span class="devsite-syntax-p">)</span> <span class="devsite-syntax-p">{</span>                                                                                                                                                
          <span class="devsite-syntax-n">setVertex</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">0</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">0</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-n">Offset</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">0</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">0</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">),</span> <span class="devsite-syntax-n">Color</span><span class="devsite-syntax-o">.</span><span class="devsite-syntax-n">Red</span><span class="devsite-syntax-p">)</span>                                                                                                                                                                      
          <span class="devsite-syntax-n">setVertex</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">0</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">1</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-n">Offset</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">1</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">0</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">),</span> <span class="devsite-syntax-n">Color</span><span class="devsite-syntax-o">.</span><span class="devsite-syntax-n">Blue</span><span class="devsite-syntax-p">)</span>                                                                                                                                                                     
          <span class="devsite-syntax-n">setVertex</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">1</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">0</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-n">Offset</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">0</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">1</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">),</span> <span class="devsite-syntax-n">Color</span><span class="devsite-syntax-o">.</span><span class="devsite-syntax-n">Green</span><span class="devsite-syntax-p">)</span>                                                                                                                                                                    
          <span class="devsite-syntax-n">setVertex</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">1</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">1</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-n">Offset</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-mi">1</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">,</span> <span class="devsite-syntax-mi">1</span><span class="devsite-syntax-n">f</span><span class="devsite-syntax-p">),</span> <span class="devsite-syntax-n">Color</span><span class="devsite-syntax-o">.</span><span class="devsite-syntax-n">Yellow</span><span class="devsite-syntax-p">)</span>                                                                                                                                                                   
      <span class="devsite-syntax-p">}</span>                                                                                                                                                                                                                   
  <span class="devsite-syntax-p">}</span>                                                                                                                                                                                                                       
  <span class="devsite-syntax-n">Box</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-n">Modifier</span><span class="devsite-syntax-o">.</span><span class="devsite-syntax-n">fillMaxSize</span><span class="devsite-syntax-p">()</span><span class="devsite-syntax-o">.</span><span class="devsite-syntax-n">paint</span><span class="devsite-syntax-p">(</span><span class="devsite-syntax-n">meshPainter</span><span class="devsite-syntax-p">))</span>                                                                                                                                                                          
  <span class="devsite-syntax-err">──────</span>                                                                                                                                                                                                                  
  </code></pre>
