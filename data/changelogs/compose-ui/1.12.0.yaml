  <h3 id="1.12.0" data-text="Version 1.12.0" tabindex="-1">Version 1.12.0</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.ui:ui-*:1.12.0</code>
    is released. Version 1.12.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/854220f44ea8ea80fee824a6c5a045f39bede289..963bf914f78b389bdddef0da7f36bee19d897274/compose/ui">these commits</a>
    .
  </p>
  <p>### Downloadable Variable Fonts &amp; Zero-Config Setup (ui-text-google-fonts)</p>
