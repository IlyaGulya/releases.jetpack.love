changelogHtml: |
  <h3 id="1.13.0-beta01" data-text="Version 1.13.0-beta01" tabindex="-1">Version 1.13.0-beta01</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.ui:ui-*:1.13.0-beta01</code>
    is released. Version 1.13.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/58589a3cd45bacbb3ad7bbdc52836f6e055340be..55d45bc889e6e54d26f897e1299b3f5d6ca78acb/compose/ui">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Reverted
      <code translate="no" dir="ltr">Modifier.interactionBarrier()</code>
      from the public API surface for 1.13. (
      <a href="https://android-review.googlesource.com/#/q/I47974742e47dac79d11c61477944288f61fd806e">I47974</a>
      ,
      <a href="https://issuetracker.google.com/issues/564575045">b/564575045</a>
      ,
      <a href="https://issuetracker.google.com/issues/347038246">b/347038246</a>
      )
    </li>
    <li>
      Updated
      <code translate="no" dir="ltr">PolygonShape</code>
      APIs: moved
      <code translate="no" dir="ltr">CornerRounding</code>
      to top-level with
      <code translate="no" dir="ltr">dp()</code>
      and
      <code translate="no" dir="ltr">fraction()</code>
      factories, replaced
      <code translate="no" dir="ltr">transformed()</code>
      and
      <code translate="no" dir="ltr">scaledToFit()</code>
      extensions with in-place mutable
      <code translate="no" dir="ltr">PolygonShape.transform(PolygonShapeTransformScope.() -&gt; Unit)</code>
      and
      <code translate="no" dir="ltr">PolygonShape.copy()</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If5970afe91c37146e7de4521ca916e59d31b924e">If5970</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">onValueChange</code>
      is now a required parameter on
      <code translate="no" dir="ltr">Slider</code>
      ,
      <code translate="no" dir="ltr">VerticalSlider</code>
      , and
      <code translate="no" dir="ltr">RangeSlider</code>
      . Removed previously hidden deprecated APIs across
      <code translate="no" dir="ltr">Slider</code>
      and
      <code translate="no" dir="ltr">RangeSlider</code>
      components, including the
      <code translate="no" dir="ltr">DraggableState</code>
      implementation on
      <code translate="no" dir="ltr">SliderState</code>
      and legacy
      <code translate="no" dir="ltr">Saver</code>
      overloads. Removed
      <code translate="no" dir="ltr">isVertical</code>
      from
      <code translate="no" dir="ltr">SliderState</code>
      . Deprecated
      <code translate="no" dir="ltr">SliderDefaults.Thumb</code>
      overload taking
      <code translate="no" dir="ltr">SliderState</code>
      in favor of the
      <code translate="no" dir="ltr">isVertical</code>
      overload. (
      <a href="https://android-review.googlesource.com/#/q/I3fdc1fdb72d5615f02ae192db1a0314b27af6984">I3fdc1</a>
      )
    </li>
    <li>
      The
      <code translate="no" dir="ltr">Posture</code>
      class in
      <code translate="no" dir="ltr">MediaQuery</code>
      has been replaced with
      <code translate="no" dir="ltr">WindowPosture</code>
      , which exposes physical
      <code translate="no" dir="ltr">WindowFold</code>
      s (
      <code translate="no" dir="ltr">FoldState</code>
      and
      <code translate="no" dir="ltr">FoldOrientation</code>
      ). Added
      <code translate="no" dir="ltr">isTabletop</code>
      and
      <code translate="no" dir="ltr">isFlat</code>
      convenience properties on
      <code translate="no" dir="ltr">WindowPosture</code>
      , and removed the explicit Book posture. (
      <a href="https://android-review.googlesource.com/#/q/Id9e8e81014a03f227ad55b18f2785c39a82e47e3">Id9e8e</a>
      )
    </li>
    <li>
      Libraries now target Kotlin 2.2 and require kotlinc 2.2 (
      <a href="https://android-review.googlesource.com/#/q/I823967fe6b9524b448184ef366c562316bd6a323">I82396</a>
      ,
      <a href="https://issuetracker.google.com/issues/498369605">b/498369605</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">@FloatRange</code>
      to
      <code translate="no" dir="ltr">BlurStop.fraction</code>
      , changed the default
      <code translate="no" dir="ltr">fallOffRadius</code>
      in
      <code translate="no" dir="ltr">BlurRadiusSpec.radialGradient</code>
      to
      <code translate="no" dir="ltr">Dp.Unspecified</code>
      , renamed
      <code translate="no" dir="ltr">Modifier.blur</code>
      's
      <code translate="no" dir="ltr">radius</code>
      parameter to
      <code translate="no" dir="ltr">blurRadiusSpec</code>
      , and renamed
      <code translate="no" dir="ltr">BlurScope.radius</code>
      to
      <code translate="no" dir="ltr">blurRadiusSpec</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I91dbc0667b6de356e44b9210ee2c553eb164b28b">I91dbc</a>
      ,
      <a href="https://issuetracker.google.com/issues/556335791">b/556335791</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an IllegalArgumentException ('LayoutNode not found in RectList') when alignment lines are queried during measurement. (
      <a href="https://android-review.googlesource.com/#/q/Icec9eff72dbc6e77ee168c26c36f37ca7b244bee">Icec9e</a>
      ,
      <a href="https://issuetracker.google.com/issues/549552303">b/549552303</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">VectorPainter</code>
      will now share internal graphics resources (
      <code translate="no" dir="ltr">ImageBitmap</code>
      ) when rendering the same
      <code translate="no" dir="ltr">ImageVector</code>
      across multiple composables. This reduces redundant texture uploads and memory usage, improving performance in scenarios like lists using repeated icons. This optimization can be disabled via
      <code translate="no" dir="ltr">ComposeUiFlags.isVectorDrawCacheSharingEnabled</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I91b41eaa35f998078fc03549397efff00ae0d42c">I91b41</a>
      )
    </li>
    <li>
      Fixed a bug where AndroidTextPaint.setTextMotion did not clear LINEAR_TEXT_FLAG when transitioning to FontHinting or None linearity. (
      <a href="https://android-review.googlesource.com/#/q/I8c19ce270938812313e58494b161ec5a96af5e04">I8c19c</a>
      )
    </li>
    <li>
      Fixed an issue where TalkBack touch exploration focus could jump to an embedded AndroidView (such as a WebView) covered by Compose UI content. (
      <a href="https://android-review.googlesource.com/#/q/I11372a68149ef9812845e284cad2966493960fa4">I11372</a>
      ,
      <a href="https://issuetracker.google.com/issues/561099702">b/561099702</a>
      )
    </li>
    <li>
      Fixed an issue where calling
      <code translate="no" dir="ltr">Color.toColorLong()</code>
      or setting a color composited over
      <code translate="no" dir="ltr">Color.Unspecified</code>
      on a Paint could crash with an
      <code translate="no" dir="ltr">IllegalArgumentException</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia365b26ee72fdf07f7196c5cff1628cc669daf2d">Ia365b</a>
      ,
      <a href="https://issuetracker.google.com/issues/557521315">b/557521315</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/I99bfdb355ffd7f1083dbdac4167b1f5577740116">I99bfd</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
    <li>
      Fixed parameter extraction in tooling for composables with &gt;10 parameters. (
      <a href="https://android-review.googlesource.com/#/q/Ib167d8da56b6d35d9c1265df389414f18fef1547">Ib167d</a>
      )
    </li>
    <li>
      Fixed an issue where deactivated layout nodes were not cleared from the layout queue, causing a crash during remeasure. (
      <a href="https://android-review.googlesource.com/#/q/Ie64a5213677927763a7105f27c0ac1113804b858">Ie64a5</a>
      )
    </li>
  </ul>
