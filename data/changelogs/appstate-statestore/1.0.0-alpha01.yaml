changelogHtml: |
  <h3 id="1.0.0-alpha01" data-text="Version 1.0.0-alpha01" tabindex="-1">Version 1.0.0-alpha01</h3>
  <p>October 28, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.appstate.statestore:statestore-*:1.0.0-alpha01</code>
    is released. Version 1.0.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/56ca943f55b3d53ce513a0fa356fe8fe4c43fe9f/appstate/statestore">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <p>
    <a href="https://developer.android.com/reference/kotlin/androidx/appstate/statestore/package-summary"><code translate="no" dir="ltr">AppState StateStore</code></a>
    is a new library built on the Compose runtime that acts as a wrapper to provide custom integrations. The
    <code translate="no" dir="ltr">androidx.appstate.statestore</code>
    artifact provides the library APIs and it also comes with a
    <code translate="no" dir="ltr">androidx.appstate.statestore:statestore-datastore</code>
    artifact for state persistence. Developers can use
    <code translate="no" dir="ltr">StateStore</code>
    to hoist their snapshot state into their application layer and the datastore integration to persist that state.
  </p>
