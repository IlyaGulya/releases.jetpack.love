#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha03" data-text="Version 1.0.0-alpha03" tabindex="-1">Version 1.0.0-alpha03</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.appstate.statestore:statestore-*:1.0.0-alpha03</code>
    is released. Version 1.0.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..6dce8f813f5a350c8a2bfe33665c2e1ff5eb55cb/appstate/statestore">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      The
      <code translate="no" dir="ltr">statestore-datastore</code>
      artifact is had added support for the following platforms:
      <code translate="no" dir="ltr">desktop</code>
      ,
      <code translate="no" dir="ltr">linux</code>
      ,
      <code translate="no" dir="ltr">mac</code>
      ,
      <code translate="no" dir="ltr">ios</code>
      ,
      <code translate="no" dir="ltr">tvos</code>
      ,
      <code translate="no" dir="ltr">watchos</code>
      ,
      <code translate="no" dir="ltr">js</code>
      , and
      <code translate="no" dir="ltr">wasmJs</code>
      . In order to enable this, instead of using reflection,
      <code translate="no" dir="ltr">PersistToDataStore</code>
      is now generic in the persisted value type and requires the key to provide the name it is stored under and its
      <code translate="no" dir="ltr">KSerializer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I4cd8ec26c36964cd7bff5dd1ea01de7a0ef17553">I4cd8e</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/I031246463c4e84a096eb93139fd98dfb003e9be7">I03124</a>
      ,
      <a href="https://issuetracker.google.com/issues/579492485">b/579492485</a>
      )
    </li>
  </ul>
