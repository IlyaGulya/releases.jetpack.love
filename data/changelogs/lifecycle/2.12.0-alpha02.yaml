changelogHtml: |
  <h3 id="2.12.0-alpha02" data-text="Version 2.12.0-alpha02" tabindex="-1">Version 2.12.0-alpha02</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-*:2.12.0-alpha02</code>
    is released. Version 2.12.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea/lifecycle">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">AutoRecreated</code>
      and
      <code translate="no" dir="ltr">runOnNextRecreation</code>
      are deprecated in favor of
      <code translate="no" dir="ltr">SavedStateProvider</code>
      and
      <code translate="no" dir="ltr">SavedStateRestorer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iadc007bb0fcc0699e6ee7e9cfe9df0b81e3ac83b">Iadc00</a>
      )
    </li>
  </ul>
