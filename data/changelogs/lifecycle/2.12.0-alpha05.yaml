#language=html
changelogHtml: |
  <h3 id="2.12.0-alpha05" data-text="Version 2.12.0-alpha05" tabindex="-1">Version 2.12.0-alpha05</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-*:2.12.0-alpha05</code>
    is released. Version 2.12.0-alpha05 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..3566803898b060d7136357220affc9ece8236019/lifecycle">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">SavedStateHandle</code>
      now provides functions to integrate with
      <code translate="no" dir="ltr">SavedStateContainer</code>
      . There is
      <code translate="no" dir="ltr">asContainer()</code>
      to transform the
      <code translate="no" dir="ltr">SavedStateHandle</code>
      as a
      <code translate="no" dir="ltr">SavedStateContainer</code>
      ,
      <code translate="no" dir="ltr">getOrCreateContainer()</code>
      to make a child container inside of the handle, and
      <code translate="no" dir="ltr">getOrCreateSavedStateHandle()</code>
      which creates a child
      <code translate="no" dir="ltr">SavedStateHandle</code>
      inside of the current one. As part of the move to
      <code translate="no" dir="ltr">SavedStateContainer</code>
      , it is also no longer valid to use
      <code translate="no" dir="ltr">getStateFlow</code>
      and
      <code translate="no" dir="ltr">getLiveData</code>
      together on a
      <code translate="no" dir="ltr">SavedStateHandle</code>
      and doing so will throw an
      <code translate="no" dir="ltr">IllegalArgumentException</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I62f36431dd05f66e78e8bb74b968913831ee8e03">I62f36</a>
      )
    </li>
  </ul>
