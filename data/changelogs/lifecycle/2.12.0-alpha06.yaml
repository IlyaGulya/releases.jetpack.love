#language=html
changelogHtml: |
  <h3 id="2.12.0-alpha06" data-text="Version 2.12.0-alpha06" tabindex="-1">Version 2.12.0-alpha06</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-*:2.12.0-alpha06</code>
    is released. Version 2.12.0-alpha06 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/3566803898b060d7136357220affc9ece8236019..3e55c1ad889c6c0087b0bf6720b1a970b6e8ea3b/lifecycle">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Migrate
      <code translate="no" dir="ltr">LocalLifecycleOwner</code>
      to use
      <code translate="no" dir="ltr">compositionLocalWithHostDefaultOf</code>
      and
      <code translate="no" dir="ltr">LifecycleOwnerHostDefaultKey</code>
      detaching it from being directly retrieved as part of the view tree outside of Android. (
      <a href="https://android-review.googlesource.com/#/q/I7c2655f9040d951906980e286143414e22e3d271">I7c265</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      From
      <a href="/jetpack/androidx/releases/jetpack/androidx/releases/lifecycle#2.11.1">Lifecycle 2.11.1</a>
      : The
      <code translate="no" dir="ltr">currentStateFlow</code>
      property of
      <code translate="no" dir="ltr">LifecycleRegistry</code>
      now returns the same instance with each invocation, rather than creating a new instance each time. (
      <a href="https://android-review.googlesource.com/#/q/I1ae01405ae45b01878f0fc9ee870e3a31b8f8765">I1ae01</a>
      ,
      <a href="https://issuetracker.google.com/issues/579057749">b/579057749</a>
      )
    </li>
  </ul>
