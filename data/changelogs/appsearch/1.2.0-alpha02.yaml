changelogHtml: |
  <h3 id="1.2.0-alpha02" data-text="Version 1.2.0-alpha02" tabindex="-1">Version 1.2.0-alpha02</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.appsearch:appsearch-*:1.2.0-alpha02</code>
    is released. Version 1.2.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/1abcb4178d48853948b9b566cabff9222d90ab69..f7a145855e4766e37411cde8f059c83a8f42d365/appsearch">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Make
      <code translate="no" dir="ltr">SearchSpec.Builder#addFilterDocumentIds</code>
      and related methods non-experimental (
      <a href="https://android-review.googlesource.com/#/q/I28986c6c2e278f2042afb31a863c04a381b1786a">I28986</a>
      ,
      <a href="https://issuetracker.google.com/issues/540346408">b/540346408</a>
      )
    </li>
    <li>
      Additional refactoring to make AppSearch TakenAction classes extendable (
      <a href="https://android-review.googlesource.com/#/q/Ibb6253153e21299840f3737fc0ac2ea6b2ff58d5">Ibb625</a>
      ,
      <a href="https://issuetracker.google.com/issues/521419188">b/521419188</a>
      )
    </li>
    <li>
      Observer callbacks added to
      <code translate="no" dir="ltr">ReadOnlyGlobalSearchSession</code>
      which adds the API to
      <code translate="no" dir="ltr">EnterpriseGlobalSearchSession</code>
      in preparation for support in future SDKs (
      <a href="https://android-review.googlesource.com/#/q/I0db226d5c296d1cfdcf1c6171fd820652213b313">I0db22</a>
      ,
      <a href="https://issuetracker.google.com/issues/454623046">b/454623046</a>
      ,
      <a href="https://issuetracker.google.com/issues/422241546">b/422241546</a>
      )
    </li>
    <li>
      Refactors
      <code translate="no" dir="ltr">AppSearch</code>
      <code translate="no" dir="ltr">TakenAction</code>
      and Built-in types to be extendable outside of Jetpack (
      <a href="https://android-review.googlesource.com/#/q/Icfa9b7af4142d3879796f5246c03562cb0f61d03">Icfa9b</a>
      ,
      <a href="https://issuetracker.google.com/issues/372929164">b/372929164</a>
      )
    </li>
    <li>
      Added APIs to support direct loading of int8 quantized embeddings in
      <code translate="no" dir="ltr">EmbeddingVector</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I0be711d08847def8fb6fb50933a44d75d50dc314">I0be71</a>
      ,
      <a href="https://issuetracker.google.com/issues/390450012">b/390450012</a>
      )
    </li>
    <li>
      Introduce ANN APIs for embedding search (
      <a href="https://android-review.googlesource.com/#/q/I86e6b77f5933fb2305d14cc4e10772cff016c24c">I86e6b</a>
      ,
      <a href="https://issuetracker.google.com/issues/448886757">b/448886757</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixes a bug where setSchema with migrators ignored the forceOverride parameter (
      <a href="https://android-review.googlesource.com/#/q/Id3c4f8c134a113c53f18159b2aa5ceb0fabd113c">Id3c4f</a>
      ,
      <a href="https://issuetracker.google.com/issues/384981085">b/384981085</a>
      )
    </li>
  </ul>
