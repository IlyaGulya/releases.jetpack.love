version: 1.2.0-alpha05
releaseDate: 2026-08-12
#language=html
changelogHtml: |
  <h3 id="1.2.0-alpha05" data-text="Version 1.2.0-alpha05" tabindex="-1">Version 1.2.0-alpha05</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.health.connect:connect-client:1.2.0-alpha05</code>
    ,
    <code translate="no" dir="ltr">androidx.health.connect:connect-client-external-protobuf:1.2.0-alpha05</code>
    , and
    <code translate="no" dir="ltr">androidx.health.connect:connect-client-proto:1.2.0-alpha05</code>
    are released. Version 1.2.0-alpha05 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/df4b49eda6f6834b6bc4c8aa30a581fa577a511e..5fdfb3300e5dbcb4dfefe48c38e193a5cf1c6eac/health/connect">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      The minimum SDK requirement for this library is now API 24 (
      <code translate="no" dir="ltr">minSdk 24</code>
      ). (
      <a href="https://android.googlesource.com/platform/frameworks/support/+/07cc6ea9413a439370e4baccae250d842acff222">07cc6ea</a>
      )
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">@IntRange</code>
      and
      <code translate="no" dir="ltr">@FloatRange</code>
      annotations to
      <code translate="no" dir="ltr">ExerciseSegment</code>
      repetitions,
      <code translate="no" dir="ltr">setIndex</code>
      , and
      <code translate="no" dir="ltr">rateOfPerceivedExertion</code>
      properties. (
      <a href="https://android-review.googlesource.com/#/q/If7a47f7d23f5179b0b77eb8023234c7d72423bd6">If7a47</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Secured Health Connect intents on Android versions prior to 14. (
      <a href="https://android.googlesource.com/platform/frameworks/support/+/03720de80979937b0462682bd61bf8dbfbcbe215">03720de</a>
      )
    </li>
    <li>
      Fixed a signature validation issue in Health Connect. (
      <a href="https://android.googlesource.com/platform/frameworks/support/+/17957fcb324a42599abc868ffe8204a0384b2aee">17957fc</a>
      )
    </li>
  </ul>
