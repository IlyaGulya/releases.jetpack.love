changelogHtml: |
  <h3 id="1.3.0-alpha11" data-text="Version 1.3.0-alpha11" tabindex="-1">Version 1.3.0-alpha11</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.datastore:datastore-*:1.3.0-alpha11</code>
    is released. Version 1.3.0-alpha11 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/61ee8cd421d0c0252d8db0253b739de537999371..e4bd62f853853bf3522ed15681c58ef28b09ed44/datastore">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      The underlying file path is not included in
      <code translate="no" dir="ltr">CorruptionException</code>
      messages thrown during
      <code translate="no" dir="ltr">DataStore</code>
      preference parsing failures. (
      <a href="https://android-review.googlesource.com/#/q/Ia9e8f4b26cf4fc2fcd3efcda3d278887b23d6659">Ia9e8f</a>
      )
    </li>
  </ul>
