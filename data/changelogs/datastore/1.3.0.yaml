libraryId: datastore
groupId: androidx.datastore
version: 1.3.0
releaseDate: 2026-10-21
#language=html
changelogHtml: |
  <h3 id="1.3.0" data-text="Version 1.3.0" tabindex="-1">Version 1.3.0</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.datastore:datastore-*:1.3.0</code>
    is released. Version 1.3.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/03aea68c431abd3fa436e9f8fa9b9cda12f18334..de4cda56f812357e582b3e1aa32bc737636614a2/datastore">these commits</a>
    .
  </p>
  <p><strong>Important changes since 1.2.0:</strong></p>
  <h3 id="new_features_2" data-text="New Features" tabindex="-1">New Features</h3>
  <ul>
    <li>
      <p>
        <strong>Web Storage Support:</strong>
        Introduced KMP web storage options, enabling flexible data persistence across web targets:
      </p>

      <ul>
        <li>
          <strong>
            <code translate="no" dir="ltr">sessionStorage</code>
            (
            <code translate="no" dir="ltr">WebSessionStorage</code>
            ):
          </strong>
          Allows temporary data persistence within a single browser tab.
        </li>
        <li>
          <strong>
            <code translate="no" dir="ltr">localStorage</code>
            (
            <code translate="no" dir="ltr">WebLocalStorage</code>
            ):
          </strong>
          Enables persistent storage with cross-tab event notifications and synchronization.
        </li>
        <li>
          <strong>
            Origin Private File System (
            <code translate="no" dir="ltr">WebOpfsStorage</code>
            ):
          </strong>
          Provides file-system support via OPFS, featuring asynchronous file I/O and cross-tab notifications.
        </li>
      </ul>
    </li>
    <li>
      <p>
        <strong>
          Encryption Support (
          <code translate="no" dir="ltr">datastore-tink</code>
          ):
        </strong>
        Added the new
        <code translate="no" dir="ltr">androidx.datastore:datastore-tink</code>
        artifact, which provides encryption support using the Tink library. It introduces
        <code translate="no" dir="ltr">AeadSerializer</code>
        to encrypt and decrypt data using Authenticated Encryption with Associated Data (AEAD).
      </p>
    </li>
    <li>
      <p>
        <strong>Tracing Support:</strong>
        Added support for
        <code translate="no" dir="ltr">androidx.tracing</code>
        on the Android target platform.
      </p>
    </li>
    <li>
      <p>
        <strong>
          <code translate="no" dir="ltr">DataStore.Builder</code>
          API:
        </strong>
        Introduced
        <code translate="no" dir="ltr">DataStore.Builder&lt;T&gt;</code>
        as the modern, scalable alternative to
        <code translate="no" dir="ltr">DataStoreFactory</code>
        . It requires a
        <code translate="no" dir="ltr">CoroutineContext</code>
        instead of a
        <code translate="no" dir="ltr">CoroutineScope</code>
        for improved structured concurrency.
      </p>
    </li>
    <li>
      <p>
        <strong>Baseline Profiles:</strong>
        Added baseline profiles to
        <code translate="no" dir="ltr">datastore</code>
        for enhanced startup performance.
      </p>
    </li>
  </ul>
  <h3 id="api_changes_2" data-text="API Changes" tabindex="-1">API Changes</h3>
  <ul>
    <li>
      <code translate="no" dir="ltr">DataStore.Builder</code>
      ,
      <code translate="no" dir="ltr">ReThrowCorruptionHandler</code>
      and
      <code translate="no" dir="ltr">InterProcessCoordinator</code>
      APIs have been updated to
      <code translate="no" dir="ltr">public</code>
      .
    </li>
  </ul>
  <h3 id="bug_fixes_improvements_2" data-text="Bug Fixes &amp; Improvements" tabindex="-1">Bug Fixes &amp; Improvements</h3>
  <ul>
    <li>
      <p>
        Added underlying file path information to
        <code translate="no" dir="ltr">CorruptionException</code>
        messages to improve debuggability during parsing failures.
      </p>
    </li>
    <li>
      <p>
        Corrected potential data loss in
        <code translate="no" dir="ltr">GuavaDataStore</code>
        by enforcing strict First-In-First-Out (FIFO) ordering for updates.
      </p>
    </li>
  </ul>
