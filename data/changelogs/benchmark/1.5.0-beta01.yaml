changelogHtml: |
  <h3 id="1.5.0-beta01" data-text="Version 1.5.0-beta01" tabindex="-1">Version 1.5.0-beta01</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.benchmark:benchmark-*:1.5.0-beta01</code>
    is released. Version 1.5.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ba3014c143b9c9782fe30bc766c5dced55e13453..61ee8cd421d0c0252d8db0253b739de537999371/benchmark">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">PerfettoCapture</code>
      and
      <code translate="no" dir="ltr">PerfettoTraceRule</code>
      can now capture in-process traces and merge them for a target package. (
      <a href="https://android-review.googlesource.com/#/q/I9a00b092f44ccab23ef23ad4371ebd758f629dcb">I9a00b</a>
      ,
      <a href="https://issuetracker.google.com/issues/497959820">b/497959820</a>
      )
    </li>
  </ul>
