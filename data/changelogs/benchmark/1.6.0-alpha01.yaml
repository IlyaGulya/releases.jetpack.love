changelogHtml: |
  <h3 id="1.6.0-alpha01" data-text="Version 1.6.0-alpha01" tabindex="-1">Version 1.6.0-alpha01</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.benchmark:benchmark-*:1.6.0-alpha01</code>
    is released. Version 1.6.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/186a547242af3a9298ad5af40f988293edf2d8ce..9df3dfef9a4fdc8de448a634fa58f49e1b63e1f9/benchmark">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      The benchmark
      <code translate="no" dir="ltr">:lockClocks</code>
      task now uses fixed performance mode when available, over the previous root-only implementation. This means you can lock clocks on many more physical devices for stable results, especially for useful for stable microbenchmarks. Please report issues with thermal throttling with the new behavior if you see it. (
      <a href="https://android-review.googlesource.com/#/q/I0d03254a6356e26a3d73d4f0fe2b899ff8ba0870">I0d032</a>
      )
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">MemoryProfilingConfig</code>
      to
      <code translate="no" dir="ltr">ExperimentalConfig</code>
      to allow macrobenchmark runs to opt into Perfetto heap profiling. (
      <a href="https://android-review.googlesource.com/#/q/Ibc931f825e64819ca1e771e8bb7201c109724912">Ibc931</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed a bug in microbenchmark where method trace capture was sometimes overcautiously skipped to avoid ANRs. (
      <a href="https://android-review.googlesource.com/#/q/Ifc307821343e3fbe0a3d7db6d8eae68a99f332be">Ifc307</a>
      )
    </li>
    <li>
      Fix Baseline profile capture for processes not using a
      <code translate="no" dir="ltr">:&lt;suffix&gt;</code>
      naming pattern. (
      <a href="https://android-review.googlesource.com/#/q/I512abca799b154efb9a6bba98eda3b288e28cd04">I512ab</a>
      )
    </li>
    <li>
      Profiler trace links are now reported under a separate 'Profiling Traces' section in IDE summaries. (
      <a href="https://android-review.googlesource.com/#/q/Id639fd6bda041a358372de5fd80c53d53a302260">Id639f</a>
      )
    </li>
    <li>
      Fix a bug in virtual file flushing which would result in
      <code translate="no" dir="ltr">Unable to flush profiles for &lt;packagename&gt;</code>
      . (
      <a href="https://android-review.git.corp.google.com/q/I48cccda394d386d1335025516788f7cdfa1aaa36">I48ccc</a>
      )
    </li>
    <li>
      Fix synchronization in method traces embedded in system trace.
      <a href="https://android-review.googlesource.com/q/Ifd2e33b235092d731bddb31ad7a0e56c98dd7bfd">Ifd2e33</a>
      <a href="https://buganizer.corp.google.com/issues/537688349">b/537688349</a>
    </li>
    <li>
      Baseline Profile Gradle Plugin - Improved
      <code translate="no" dir="ltr">CollectBaselineProfileTask</code>
      to support finding
      <code translate="no" dir="ltr">test-result.pb</code>
      files in subdirectories, enabling compatibility with the new built-in test platform.
      <a href="https://android-review.googlesource.com/q/Id9c488dd0388a206cd0ac98f49cee21c37c7878d">Id9c488</a>
      <a href="https://buganizer.corp.google.com/issues/543799367">b/543799367</a>
    </li>
  </ul>
  <h2 id="version_15_2" data-text="Version 1.5" tabindex="-1">Version 1.5</h2>
