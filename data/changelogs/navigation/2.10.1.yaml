changelogHtml: |
  <h3 id="2.10.1" data-text="Version 2.10.1" tabindex="-1">Version 2.10.1</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigation:navigation-*:2.10.1</code>
    is released. Version 2.10.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/9f64fe7aa9dfa4637259dd0a24940569e35754ae..3a4067bc71f93f5db86732b3d7b94ef572627b32/navigation">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      In cases where
      <code translate="no" dir="ltr">NavHost</code>
      skips animations, it will now also consider the
      <code translate="no" dir="ltr">sizeTransform</code>
      as part of the skipped animation to prevent any unexpected clipping. (
      <a href="https://android-review.googlesource.com/#/q/I4f995285883d58fdd22f315ecffbb3ea665c7ea2">I4f995</a>
      ,
      <a href="https://issuetracker.google.com/issues/550924680">b/550924680</a>
      )
    </li>
  </ul>
