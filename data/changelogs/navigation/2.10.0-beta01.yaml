changelogHtml: |
  <h3 id="2.10.0-beta01" data-text="Version 2.10.0-beta01" tabindex="-1">Version 2.10.0-beta01</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigation:navigation-*:2.10.0-beta01</code>
    is released. Version 2.10.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ba3014c143b9c9782fe30bc766c5dced55e13453..61ee8cd421d0c0252d8db0253b739de537999371/navigation">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Introduce
      <code translate="no" dir="ltr">NavBackStackEntryInfo</code>
      to expose back stack snapshots during navigation events. This enables richer custom predictive back animations. (
      <a href="https://android-review.googlesource.com/#/q/Icb3b84ad5031332f3c40db10240afb0cb5959eec">Icb3b8</a>
      )
    </li>
  </ul>
