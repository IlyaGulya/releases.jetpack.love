version: 1.0.0-alpha12
releaseDate: 2026-09-23
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha12" data-text="Version 1.0.0-alpha12" tabindex="-1">Version 1.0.0-alpha12</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.appfunctions:appfunctions:1.0.0-alpha12</code>
    ,
    <code translate="no" dir="ltr">androidx.appfunctions:appfunctions-compiler:1.0.0-alpha12</code>
    , and
    <code translate="no" dir="ltr">androidx.appfunctions:appfunctions-testing:1.0.0-alpha12</code>
    are released. Version 1.0.0-alpha12 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/c99f838c940f9efc7418c943dd43bb1f36b38529..f77468c7762fc61d6c4489eec93f95b8e27410fc/appfunctions">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Requires
      <code translate="no" dir="ltr">AppFunctionData#serialize</code>
      caller to provide metadata. (
      <a href="https://android-review.googlesource.com/#/q/I61eca34a3a31514bc85d65c4e90fac292d472ee5">I61eca</a>
      )
    </li>
    <li>
      Adds inline reified
      <code translate="no" dir="ltr">getHandleAppFunctionRequestAdapter</code>
      in addition to the existing
      <code translate="no" dir="ltr">Class</code>
      -based overload. (
      <a href="https://android-review.googlesource.com/#/q/Ic1b4e594ae32b5d63f090b1456e2b2f6892db0ea">Ic1b4e</a>
      )
    </li>
    <li>
      Removes
      <code translate="no" dir="ltr">AppFunctionContext</code>
      and
      <code translate="no" dir="ltr">AppFunctionConfiguration</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I9dd8f79a0a4a1463cdb95117f35c74ac0f07aad9">I9dd8f</a>
      )
    </li>
    <li>
      Adds
      <code translate="no" dir="ltr">activityId</code>
      to
      <code translate="no" dir="ltr">ExecuteAppFunctionRequest</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I6ac86d38a464e91ae20c812826aa94f65d64b91f">I6ac86</a>
      )
    </li>
    <li>
      Adds
      <code translate="no" dir="ltr">registerAppFunction</code>
      ,
      <code translate="no" dir="ltr">registerAppFunctions</code>
      ,
      <code translate="no" dir="ltr">RegisterAppFunctionRequest</code>
      , and
      <code translate="no" dir="ltr">CallbackAppFunction</code>
      as
      <code translate="no" dir="ltr">@ExperimentalAppFunctionsApi</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Idb2cafbb8342003c29b79a59a4ce51867e49d768">Idb2ca</a>
      )
    </li>
    <li>
      Adds
      <code translate="no" dir="ltr">scope</code>
      in
      <code translate="no" dir="ltr">AppFunctionMetadata</code>
      and
      <code translate="no" dir="ltr">AppFunctionSearchSpec</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I4344ccd3a3e056dff4f6cea9702b615c8b012f94">I4344c</a>
      )
    </li>
    <li>
      Adds
      <code translate="no" dir="ltr">AppFunctionUriValueConstraint</code>
      as a public API. (
      <a href="https://android-review.googlesource.com/#/q/I750702dcd86703ff2e493d4918686e83dc98b891">I75070</a>
      )
    </li>
    <li>
      Update
      <code translate="no" dir="ltr">AppFunctionPackageMetadata</code>
      constructor (
      <a href="https://android-review.googlesource.com/#/q/I096f7901d6ca95efb6cd376d443f7ab5667c8020">I096f7</a>
      )
    </li>
  </ul>
