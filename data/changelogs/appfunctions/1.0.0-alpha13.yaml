version: 1.0.0-alpha13
releaseDate: 2026-10-07
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha13" data-text="Version 1.0.0-alpha13" tabindex="-1">Version 1.0.0-alpha13</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.appfunctions:appfunctions:1.0.0-alpha13</code>
    ,
    <code translate="no" dir="ltr">androidx.appfunctions:appfunctions-compiler:1.0.0-alpha13</code>
    , and
    <code translate="no" dir="ltr">androidx.appfunctions:appfunctions-testing:1.0.0-alpha13</code>
    are released. Version 1.0.0-alpha13 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f77468c7762fc61d6c4489eec93f95b8e27410fc..0990e6ecc6b2bb46ca9e51bdc845da764080ba4f/appfunctions">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add @AppFunctionAccessLevel annotation to support access restriction setting. (
      <a href="https://android-review.googlesource.com/#/q/Id47e134fc3aac0901ec0a026904d48222653d8fe">Id47e1</a>
      )
    </li>
    <li>
      Rename
      <code translate="no" dir="ltr">AppFunction</code>
      annotation to
      <code translate="no" dir="ltr">AppFunctionDeclaration</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I4b15d35e7889272811b725fb5eed0ba1a9e863da">I4b15d</a>
      )
    </li>
    <li>
      Rename
      <code translate="no" dir="ltr">ObserveAppFunctionsEvent</code>
      to
      <code translate="no" dir="ltr">AppFunctionsChangeEvent</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Iec9182fb0e2583f4086281e1572d6ab3d028e00a">Iec918</a>
      )
    </li>
    <li>
      Surface
      <code translate="no" dir="ltr">AppFunctionMetadata</code>
      in
      <code translate="no" dir="ltr">AppFunctionService</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If11170bcc6498efc1c1bc09a67ef354ce2e2ca9d">If1117</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Support all built-in proxy types (LocalDate, LocalTime, Instant, ZoneId) in AppFunctionData. (
      <a href="https://android-review.googlesource.com/#/q/I61c16ec04842353212bc1e2df3f7a00fecc1abf8">I61c16</a>
      )
    </li>
  </ul>
