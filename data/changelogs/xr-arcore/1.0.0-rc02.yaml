changelogHtml: |
  <h3 id="1.0.0-rc02" data-text="Version 1.0.0-rc02" tabindex="-1">Version 1.0.0-rc02</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.arcore:arcore-*:1.0.0-rc02</code>
    is released. Version 1.0.0-rc02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/9c825fbab75661b887e67410bc6d6565f80d3f2d..5836b45501e4170061dd2eeac772aa767031672f/xr/arcore">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">OpenXrRuntime</code>
      failed to configure the session when augmented image tracking was unsupported. (
      <a href="https://android-review.googlesource.com/q/I8b9759f1cf8fe828baa7b31138d76dc9038ad095">I8b9759</a>
      )
    </li>
    <li>
      Fixed multiple issues including: improved memory management in
      <code translate="no" dir="ltr">XrInstanceManager</code>
      by using
      <code translate="no" dir="ltr">applicationContext</code>
      , resolved potential lifecycle-related issues by simplifying
      <code translate="no" dir="ltr">Session</code>
      and
      <code translate="no" dir="ltr">Scene</code>
      caching mechanisms, and enhanced the
      <code translate="no" dir="ltr">ReferenceCleaner</code>
      to ensure thread-safe cleanup registrations and explicit disposals. (
      <a href="https://android-review.googlesource.com/q/Id0b76c704c3928a06e47f411953431a1eb2b8d3a">Id0b76c</a>
      )
    </li>
  </ul>
