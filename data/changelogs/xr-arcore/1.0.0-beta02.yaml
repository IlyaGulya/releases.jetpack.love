changelogHtml: |
  <h3 id="1.0.0-beta02" data-text="Version 1.0.0-beta02" tabindex="-1">Version 1.0.0-beta02</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.arcore:arcore-*:1.0.0-beta02</code>
    is released. Version 1.0.0-beta02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/55bb7fb3c184dcf0c343d732cb435f8b233a0453..6aac064a92dc69c01271e1810f149f398d07d741/xr/arcore">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fix concurrency issue in
      <code translate="no" dir="ltr">OpenXR</code>
      anchor persistence. (
      <a href="https://android-review.googlesource.com/#/q/I15c8b064f0555ddee4734a9d5d9ac2fec4a5d576">I15c8b</a>
      )
    </li>
    <li>
      Implemented
      <code translate="no" dir="ltr">toString()</code>
      in more classes for debugging. (
      <a href="https://android-review.googlesource.com/#/q/I587e8232768166159a705844c99783036a6a6964">I587e8</a>
      )
    </li>
  </ul>
