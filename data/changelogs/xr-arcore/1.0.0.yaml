changelogHtml: |
  <h3 id="1.0.0" data-text="Version 1.0.0" tabindex="-1">Version 1.0.0</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.arcore:arcore-*:1.0.0</code>
    is released. Version 1.0.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e2e2729abc59df52d40af80a8bbfe010c02455c6..cba250c981d813e262a6855ab80f90d3bafab487/xr/arcore">these commits</a>
    .
  </p>
  <p><strong>Major features of 1.0.0:</strong></p>
  <ul>
    <li>
      ARCore for Jetpack XR is now stable! The ARCore for Jetpack XR library provides capabilities for blending digital content with the real world. This library includes motion tracking, persistent anchors, hit testing, plane identification with semantic labeling (for example, floor, walls, and tabletops), and
      <a href="https://developer.android.com/reference/kotlin/androidx/xr/runtime/math/GeospatialPose">Geospatial poses</a>
      using Google's Visual Positioning System.
    </li>
    <li>
      For more information, see our
      <a href="https://developer.android.com/develop/xr/jetpack-xr-sdk/arcore">Developer Guide</a>
      and
      <a href="https://developer.android.com/reference/kotlin/androidx/xr/arcore/">API Reference</a>
      .
    </li>
  </ul>
