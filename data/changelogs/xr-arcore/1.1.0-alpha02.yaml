changelogHtml: |
  <h3 id="1.1.0-alpha02" data-text="Version 1.1.0-alpha02" tabindex="-1">Version 1.1.0-alpha02</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.arcore:arcore-*:1.1.0-alpha02</code>
    is released. Version 1.1.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/4a7358de227958e6bfcfdd3e4782bd91091dfe44..dcd36387a217dbc6835a89e5ffbc212bacf5dcdb/xr/arcore">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed
      <code translate="no" dir="ltr">unpersistAnchor()</code>
      to throw
      <code translate="no" dir="ltr">AnchorInvalidUuidException</code>
      instead of
      <code translate="no" dir="ltr">IllegalStateException</code>
      when an unknown UUID is provided. (
      <a href="https://android-review.googlesource.com/#/q/Ib046bf966596c1e79a19df5b43be94ccde7170de">Ib046b</a>
      )
    </li>
    <li>
      Added validation to ensure
      <code translate="no" dir="ltr">imageBuffer</code>
      is a direct
      <code translate="no" dir="ltr">ByteBuffer</code>
      in
      <code translate="no" dir="ltr">SpatialAnnotationTrackingOptions</code>
      . (
      <a href="https://android-review.googlesource.com/q/Ieb507ef2a7431b75fe7fc91a3a3cf74dab680ef7">Ieb507</a>
      )
    </li>
    <li>
      Set tracking state to
      <code translate="no" dir="ltr">STOPPED</code>
      for stopped spatial annotations and correctly handled cleanup. (
      <a href="https://android-review.googlesource.com/q/Ib685a6d18e9f87a1bc420a63bcb5d3b5734178dc">Ib685a</a>
      )
    </li>
    <li>
      Fixed anchor
      <code translate="no" dir="ltr">TrackingState</code>
      updates within
      <code translate="no" dir="ltr">ArCoreTestRule</code>
      . (
      <a href="https://android-review.googlesource.com/q/I766b949b53c1eabaa6c87c130801118ac4f1f746">I766b9</a>
      )
    </li>
  </ul>
