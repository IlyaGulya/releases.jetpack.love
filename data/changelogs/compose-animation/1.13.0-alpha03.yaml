changelogHtml: |
  <h3 id="1.13.0-alpha03" data-text="Version 1.13.0-alpha03" tabindex="-1">Version 1.13.0-alpha03</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.animation:animation-*:1.13.0-alpha03</code>
    is released. Version 1.13.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..f78fd2b24de25ea980397a47192d2e5539a34229/compose/animation">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Removed
      <code translate="no" dir="ltr">ExperimentalDeferredTransitionApi</code>
      . Deferred transition APIs no longer require experimental opt-in. (
      <a href="https://android-review.googlesource.com/#/q/Ib64300bf3bce149fe8119343be539859c4ae084b">Ib6430</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
