changelogHtml: |
  <h3 id="1.2.0" data-text="Version 1.2.0" tabindex="-1">Version 1.2.0</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.loader:loader:1.2.0</code>
    is released. Version 1.2.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/7308ad68d2572be8ec5b7f1abb514312af9e1f86..94465bb306685652a581ae32fc580d7e6f71c435/loader/loader">these commits</a>
    .
  </p>
  <p><strong>Important changes since 1.1.0:</strong></p>
  <ul>
    <li>Started using jspecify nullability annotations.</li>
    <li>
      Added Kotlin extension functions for
      <code translate="no" dir="ltr">LoaderManager</code>
      to make the library easier to use from Kotlin.
    </li>
  </ul>
