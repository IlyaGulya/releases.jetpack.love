changelogHtml: |
  <h3 id="1.0.0-alpha15" data-text="Version 1.0.0-alpha15" tabindex="-1">Version 1.0.0-alpha15</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.projected:projected:1.0.0-alpha15</code>
    ,
    <code translate="no" dir="ltr">androidx.xr.projected:projected-binding:1.0.0-alpha15</code>
    , and
    <code translate="no" dir="ltr">androidx.xr.projected:projected-testing:1.0.0-alpha15</code>
    are released. Version 1.0.0-alpha15 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/9f20ae7f616b35211519055147abb6764f5f07df..80754c2dae3e8c65a9b7579c45e56f0e47e38640/xr/projected">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Prioritized active and most recent
      <code translate="no" dir="ltr">VirtualDevice</code>
      objects in
      <code translate="no" dir="ltr">ProjectedContext.getProjectedDeviceId()</code>
      to prevent selecting stale device entries. (
      <a href="https://android-review.googlesource.com/q/I6ca07123e4c9b6b086765ae535951885bb1a91a6">I6ca071</a>
      )
    </li>
    <li>
      Caught
      <code translate="no" dir="ltr">IllegalArgumentException</code>
      in
      <code translate="no" dir="ltr">ProjectedContext.createProjectedDeviceContext()</code>
      and wrapped it in an
      <code translate="no" dir="ltr">IllegalStateException</code>
      to better handle scenarios where the projected device is no longer valid. (
      <a href="https://android-review.googlesource.com/q/I4e451b621721bea349d8f4e9f81a869c86dfa6fe">I4e451b</a>
      )
    </li>
  </ul>
