changelogHtml: |
  <h3 id="1.0.0-alpha12" data-text="Version 1.0.0-alpha12" tabindex="-1">Version 1.0.0-alpha12</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.projected:projected:1.0.0-alpha12</code>
    ,
    <code translate="no" dir="ltr">androidx.xr.projected:projected-binding:1.0.0-alpha12</code>
    , and
    <code translate="no" dir="ltr">androidx.xr.projected:projected-testing:1.0.0-alpha12</code>
    are released. Version 1.0.0-alpha12 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b9148c106d667c75e08ea1e8666069ae39384931..7f25ba0f3473985c25494700a2dec2e4cfe5e31d/xr/projected">these commits</a>
    .
  </p>
  <p><strong>Bug fixes</strong></p>
  <ul>
    <li>
      Addressed an issue with
      <code translate="no" dir="ltr">ProjectedTestRule</code>
      that prevented it from processing calls to
      <code translate="no" dir="ltr">ProjectedActivity.requestPermissions</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I3923f3c9b702e3a1cb96fd2d2e8d22afe01af42d">I3923f</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/I25f36cc731243e523ac9a7ea566ad194734d2208">I25f36</a>
      )
    </li>
  </ul>
