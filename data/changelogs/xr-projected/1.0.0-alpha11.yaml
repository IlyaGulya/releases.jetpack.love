changelogHtml: |
  <h3 id="1.0.0-alpha11" data-text="Version 1.0.0-alpha11" tabindex="-1">Version 1.0.0-alpha11</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.projected:projected:1.0.0-alpha11</code>
    ,
    <code translate="no" dir="ltr">androidx.xr.projected:projected-binding:1.0.0-alpha11</code>
    , and
    <code translate="no" dir="ltr">androidx.xr.projected:projected-testing:1.0.0-alpha11</code>
    are released. Version 1.0.0-alpha11 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/6846fc6cf86033f3401fbf98388cccda57243c54..b9148c106d667c75e08ea1e8666069ae39384931/xr/projected">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Removed deprecated
      <code translate="no" dir="ltr">androidx.xr.projected.permissions.*</code>
      APIs (
      <a href="https://android-review.googlesource.com/#/q/I77f8b86a1fe71ad2b40dc99bcc0b26283f718422">I77f8b</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed ANRs and service unbind crashes when resuming applications after sleep or standby mode. (
      <a href="https://android-review.googlesource.com/#/q/Idac0c45bc0f6765d4a0f20966fbda024c11fb220">Idac0c</a>
      )
    </li>
  </ul>
