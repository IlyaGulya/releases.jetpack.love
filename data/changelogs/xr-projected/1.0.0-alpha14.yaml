#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha14" data-text="Version 1.0.0-alpha14" tabindex="-1">Version 1.0.0-alpha14</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.projected:projected:1.0.0-alpha14</code>
    ,
    <code translate="no" dir="ltr">androidx.xr.projected:projected-binding:1.0.0-alpha14</code>
    , and
    <code translate="no" dir="ltr">androidx.xr.projected:projected-testing:1.0.0-alpha14</code>
    are released. Version 1.0.0-alpha14 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/4f7372e20767a86bc5f09610ba831c35d53fc8d8..9f20ae7f616b35211519055147abb6764f5f07df/xr/projected">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Enabled battery state tests with
      <code translate="no" dir="ltr">ProjectedTestRule</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I6f56d49b25cc5883c1d97a434262687cd7787964">I6f56d</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">ProjectedActivityCompat.setActivityAsInputReceiver</code>
      and
      <code translate="no" dir="ltr">clearActivityAsInputReceiver</code>
      to allow apps to specify exactly which component should be relaunched and receive input focus when system-initiated focus shifts occur on displayless devices. (
      <a href="https://android-review.googlesource.com/#/q/Id21e5399f86bc19058af5c33b6e674cb0bb4bfd3">Id21e5</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/I99bfdb355ffd7f1083dbdac4167b1f5577740116">I99bfd</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
    <li>
      Fixed
      <a href="https://android-review.googlesource.com/q/I102e7bd3362f3eea413e32a61c2571ddb17c9aa2">an issue</a>
      in
      <code translate="no" dir="ltr">isProjectedDeviceConnected</code>
      where the host device context was not correctly created, leading to potential issues accessing system services.
    </li>
  </ul>
