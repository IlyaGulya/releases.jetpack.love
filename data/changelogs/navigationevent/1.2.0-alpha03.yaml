version: 1.2.0-alpha03
releaseDate: 2026-07-29
#language=html
changelogHtml: |
  <h3 id="1.2.0-alpha03" data-text="Version 1.2.0-alpha03" tabindex="-1">Version 1.2.0-alpha03</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigationevent:navigationevent-*:1.2.0-alpha03</code>
    is released. Version 1.2.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e37cf4eae99bdc35def1209921d658612e2edbc3..61ee8cd421d0c0252d8db0253b739de537999371/navigationevent">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add
      <code translate="no" dir="ltr">title</code>
      and
      <code translate="no" dir="ltr">url</code>
      to
      <code translate="no" dir="ltr">NavigationEventInfo</code>
      to allow customizing the destination title and location URL. (
      <a href="https://android-review.googlesource.com/#/q/Ie561935048b72ca77b9405f8eac8f7e2c30fc912">Ie5619</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">NavigationEventDispatcherOwner</code>
      factory in navigationevent. (
      <a href="https://android-review.googlesource.com/#/q/I740d39ee0452a5b438c9e1ad8620442061ef2f94">I740d3</a>
      )
    </li>
    <li>
      Add ExperimentalNavigationEventApi annotation to allow explicit opt-in for new and unstable APIs. (
      <a href="https://android-review.googlesource.com/#/q/Ia5d25fb1adf652a55d3c29740a5f4689b0f0a2de">Ia5d25</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Make BrowserInput publicly available in wasmJs targets as an experimental API. (
      <a href="https://android-review.googlesource.com/#/q/Icc2a8376bd3bb70ff3bb6f8c82068e47b47065e0">Icc2a8</a>
      )
    </li>
  </ul>
