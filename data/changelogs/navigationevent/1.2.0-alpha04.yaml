changelogHtml: |
  <h3 id="1.2.0-alpha04" data-text="Version 1.2.0-alpha04" tabindex="-1">Version 1.2.0-alpha04</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigationevent:navigationevent-*:1.2.0-alpha04</code>
    is released. Version 1.2.0-alpha04 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/61ee8cd421d0c0252d8db0253b739de537999371..384f3c27346bf5812f359330dc2310f0cbb66402/navigationevent">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added new APIs
      <code translate="no" dir="ltr">hasEnabledBackHandlers</code>
      and
      <code translate="no" dir="ltr">hasEnabledForwardHandlers</code>
      to
      <code translate="no" dir="ltr">NavigationEventInput</code>
      to allow tracking directional capabilities independently. (
      <a href="https://android-review.googlesource.com/#/q/I772bf3ada606f09fd47c1af4a12b811c76c1665b">I772bf</a>
      ,
      <a href="https://issuetracker.google.com/issues/123456789">b/123456789</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Introduce fallback context traversal lookup to resolve
      <code translate="no" dir="ltr">LocalNavigationEventDispatcherOwner</code>
      when view tree owners are not available. (
      <a href="https://android-review.googlesource.com/#/q/I51e302741b17c4152e916c2d8a3a8617c81e4b22">I51e30</a>
      ,
      <a href="https://issuetracker.google.com/issues/530641649">b/530641649</a>
      )
    </li>
  </ul>
