libraryId: navigationevent
groupId: androidx.navigationevent
version: 1.2.0
releaseDate: 2026-10-07
#language=html
changelogHtml: |
  <h3 id="1.2.0" data-text="Version 1.2.0" tabindex="-1">Version 1.2.0</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.navigationevent:navigationevent-*:1.2.0</code>
    is released. Version 1.2.0 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/97aec8dd133e0797a82bc84ea401f5d85ccb74f2..64e18c3822f0ccd7460956afd6ae6f9848877ea7/navigationevent">these commits</a>
    .
  </p>
  <p><strong>Important changes since 1.1.0:</strong></p>
  <p>
    <strong>
      New in
      <code translate="no" dir="ltr">TestNavigationEventDispatcherOwner</code>
    </strong>
  </p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">onForwardCompletedFallback</code>
      to enable tracking and testing of unhandled forward navigation events.
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">navigationEventInput</code>
      to simplify simulating navigation events in tests
    </li>
  </ul>
  <p>
    <strong>
      New in
      <code translate="no" dir="ltr">NavigationEventInput</code>
    </strong>
  </p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">hasEnabledHandlers</code>
      ,
      <code translate="no" dir="ltr">hasEnabledBackHandlers</code>
      , and
      <code translate="no" dir="ltr">hasEnabledForwardHandlers</code>
      to allow developers to query the current handler state directly without relying on callbacks.
    </li>
  </ul>
  <p><strong>Other changes</strong></p>
  <ul>
    <li>
      New
      <code translate="no" dir="ltr">NavigationEventDispatcherOwner</code>
      factory to allow easy creation of a owner backed by the given
      <code translate="no" dir="ltr">NavigationEventDispatcher</code>
    </li>
    <li>
      <code translate="no" dir="ltr">Title</code>
      and
      <code translate="no" dir="ltr">url</code>
      properties added to
      <code translate="no" dir="ltr">NavigationEventInfo</code>
      to allow customizing the destination title and location URL.
    </li>
  </ul>
