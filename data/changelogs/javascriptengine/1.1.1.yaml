changelogHtml: |
  <h3 id="javascriptengine-1.1.1" data-text="Version 1.1.1" tabindex="-1">Version 1.1.1</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.javascriptengine:javascriptengine:1.1.1</code>
    is released. Version 1.1.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/6d096598690b7d68e3ec2acafb57e3da463d6746..ebfabe3588025b959c66c9ade0d62884b853d5b4/javascriptengine/javascriptengine">these commits</a>
    .
  </p>
  <ul>
    <li>Remove direct kotlin-stdlib dependency.</li>
    <li>
      Fix bug in
      <code translate="no" dir="ltr">JavaScriptSandbox.isSupported()</code>
      returning incorrect result.
    </li>
  </ul>
