changelogHtml: |
  <h3 id="1.2.0-alpha01" data-text="Version 1.2.0-alpha01" tabindex="-1">Version 1.2.0-alpha01</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.javascriptengine:javascriptengine:1.2.0-alpha01</code>
    is released. Version 1.2.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ebfabe3588025b959c66c9ade0d62884b853d5b4..3e55c1ad889c6c0087b0bf6720b1a970b6e8ea3b/javascriptengine/javascriptengine">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">createSharedSandboxAsync</code>
      ,
      <code translate="no" dir="ltr">createDedicatedSandboxAsync</code>
      , and
      <code translate="no" dir="ltr">isShared</code>
      methods to
      <code translate="no" dir="ltr">JavaScriptSandbox</code>
      . These APIs allow apps and libraries to create multiple concurrent
      <code translate="no" dir="ltr">JavaScriptSandbox</code>
      es, using either a shared process for resource conservation or a dedicated process for increased stability and security. (
      <a href="https://android-review.googlesource.com/#/q/I3fc6a867ed2f4a88c0953ac102d37d37d67a2607">I3fc6a</a>
      )
    </li>
  </ul>
  <h2 id="javascriptengine_version_11_2" data-text="JavaScriptEngine Version 1.1" tabindex="-1">JavaScriptEngine Version 1.1</h2>
