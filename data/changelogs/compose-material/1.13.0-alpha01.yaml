changelogHtml: |
  <h3 id="1.13.0-alpha01" data-text="Version 1.13.0-alpha01" tabindex="-1">Version 1.13.0-alpha01</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material:material-*:1.13.0-alpha01</code>
    is released. Version 1.13.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/963bf914f78b389bdddef0da7f36bee19d897274..e9a673661e45bb2eaea8dd43632ce3e1ea6a2094/compose/material">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">androidx.benchmark</code>
      now has a
      <code translate="no" dir="ltr">minSdk</code>
      of 24. (
      <a href="https://android-review.googlesource.com/#/q/Ic2a8500af8a2bf092fcc1b27d9a599aa5f3b81d7">Ic2a85</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Optimized file-level initialization of
      <code translate="no" dir="ltr">material</code>
      top-level value class properties by using dynamic getters. (
      <a href="https://android-review.googlesource.com/#/q/Iae5919e431b4546a2c5b53e077b7c256e482a75f">Iae591</a>
      )
    </li>
    <li>
      Optimized companion object initialization of
      <code translate="no" dir="ltr">material</code>
      value classes (
      <code translate="no" dir="ltr">FabPosition</code>
      and
      <code translate="no" dir="ltr">Strings</code>
      ) by using dynamic getters. (
      <a href="https://android-review.googlesource.com/#/q/I0c7c021585c29fd01ac1d83404c5d2af7f308787">I0c7c0</a>
      )
    </li>
    <li>
      Remove requirement for
      <code translate="no" dir="ltr">compileSdk 37</code>
      (
      <a href="https://android-review.googlesource.com/#/q/If78b4fbdec15e6b1d6ad34a487ae10b2e2494325">If78b4</a>
      )
    </li>
  </ul>
  <h2 id="version_112_2" data-text="Version 1.12" tabindex="-1">Version 1.12</h2>
