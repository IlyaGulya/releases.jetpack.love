changelogHtml: |
  <h3 id="1.4.0-alpha01" data-text="Version 1.4.0-alpha01" tabindex="-1">Version 1.4.0-alpha01</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.concurrent:concurrent:1.4.0-alpha01</code>
    ,
    <code translate="no" dir="ltr">androidx.concurrent:concurrent-futures:1.4.0-alpha01</code>
    , and
    <code translate="no" dir="ltr">androidx.concurrent:concurrent-futures-ktx:1.4.0-alpha01</code>
    are released. Version 1.4.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/6d6c8782f1e2f710a8f305225f8cf20699dbafb2..61ee8cd421d0c0252d8db0253b739de537999371/concurrent">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add a utility method to get serial executors. (
      <a href="https://android-review.googlesource.com/#/q/I19fd6eb363c61ab9a072dd979a41c5b769b9ab34">I19fd6</a>
      ,
      <a href="https://issuetracker.google.com/issues/532183522">b/532183522</a>
      )
    </li>
  </ul>
  <p><strong>External Contribution</strong></p>
  <ul>
    <li>
      Merge concurrent-ktx into the concurrent library. All Kotlin extensions are now part of the main concurrent artifact. concurrent-ktx is now an empty artifact for compatibility. (
      <a href="https://android-review.googlesource.com/#/q/Ibaed204240ec46f894b542752d2fe1d7b6524421">Ibaed2</a>
      )
    </li>
  </ul>
  <h2 id="version_13_2" data-text="Version 1.3" tabindex="-1">Version 1.3</h2>
