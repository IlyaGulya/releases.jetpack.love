changelogHtml: |
  <h3 id="3.0.1" data-text="Version 3.0.1" tabindex="-1">Version 3.0.1</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.room3:room3-*:3.0.1</code>
    is released. Version 3.0.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/7fac77ef3619a0ad0872dbab2d86247263ebf2ab..4762f876f4d43c4c8853d8887f9b110fe25777e6/room3">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fix an unnecessary
      <code translate="no" dir="ltr">println()</code>
      during processing. Thanks to Simon Marquis! (
      <a href="https://issuetracker.google.com/issues/532893031">b/532893031</a>
      )
    </li>
    <li>
      Fix an issue regarding other database usages within another database's transaction mixing in leading undefined behaviour. (
      <a href="https://issuetracker.google.com/issues/437068912">b/437068912</a>
      )
    </li>
  </ul>
