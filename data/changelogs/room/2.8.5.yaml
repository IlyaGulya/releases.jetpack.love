changelogHtml: |
  <h3 id="2.8.5" data-text="Version 2.8.5" tabindex="-1">Version 2.8.5</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.room:room-*:2.8.5</code>
    is released. Version 2.8.5 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/75ef81cced187631f0dd74666188bd9d4cd3358f..b0fa397b49a0c6614fed04cec9dee0ec01f6b3a3/room">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Room suspending queries and invalidation tracker operations will now throw an
      <code translate="no" dir="ltr">IllegalStateException</code>
      when called after the database has been closed. (
      <a href="https://android-review.googlesource.com/#/q/Ic0166f79ff125d11b08b98541d78d0182083f7e9">Ic0166</a>
      ,
      <a href="https://issuetracker.google.com/issues/543076356">b/543076356</a>
      )
    </li>
  </ul>
