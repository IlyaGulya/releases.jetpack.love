changelogHtml: |
  <h3 id="1.1.0-alpha06" data-text="Version 1.1.0-alpha06" tabindex="-1">Version 1.1.0-alpha06</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.ink:ink-*:1.1.0-alpha06</code>
    is released. Version 1.1.0-alpha06 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e37cf4eae99bdc35def1209921d658612e2edbc3..61ee8cd421d0c0252d8db0253b739de537999371/ink">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">calculateMinimumRequiredVersion</code>
      methods to the API for
      <code translate="no" dir="ltr">BrushFamily</code>
      subtypes. (
      <a href="https://android-review.googlesource.com/#/q/I338c949db3ed98acf3396e949b04d694b506c0e7">I338c9</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">AffineTransform</code>
      component fields (
      <a href="https://android-review.googlesource.com/#/q/Ic2ec3db51ee6519bdcc02f17708a283e7017b2df">Ic2ec3</a>
      )
    </li>
    <li>
      Fix memory leak in
      <code translate="no" dir="ltr">InProgressStrokesView</code>
      , improved experimental partial stroke eraser visual artifacts, improved protobuf representation for custom brush texture layers (
      <a href="https://android-review.googlesource.com/#/q/I6ff86baa0134008d35829d8af33accc7338fb1ee">I6ff86</a>
      )
    </li>
    <li>
      Add initializing constructor for
      <code translate="no" dir="ltr">MutableAffineTransform</code>
      (to match
      <code translate="no" dir="ltr">ImmutableAffineTransform</code>
      ) (
      <a href="https://android-review.googlesource.com/#/q/I96ec7e2217911506a1e002248f1faca168a1b4ac">I96ec7</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">InProgressStroke.clear</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ie0032dc8ba11c56f0222cda0daa1f8748607bdf9">Ie0032</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">toImmutable</code>
      methods to data-structures with mutable and immutable subclasses (
      <a href="https://android-review.googlesource.com/#/q/I538354a1a2a21334e044b74ca38f6f207cc94e71">I53835</a>
      )
    </li>
    <li>
      KMP migration (
      <a href="https://android-review.googlesource.com/#/q/Icbf382b8f2dacbdea84f03019dcb06a8d280a4a0">Icbf38</a>
      ,
      <a href="https://issuetracker.google.com/issues/521850119">b/521850119</a>
      ,
      <a href="https://issuetracker.google.com/issues/534309122">b/534309122</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Adding further support for brush versioning and texture animations. (
      <a href="https://android-review.googlesource.com/#/q/Iea9ba137c199f51e57f43a8e9e36cc66d32e0abb">Iea9ba</a>
      )
    </li>
  </ul>
