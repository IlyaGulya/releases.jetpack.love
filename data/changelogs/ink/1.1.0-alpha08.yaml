changelogHtml: |
  <h3 id="1.1.0-alpha08" data-text="Version 1.1.0-alpha08" tabindex="-1">Version 1.1.0-alpha08</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.ink:ink-*:1.1.0-alpha08</code>
    is released. Version 1.1.0-alpha08 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..e4bd62f853853bf3522ed15681c58ef28b09ed44/ink">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add rendering support for KMP iOS via
      <code translate="no" dir="ltr">MetalRenderer</code>
      , under the opt-in annotation
      <code translate="no" dir="ltr">ExperimentalInkCrossPlatformRenderingApi</code>
      , based on KMP common APIs for core functionality
    </li>
    <li>
      Rename
      <code translate="no" dir="ltr">Target.TEXTURE_ANIMATION_PROGRESS_OFFSET</code>
      to
      <code translate="no" dir="ltr">Target.PAINT_ANIMATION_PROGRESS_OFFSET</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I8809f4d5ba68a0b9d4705145f9f90016a9541edf">I8809f</a>
      )
    </li>
    <li>
      Add overloads
      <code translate="no" dir="ltr">ImmutableAffineTransform.translate(float x, float, y)</code>
      and
      <code translate="no" dir="ltr">MutableAffineTransform populateFromTranslation(float x, float y)</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I8809f4d5ba68a0b9d4705145f9f90016a9541edf">I8809f</a>
      )
    </li>
    <li>
      Rename
      <code translate="no" dir="ltr">DampingNode</code>
      property from
      <code translate="no" dir="ltr">dampingSource</code>
      to
      <code translate="no" dir="ltr">dampOver</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Id3178a364e9d348e17fb3e2dbf38f59a82b97eb3">Id3178</a>
      )
    </li>
    <li>
      Rename
      <code translate="no" dir="ltr">DampingNode</code>
      property from
      <code translate="no" dir="ltr">dampingGap</code>
      to
      <code translate="no" dir="ltr">strength</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I69432e055764302d7c1db27bb6cf38d355604698">I69432</a>
      )
    </li>
    <li>
      Use
      <code translate="no" dir="ltr">Vec</code>
      type when defining
      <code translate="no" dir="ltr">EasingFunction.CubicBezier</code>
      instead of
      <code translate="no" dir="ltr">Float</code>
      s (
      <a href="https://android-review.googlesource.com/#/q/I69432e055764302d7c1db27bb6cf38d355604698">I69432</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">WorkerThread</code>
      annotation to mesh-editing eraser functions
      <code translate="no" dir="ltr">Stroke.subtract</code>
      and
      <code translate="no" dir="ltr">Stroke.split</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I69432e055764302d7c1db27bb6cf38d355604698">I69432</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Make
      <code translate="no" dir="ltr">Brush</code>
      samples KMP-compatible (
      <a href="https://android-review.googlesource.com/#/q/I77125151c77513f139bd74b084d96865f3491df4">I77125</a>
      )
    </li>
  </ul>
