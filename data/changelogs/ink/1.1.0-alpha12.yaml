changelogHtml: |
  <h3 id="1.1.0-alpha12" data-text="Version 1.1.0-alpha12" tabindex="-1">Version 1.1.0-alpha12</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.ink:ink-*:1.1.0-alpha12</code>
    is released. Version 1.1.0-alpha12 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..3e55c1ad889c6c0087b0bf6720b1a970b6e8ea3b/ink">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add Ink
      <code translate="no" dir="ltr">InProgressShapesView</code>
      method overloads for unfinished strokes from a specific device (
      <a href="https://android-review.googlesource.com/#/q/I9c9459cd660692f49b4598f999e94ecc71b16c92">I9c945</a>
      )
    </li>
    <li>
      Support multiple input devices simultaneously in Ink authoring module (
      <a href="https://android-review.googlesource.com/#/q/I41ee512318200d1e4e69260c6b3b03feea0e6f78">I41ee5</a>
      )
    </li>
    <li>
      Add linux-aarch64 JVM support (
      <a href="https://android-review.googlesource.com/#/q/I752e5c1a3fa6a9525e1059c40807c67c544fd392">I752e5</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/I1216b4796cf2e8dc2c096f3fc6ae45412e629852">I1216b</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Clamp stroke shape durations to be non-negative and monotonic (
      <a href="https://android-review.googlesource.com/#/q/I752e5c1a3fa6a9525e1059c40807c67c544fd392">I752e5</a>
      ,
      <a href="https://issuetracker.google.com/issues/552666754">b/552666754</a>
      )
    </li>
    <li>
      Change
      <code translate="no" dir="ltr">CanvasInProgressStrokesRenderHelperV33</code>
      requested frame rate to 720F. (
      <a href="https://android-review.googlesource.com/#/q/I752e5c1a3fa6a9525e1059c40807c67c544fd392">I752e5</a>
      )
    </li>
    <li>
      Update
      <code translate="no" dir="ltr">ink-authoring</code>
      and
      <code translate="no" dir="ltr">ink-authoring-compose</code>
      dependency on
      <code translate="no" dir="ltr">input-motionprediction</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ib84ef3343c925e5c407184cb247c74e765687d90">Ib84ef</a>
      )
    </li>
  </ul>
