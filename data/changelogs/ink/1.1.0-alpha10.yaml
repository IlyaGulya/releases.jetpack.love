changelogHtml: |
  <h3 id="1.1.0-alpha10" data-text="Version 1.1.0-alpha10" tabindex="-1">Version 1.1.0-alpha10</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.ink:ink-*:1.1.0-alpha10</code>
    is released. Version 1.1.0-alpha10 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..3566803898b060d7136357220affc9ece8236019/ink">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Add anti-aliasing to cut edges of strokes edited with the partial stroke eraser (
      <code translate="no" dir="ltr">Stroke.subtract</code>
      , optionally followed by
      <code translate="no" dir="ltr">Stroke.split</code>
      )
    </li>
  </ul>
