changelogHtml: |
  <h3 id="1.1.0-alpha09" data-text="Version 1.1.0-alpha09" tabindex="-1">Version 1.1.0-alpha09</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.ink:ink-*:1.1.0-alpha09</code>
    is released. Version 1.1.0-alpha09 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..9ffbd68e415c0ab0e5ba565835e1080ad40f1b16/ink">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Change Brush color shift to operate in Oklab color space, which better preserves perceived lightness in hue shifts. Renamed
      <code translate="no" dir="ltr">SATURATION</code>
      and
      <code translate="no" dir="ltr">LUMINOSITY</code>
      shift Brush Target APIs to
      <code translate="no" dir="ltr">CHROMA</code>
      and
      <code translate="no" dir="ltr">LIGHTNESS</code>
      accordingly. (
      <a href="https://android-review.googlesource.com/#/q/I0ed42fb8b3e258b46a2e7f0d53390afa7dc45efd">I0ed42</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/I99bfdb355ffd7f1083dbdac4167b1f5577740116">I99bfd</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
  </ul>
