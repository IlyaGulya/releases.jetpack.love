changelogHtml: |
  <h3 id="1.1.0-alpha11" data-text="Version 1.1.0-alpha11" tabindex="-1">Version 1.1.0-alpha11</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.ink:ink-*:1.1.0-alpha11</code>
    is released. Version 1.1.0-alpha11 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/3566803898b060d7136357220affc9ece8236019..a021adf44194ae86e596ae25ca43d5e4e18f6926/ink">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add experimental Ink APIs for calculating/storing phase offsets for strokes with animated textures (
      <a href="https://android-review.googlesource.com/#/q/I620e6f7a70715691bed4acfdc5ee199b0cc8d622">I620e6</a>
      )
    </li>
    <li>
      Add experimental Ink brush APIs for specifying an animated paint texture (
      <a href="https://android-review.googlesource.com/#/q/If0f10a8a9455af33a8f51668f24e0208a48e7013">If0f10</a>
      )
    </li>
    <li>
      Stroke shape (
      <code translate="no" dir="ltr">PartitionedMesh</code>
      ) serialization, to save partially erased strokes or to speed up document load times by saving mesh data (
      <a href="https://android-review.googlesource.com/#/q/I1604f6da99ce038abe51df87a673498c21a17997">I1604f</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed handling of concurrent inputs, and improved barrel twist compatibility. (
      <a href="https://android-review.googlesource.com/#/q/I0fc23934611435e978078368fa498a9d5e7d8abb">I0fc23</a>
      )
    </li>
  </ul>
