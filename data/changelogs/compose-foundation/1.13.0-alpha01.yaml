libraryId: compose-foundation
groupId: androidx.compose
version: 1.13.0-alpha01
releaseDate: 2026-08-12
#language=html
changelogHtml: |
  <h3 id="1.13.0-alpha01" data-text="Version 1.13.0-alpha01" tabindex="-1">Version 1.13.0-alpha01</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.foundation:foundation-*:1.13.0-alpha01</code>
    is released. Version 1.13.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/963bf914f78b389bdddef0da7f36bee19d897274..9586cfb5d4ee4296fd84037c43597a5ae4a39d1b/compose/foundation">these commits</a>
    .
  </p>
  <p><strong>Breaking Changes</strong></p>
  <ul>
    <li>
      Following on from the announcement in the previous release,
      <code translate="no" dir="ltr">Modifier.onFocusedBoundsChanged</code>
      has had its implementation fully removed. Using this modifier now no-ops. Migrate to using
      <code translate="no" dir="ltr">FocusTargetModifierNode.getFocusedRect()</code>
      to query this information on demand as needed. (
      <a href="https://android-review.googlesource.com/#/q/Ia39dbf5b8b6973111dfb3b80c33cc3d84d7dc224">Ia39db</a>
      ,
      <a href="https://issuetracker.google.com/issues/220030968">b/220030968</a>
      )
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Providing
      <code translate="no" dir="ltr">LazyLayoutCacheWindow</code>
      and
      <code translate="no" dir="ltr">LazyGridPrefetchStrategy</code>
      via
      <code translate="no" dir="ltr">LazyGridState</code>
      has been deprecated in favour of providing a
      <code translate="no" dir="ltr">LazyLayoutCacheWindow</code>
      to the composable function. (
      <a href="https://android-review.googlesource.com/#/q/I3f31e8a1794b5c84e02074f2c193b6a571526fe3">I3f31e</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">isSkipItemPlacementAnimationFixEnabled</code>
      flag (
      <a href="https://android-review.googlesource.com/#/q/I890f38fc47af56a25e406ce7e62b6b1f596d6395">I890f3</a>
      ,
      <a href="https://issuetracker.google.com/issues/493183465">b/493183465</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">isClearNestedScrollCoroutineScopeFixEnabled</code>
      flag (
      <a href="https://android-review.googlesource.com/#/q/Iedfd7dbc2135c79f85b42fab5196f8f2fdb8e986">Iedfd7</a>
      ,
      <a href="https://issuetracker.google.com/issues/506963276">b/506963276</a>
      )
    </li>
    <li>
      Changed flag
      <code translate="no" dir="ltr">isCacheWindowVisibleItemCountCheckEnabled</code>
      to
      <code translate="no" dir="ltr">isCacheWindowLookaheadCheckEnabled</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I2ea06145059191d1fb9c5dffd1822c82944a7c61">I2ea06</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">TextFieldState</code>
      now saves and restores text style information.
      <code translate="no" dir="ltr">AnnotatedString.Annotation.Saver</code>
      is now public to allow saving and restoring of
      <code translate="no" dir="ltr">AnnotatedString.Annotation</code>
      objects. (
      <a href="https://android-review.googlesource.com/#/q/I8b53310e091fb8dbf3b967a3d05160a7ee7bc161">I8b533</a>
      ,
      <a href="https://issuetracker.google.com/issues/135556699">b/135556699</a>
      )
    </li>
    <li>
      Adds a cache window to lazy staggered grid layout. To revert to the old prefetch behaviour, set
      <code translate="no" dir="ltr">isUsingCacheWindowInStaggeredGrids</code>
      to false. (
      <a href="https://android-review.googlesource.com/#/q/I1c70d5a1df9d903c161ea016fd86cf32c9cd2481">I1c70d</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">FlexBox</code>
      and its related configuration APIs have been promoted to stable and are no longer experimental. (
      <a href="https://android-review.googlesource.com/#/q/I209edb04879e230a01385d99a940377049956e86">I209ed</a>
      ,
      <a href="https://issuetracker.google.com/issues/475491619">b/475491619</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">maxItemsInEachLine</code>
      configuration to
      <code translate="no" dir="ltr">FlexBox</code>
      to allow limiting the number of items per line when wrapping is enabled. (
      <a href="https://android-review.googlesource.com/#/q/I2744bcfa267323b0aa4aabc93ff4ce0d1e01c3ef">I2744b</a>
      ,
      <a href="https://issuetracker.google.com/issues/475491619">b/475491619</a>
      )
    </li>
    <li>
      Annotated overridable empty base methods across Compose with
      <code translate="no" dir="ltr">@EmptySuper</code>
      to denote that overriding implementations should not invoke super. (
      <a href="https://android-review.googlesource.com/#/q/Id407ba2271cefe08c55717409ca22dbf23922c9e">Id407b</a>
      )
    </li>
    <li>
      Promoted
      <code translate="no" dir="ltr">WindowInsets</code>
      visibility and animation APIs to stable. (
      <a href="https://android-review.googlesource.com/#/q/I37441127982613960908a1b13db9da11cb73c7b6">I37441</a>
      ,
      <a href="https://issuetracker.google.com/issues/537329254">b/537329254</a>
      )
    </li>
    <li>
      Clicks on clickable elements now automatically play interaction sound effects on Android. (
      <a href="https://android-review.googlesource.com/#/q/Ia72f88c95decc66b7d4aae212f4805989074d0be">Ia72f8</a>
      )
    </li>
    <li>
      The cache window now refils the ahead window if the number of visible items change without having scrolled. Set the
      <code translate="no" dir="ltr">isCacheWindowVisibleItemCountCheckEnabled</code>
      flag to
      <code translate="no" dir="ltr">false</code>
      to disable this check and revert to old behaviour. (
      <a href="https://android-review.googlesource.com/#/q/I67b5a376315654b34a988d1e5141b2b251cfbd01">I67b5a</a>
      )
    </li>
    <li>
      Updated
      <code translate="no" dir="ltr">NestedScrollDispatcher.coroutineScope</code>
      property to safely return a cancelled
      <code translate="no" dir="ltr">CoroutineScope</code>
      when unattached or detached. (
      <a href="https://android-review.googlesource.com/#/q/I9b1120913c72b7e950bf0bc90107da4fd008f846">I9b112</a>
      ,
      <a href="https://issuetracker.google.com/issues/535290281">b/535290281</a>
      )
    </li>
    <li>
      Renamed
      <code translate="no" dir="ltr">enableNonScrollCaching</code>
      to
      <code translate="no" dir="ltr">isNonScrollCachingEnabled</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I7a54b2932575c999f7c0a9ead983a6aeb0e954d5">I7a54b</a>
      ,
      <a href="https://issuetracker.google.com/issues/535290282">b/535290282</a>
      )
    </li>
    <li>
      Added @
      <code translate="no" dir="ltr">CheckResult</code>
      to
      <code translate="no" dir="ltr">SemanticsNodeInteraction.isDisplayed</code>
      () and
      <code translate="no" dir="ltr">isNotDisplayed</code>
      () to ensure their return values are asserted, preventing silent test failures when developers mistakenly use them instead of assertion APIs. (
      <a href="https://android-review.googlesource.com/#/q/I1b447087e19fde4f9a64dd462e68bb21d14d463a">I1b447</a>
      ,
      <a href="https://issuetracker.google.com/issues/508178494">b/508178494</a>
      )
    </li>
    <li>
      Make
      <code translate="no" dir="ltr">LazyLayoutCacheWindow</code>
      stable (
      <a href="https://android-review.googlesource.com/#/q/I2cda3c6f86ea54915ed2caca8b00fb6ece9401f6">I2cda3</a>
      )
    </li>
    <li>
      Added the
      <code translate="no" dir="ltr">bringIntoViewSpec</code>
      param for Horizontal and Vertical Pager to allow overriding Pager's default implementation. (
      <a href="https://android-review.googlesource.com/#/q/Icdcbf8b96207d0e5730b47129fd0f7c4e8dbd5d8">Icdcbf</a>
      ,
      <a href="https://issuetracker.google.com/issues/505052292">b/505052292</a>
      )
    </li>
    <li>
      Fixes a bug in the lazy layout prefetch scheduler's idle detection. Previously, the scheduler might have incorrectly considered itself idle when a frame is severely delayed, potentially leading to jank when scrolling. To revert to the old behaviour set the
      <code translate="no" dir="ltr">isLazyPrefetchSchedulerIdleTimeFixEnabled</code>
      compose flag to false. (
      <a href="https://android-review.googlesource.com/#/q/If0594bb843247ed5b611af1f29b835e58524a87d">If0594</a>
      ,
      <a href="https://issuetracker.google.com/issues/458024295">b/458024295</a>
      )
    </li>
    <li>
      Introduce
      <code translate="no" dir="ltr">coroutineScopeOrNull()</code>
      in
      <code translate="no" dir="ltr">NestedScrollDispatcher</code>
      , an alternative API to access the dispatcher's parent coroutine scope. (
      <a href="https://android-review.googlesource.com/#/q/I18c0f6c699f5ecdb9c59a2551a2c75d7efe3ae02">I18c0f</a>
      )
    </li>
    <li>
      Fixed horizontal text shifting during overscroll in Compose. Can be disabled via
      <code translate="no" dir="ltr">AndroidComposeFoundationFlags.isOverscrollPixelRoundingEnabled</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ica169e97b7238c355bd12dcce1df4b12da7bc6fe">Ica169</a>
      ,
      <a href="https://issuetracker.google.com/issues/532079110">b/532079110</a>
      ,
      <a href="https://issuetracker.google.com/issues/532081619">b/532081619</a>
      )
    </li>
    <li>
      Introduce the flag
      <code translate="no" dir="ltr">isDraggableZeroDeltaConsumptionEnabled</code>
      to control the rollout of this fix in Draggable. Zero delta events are now processed correctly. (
      <a href="https://android-review.googlesource.com/#/q/I50eb1d11564c198bd8e73d3bd52053f7270ce605">I50eb1</a>
      ,
      <a href="https://issuetracker.google.com/issues/524163413">b/524163413</a>
      )
    </li>
    <li>
      Text selection is now safely constrained to the text length during concurrent text updates to prevent crashes. (
      <a href="https://android-review.googlesource.com/#/q/I64fd7fdcf6549976c0764a831abd27d70d83d4ec">I64fd7</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">androidx.benchmark</code>
      now has a
      <code translate="no" dir="ltr">minSdk</code>
      of 24. (
      <a href="https://android-review.googlesource.com/#/q/Ic2a8500af8a2bf092fcc1b27d9a599aa5f3b81d7">Ic2a85</a>
      )
    </li>
    <li>
      The links are now better handling the clicks when span multiline. The touch target has been override to 0 to support this. If this is not a desirable behavior, use
      <code translate="no" dir="ltr">ComposeFoundationFlags.isLinkMinimumTouchTargetSizeZeroEnabled</code>
      flag to override it. (
      <a href="https://android-review.googlesource.com/#/q/Ide41b67b4d1d94cb9308e1d34185aa9edf8ed04c">Ide41b</a>
      ,
      <a href="https://issuetracker.google.com/issues/361106057">b/361106057</a>
      )
    </li>
    <li>
      Fixed a low-volume exception when writing to a mutable state object. (
      <a href="https://android-review.googlesource.com/#/q/I48194daf951489710c7942bfc30f1006c6221608">I48194</a>
      ,
      <a href="https://issuetracker.google.com/issues/503110696">b/503110696</a>
      )
    </li>
    <li>
      Expose observable
      <code translate="no" dir="ltr">keys</code>
      on
      <code translate="no" dir="ltr">SaveableStateHolder</code>
      to simplify navigation/back stack state management and remove the need for external
      <code translate="no" dir="ltr">key</code>
      tracking. Access via
      <code translate="no" dir="ltr">holder.keys</code>
      ; remove with
      <code translate="no" dir="ltr">removeState</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I9bbbbb908db412063ea99fecd2ebfff78929af24">I9bbbb</a>
      ,
      <a href="https://issuetracker.google.com/issues/398887924">b/398887924</a>
      )
    </li>
    <li>
      Removes experimental outdated
      <code translate="no" dir="ltr">IndirectPointerEvent</code>
      helper function. (
      <a href="https://android-review.googlesource.com/#/q/I05deed7e712f7a964d434a92e5fdba45a143798c">I05dee</a>
      ,
      <a href="https://issuetracker.google.com/issues/499336763">b/499336763</a>
      ,
      <a href="https://issuetracker.google.com/issues/501098299">b/501098299</a>
      ,
      <a href="https://issuetracker.google.com/issues/501098376">b/501098376</a>
      ,
      <a href="https://issuetracker.google.com/issues/513249467">b/513249467</a>
      )
    </li>
    <li>
      Make
      <code translate="no" dir="ltr">LocalBringIntoViewSpec</code>
      stable on Android. (
      <a href="https://android-review.googlesource.com/#/q/Ibcb97d4e362163c26879c7d19704bb39912259dc">Ibcb97</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">isMultiLaneCacheWindowEnabled</code>
      flag (
      <a href="https://android-review.googlesource.com/#/q/I3d997155681d650c6b9023eb7ce0e823ca595c5a">I3d997</a>
      )
    </li>
    <li>
      Created a new
      <code translate="no" dir="ltr">SelectionState</code>
      API, to be passed to
      <code translate="no" dir="ltr">SelectionContainer</code>
      for observing selected text and programmatically updating selection." into androidx-main am: 929401883c am: c02871cac4 (
      <a href="https://android-review.googlesource.com/#/q/I15bd4c06c62ee001a31f5d39b7469f7642dd7505">I15bd4</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">LocalTextFieldContentObserverRegistrationExecutor</code>
      that offers a way to delegate the implicit
      <code translate="no" dir="ltr">ContentObserver</code>
      registration that happens in
      <code translate="no" dir="ltr">TextField</code>
      s to a background thread. (
      <a href="https://android-review.googlesource.com/#/q/Ib4fa6b39ec15bea7f6e2a425600bc62f6c709ad5">Ib4fa6</a>
      ,
      <a href="https://issuetracker.google.com/issues/505287297">b/505287297</a>
      ,
      <a href="https://issuetracker.google.com/issues/509842675">b/509842675</a>
      )
    </li>
    <li>
      Renamed
      <code translate="no" dir="ltr">TextObfuscationMode.Default</code>
      to
      <code translate="no" dir="ltr">System</code>
      .
      <code translate="no" dir="ltr">TextObfuscationMode.RevealLastTyped</code>
      now acts as an absolute override and always reveals the last typed character. The default argument of
      <code translate="no" dir="ltr">BasicSecureTextField</code>
      is updated to System. (
      <a href="https://android-review.googlesource.com/#/q/If26d388fdefadc7626cd60fa8e4a8cc375941311">If26d3</a>
      ,
      <a href="https://issuetracker.google.com/issues/425658491">b/425658491</a>
      ,
      <a href="https://issuetracker.google.com/issues/453647378">b/453647378</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue where fast scrolling in Compose nested inside an Android scroll container (like
      <code translate="no" dir="ltr">ScrollView</code>
      or
      <code translate="no" dir="ltr">CoordinatorLayout</code>
      ) would sometimes calculate incorrect velocity. (
      <a href="https://android-review.googlesource.com/#/q/I0f01748498ac88957c49906755782065516a85e5">I0f017</a>
      )
    </li>
    <li>
      Fixed an issue in
      <code translate="no" dir="ltr">FlexBox</code>
      where focus traversal did not match the visual order of items when using reverse directions, reverse wrap, or custom item order. (
      <a href="https://android-review.googlesource.com/#/q/I4cc617babd013201e187fdc287b82991b470828b">I4cc61</a>
      ,
      <a href="https://issuetracker.google.com/issues/521609263">b/521609263</a>
      )
    </li>
    <li>
      Fixed an issue where standard layout modifiers like
      <code translate="no" dir="ltr">Modifier.fillMaxWidth()</code>
      and
      <code translate="no" dir="ltr">Modifier.fillMaxHeight()</code>
      had no effect on items inside
      <code translate="no" dir="ltr">FlexBox</code>
      unless an explicit flex grow factor was specified. (
      <a href="https://android-review.googlesource.com/#/q/Ib0ac33b93b74242bde3a0597446aafe9fe1649ca">Ib0ac3</a>
      ,
      <a href="https://issuetracker.google.com/issues/515657458">b/515657458</a>
      )
    </li>
    <li>
      Optimized file-level initialization of
      <code translate="no" dir="ltr">foundation</code>
      top-level value class properties by using dynamic getters. (
      <a href="https://android-review.googlesource.com/#/q/I570d7f84d56d251fedff604c31d683b4f5126dae">I570d7</a>
      )
    </li>
    <li>
      Optimized companion object initialization of
      <code translate="no" dir="ltr">foundation-layout</code>
      value classes (
      <code translate="no" dir="ltr">WindowInsetsSides</code>
      , etc.) by using dynamic getters. (
      <a href="https://android-review.googlesource.com/#/q/I01c2bd94c52d6b0bd38c6d9242834f5085dbe222">I01c2b</a>
      )
    </li>
    <li>
      Fixed an issue where Compose text selection context menu items displayed stale strings after an in-app locale switch when Activity restarts were disabled via
      <code translate="no" dir="ltr">android:configChanges</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ic910be4a0688615a5eaa438fd338e1b49278bd41">Ic910b</a>
      ,
      <a href="https://issuetracker.google.com/issues/515156417">b/515156417</a>
      )
    </li>
    <li>
      Optimized companion object initialization of
      <code translate="no" dir="ltr">compose:foundation</code>
      value classes (
      <code translate="no" dir="ltr">KeyModifiers</code>
      ,
      <code translate="no" dir="ltr">MarqueeAnimationMode</code>
      ,
      <code translate="no" dir="ltr">Source</code>
      , etc.) by using dynamic getters. (
      <a href="https://android-review.googlesource.com/#/q/I78455710a8fc4f460bffcd13301a10244ec68e19">I78455</a>
      )
    </li>
    <li>
      Fixes style animations to ensure that, when transitioning to and from a value that is only conditionally set in an animation, it will be treated as animating to and from the default value of the property. (
      <a href="https://android-review.googlesource.com/#/q/I8e41d5b3242b3afb7d51ed134fdf2e2331e06a21">I8e41d</a>
      ,
      <a href="https://issuetracker.google.com/issues/527140078">b/527140078</a>
      )
    </li>
    <li>
      Fixed an issue in Grid where auto-placed items with a span larger than the available explicit tracks in the constrained direction would bleed outside the grid's bounds when gaps were applied. (
      <a href="https://android-review.googlesource.com/#/q/I00ce095266c2eda5fd718b9ecf6c0ce939fb5508">I00ce0</a>
      ,
      <a href="https://issuetracker.google.com/issues/506570362">b/506570362</a>
      )
    </li>
    <li>
      Cleans up API information (
      <a href="https://android-review.googlesource.com/#/q/Ia8066818f7e33220445aaeafa9ecc0668cc4818b">Ia8066</a>
      )
    </li>
    <li>
      Fixed a bug in
      <code translate="no" dir="ltr">BasicTextField</code>
      where it would not correctly provide extracted text updates to the IME when requested. (
      <a href="https://android-review.googlesource.com/#/q/I746fad07c1c04e6a8a4dc11bcd2973982760c0e4">I746fa</a>
      ,
      <a href="https://issuetracker.google.com/issues/203549026">b/203549026</a>
      ,
      <a href="https://issuetracker.google.com/issues/492363474">b/492363474</a>
      )
    </li>
  </ul>
  <h2 id="version_112_2" data-text="Version 1.12" tabindex="-1">Version 1.12</h2>
