changelogHtml: |
  <h3 id="1.19.0-alpha02" data-text="Version 1.19.0-alpha02" tabindex="-1">Version 1.19.0-alpha02</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.webkit:webkit:1.19.0-alpha02</code>
    is released. Version 1.19.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..3e55c1ad889c6c0087b0bf6720b1a970b6e8ea3b/webkit/webkit">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added experimental
      <code translate="no" dir="ltr">configureIsolatedSites</code>
      and
      <code translate="no" dir="ltr">canConfigureIsolatedSites</code>
      methods on
      <code translate="no" dir="ltr">Profile</code>
      , which can be used to separate more trusted or first-party sites into a separate renderer process from the default renderer used for all other sites. This can be used to establish an additional security boundary. (
      <a href="https://android-review.googlesource.com/#/q/I3ba2498df0a2e696d634287aadecf91f7c9d7abc">I3ba24</a>
      )
    </li>
  </ul>
