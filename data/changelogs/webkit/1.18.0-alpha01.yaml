changelogHtml: |
  <h3 id="webkit-1.18.0-alpha01" data-text="Version 1.18.0-alpha01" tabindex="-1">Version 1.18.0-alpha01</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.webkit:webkit:1.18.0-alpha01</code>
    is released. Version 1.18.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/86a006fbdf97644dbc4072bf0ee700e15ce02986..3b87180049780b1f2b8f0fd7b42372a617394079/webkit/webkit">these commits</a>
    .
  </p>
  <p><strong>New Features</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">Profile#setCrossOriginIsolatedAllowlist</code>
      and
      <code translate="no" dir="ltr">Profile#getCrossOriginIsolatedAllowlist</code>
      API to opt out of origin isolation security features, allowing the use of
      <code translate="no" dir="ltr">SharedArrayBuffer</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I889d38a9362c2ea94370fe796357d8194925a4e2">I889d3</a>
      ,
      <a href="https://issuetracker.google.com/issues/545572447">b/545572447</a>
      )
    </li>
  </ul>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Renames
      <code translate="no" dir="ltr">PrefetchParameters#isJavaScriptEnabled</code>
      to
      <code translate="no" dir="ltr">includeClientHints</code>
      .
      <code translate="no" dir="ltr">isJavaScriptEnabled</code>
      is marked as deprecated. (
      <a href="https://android-review.googlesource.com/#/q/I269d341e2299d72e312240bf830f8c509947aba0">I269d3</a>
      ,
      <a href="https://issuetracker.google.com/issues/537260697">b/537260697</a>
      )
    </li>
    <li>
      Adds
      <code translate="no" dir="ltr">WEBVIEW_NAVIGATE_DRAIN_PREFETCH</code>
      to
      <code translate="no" dir="ltr">WebViewFeature</code>
      , which can be used to determine whether Navigation#navigate will drain the prefetch queue before navigating to the new URL. (
      <a href="https://android-review.googlesource.com/#/q/I6a7a9000bc4383d220ae74126afe7deb47694a51">I6a7a9</a>
      )
    </li>
    <li>
      Renames
      <code translate="no" dir="ltr">Profile#addQuicHints</code>
      to
      <code translate="no" dir="ltr">preferQuicFor</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I9a66326cc7e39d6fbd4b23af96ac7becadec59bf">I9a663</a>
      )
    </li>
  </ul>
  <h2 id="webkit_version_117_2" data-text="Webkit Version 1.17" tabindex="-1">Webkit Version 1.17</h2>
