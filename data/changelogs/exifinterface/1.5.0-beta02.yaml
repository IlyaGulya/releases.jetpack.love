#language=html
changelogHtml: |
  <h3 id="1.5.0-beta02" data-text="Version 1.5.0-beta02" tabindex="-1">Version 1.5.0-beta02</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.exifinterface:exifinterface:1.5.0-beta02</code>
    is released. Version 1.5.0-beta02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..c395005ece1a96fa54b051898031ab98a90323e9/exifinterface/exifinterface">these commits</a>
    .
  </p>
  <ul>
    <li>Ensure Exif IFD tags are written in ascending order by tag ID.</li>
    <li>
      Make the date formatters inside
      <code translate="no" dir="ltr">ExifInterface</code>
      thread-safe.
    </li>
    <li>
      Stop adding an incorrect
      <code translate="no" dir="ltr">NUL</code>
      terminator to Exif tags of type
      <code translate="no" dir="ltr">UNDEFINED</code>
      .
    </li>
  </ul>
