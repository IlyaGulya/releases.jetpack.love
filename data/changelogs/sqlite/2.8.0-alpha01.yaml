changelogHtml: |
  <h3 id="2.8.0-alpha01" data-text="Version 2.8.0-alpha01" tabindex="-1">Version 2.8.0-alpha01</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.sqlite:sqlite-*:2.8.0-alpha01</code>
    is released. Version 2.8.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/190a3431c064ca5e90e451b3443714ae684b8127..e4bd62f853853bf3522ed15681c58ef28b09ed44/sqlite">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue on web and suspending drivers where cancelling a coroutine during a transaction could cause the database and connection to get into a bad state, preventing further usages. (
      <a href="https://android-review.googlesource.com/#/q/If75c07cef62bd9b2c2f8bb56c95b6183b04fc9f2">If75c0</a>
      ,
      <a href="https://issuetracker.google.com/issues/549860940">b/549860940</a>
      )
    </li>
    <li>
      Cleans up API information (
      <a href="https://android-review.googlesource.com/#/q/Ia8066818f7e33220445aaeafa9ecc0668cc4818b">Ia8066</a>
      )
    </li>
  </ul>
  <h2 id="version_27_2" data-text="Version 2.7" tabindex="-1">Version 2.7</h2>
