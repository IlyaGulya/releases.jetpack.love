changelogHtml: |
  <h3 id="1.0.0-alpha17" data-text="Version 1.0.0-alpha17" tabindex="-1">Version 1.0.0-alpha17</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.wear:wear:1.0.0-alpha17</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.wear:wear-core:1.0.0-alpha17</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.wear:wear-tooling-preview:1.0.0-alpha17</code>
    are released. Version 1.0.0-alpha17 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..dbfd25ce92ea92b4960bf8613bbdb777c6357845/glance/wear">these commits</a>
    .
  </p>
  <p><strong>New features</strong></p>
  <ul>
    <li>
      Added lint checks in Glance Wear to enforce that each
      <code translate="no" dir="ltr">&lt;container&gt;</code>
      in a
      <code translate="no" dir="ltr">&lt;wearwidget-provider&gt;</code>
      XML for Widget Metadata explicitly specifies a type attribute that is supported and does not define duplicate types. (
      <a href="https://android-review.googlesource.com/#/q/I52c9a35567634046882911f939a7c56f5a0ed0d5">I52c9a</a>
      ,
      <a href="https://issuetracker.google.com/issues/464458215">b/464458215</a>
      )
    </li>
  </ul>
