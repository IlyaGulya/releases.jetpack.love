version: 1.0.0-alpha23
releaseDate: 2026-11-18
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha23" data-text="Version 1.0.0-alpha23" tabindex="-1">Version 1.0.0-alpha23</h3>
  <p>November 18, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.wear:wear:1.0.0-alpha23</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.wear:wear-core:1.0.0-alpha23</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.wear:wear-tooling-preview:1.0.0-alpha23</code>
    are released. Version 1.0.0-alpha23 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/a021adf44194ae86e596ae25ca43d5e4e18f6926..fada7ec3895a502f299e1c8e230423bcc9b37f16/glance/wear">these commits</a>
    .
  </p>
  <p><strong>Additional changes</strong></p>
  <ul>
    <li>
      Updated the default squircle widget preview container specs (
      <a href="https://android-review.googlesource.com/#/q/I4bef61b36630db52d6178e0783be9ee6d1612555">I4bef6</a>
      ):
      <ul>
        <li>Height updated to 64dp (small) and 124dp (large)</li>
        <li>Corner Radius updated to 32dp</li>
        <li>Safe inner padding updated to 10dp</li>
      </ul>
    </li>
    <li>
      Added Lint check to ensure Wear widget configuration activities include the required
      <code translate="no" dir="ltr">PROVIDER_CONFIG</code>
      category in their
      <code translate="no" dir="ltr">&lt;intent-filter&gt;</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Id30a61c2df3d8d332407cefe0ae86adad9550dad">Id30a6</a>
      )
    </li>
  </ul>
