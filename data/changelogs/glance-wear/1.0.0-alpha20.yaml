version: 1.0.0-alpha20
releaseDate: 2026-10-07
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha20" data-text="Version 1.0.0-alpha20" tabindex="-1">Version 1.0.0-alpha20</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.wear:wear:1.0.0-alpha20</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.wear:wear-core:1.0.0-alpha20</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.wear:wear-tooling-preview:1.0.0-alpha20</code>
    are released. Version 1.0.0-alpha20 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..988ac9734e8223273eb7f186ee1639ee68deb025/glance/wear">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">CATEGORY_PROVIDER_CONFIG</code>
      ,
      <code translate="no" dir="ltr">EXTRA_CONFIG_WIDGET_ID</code>
      , and
      <code translate="no" dir="ltr">EXTRA_CONFIG_PROVIDER_COMPONENT</code>
      constants to
      <code translate="no" dir="ltr">GlanceWearWidget</code>
      for handling widget provider configuration intents. (
      <a href="https://android-review.googlesource.com/#/q/I32fa43745cf396b44a4ea3c9a9a433ec45e7ec0f">I32fa4</a>
      )
    </li>
    <li>
      Renamed
      <code translate="no" dir="ltr">useSafeFallbackRendererVersion</code>
      parameter in the
      <code translate="no" dir="ltr">WearWidgetPreview</code>
      to
      <code translate="no" dir="ltr">useBaselineHostVersion</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I07bca2454493419942790f3ddecef72d4ea1f453">I07bca</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed widget updates in the Widget Tray Emulator when calling
      <code translate="no" dir="ltr">triggerUpdateAll</code>
      on debuggable builds. (
      <a href="https://android-review.googlesource.com/#/q/I22d3f0648dec97e25ee2443bc14c96455a08c8c1">I22d3f</a>
      )
    </li>
    <li>
      Changed the default value of
      <code translate="no" dir="ltr">useSafeFallbackRendererVersion</code>
      in
      <code translate="no" dir="ltr">WearWidgetPreview</code>
      from
      <code translate="no" dir="ltr">true</code>
      to
      <code translate="no" dir="ltr">false</code>
      so previews render with the latest renderer version by default. (
      <a href="https://android-review.googlesource.com/#/q/Ied6b9490e4ebdc068dd84027cac798dbcf47543e">Ied6b9</a>
      )
    </li>
  </ul>
