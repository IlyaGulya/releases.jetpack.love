changelogHtml: |
  <h3 id="1.0.0-alpha21" data-text="Version 1.0.0-alpha21" tabindex="-1">Version 1.0.0-alpha21</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.wear:wear:1.0.0-alpha21</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.wear:wear-core:1.0.0-alpha21</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.wear:wear-tooling-preview:1.0.0-alpha21</code>
    are released. Version 1.0.0-alpha21 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/988ac9734e8223273eb7f186ee1639ee68deb025..a61b956e948f613f1f05085e98efb56302b159b7/glance/wear">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">GlanceWearProfiles.wearWidgets</code>
      <code translate="no" dir="ltr">RemoteCompose</code>
      profile for Glance Wear widgets and their supported operations. (
      <a href="https://android-review.googlesource.com/#/q/I842250188fb9b09dab7933047fcf417c30c34d5f">I84225</a>
      )
    </li>
  </ul>
