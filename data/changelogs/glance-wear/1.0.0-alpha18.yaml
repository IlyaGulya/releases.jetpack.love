#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha18" data-text="Version 1.0.0-alpha18" tabindex="-1">Version 1.0.0-alpha18</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.wear:wear:1.0.0-alpha18</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.wear:wear-core:1.0.0-alpha18</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.wear:wear-tooling-preview:1.0.0-alpha18</code>
    are released. Version 1.0.0-alpha18 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..ff5f9e2dab00ff4a25527186a3232db08dc66d5a/glance/wear">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">useSafeFallbackRendererVersion</code>
      parameter to
      <code translate="no" dir="ltr">WearWidgetPreview</code>
      to allow previewing widgets with a safe fallback set of supported operations for older hosts. (
      <a href="https://android-review.googlesource.com/#/q/I9c3240b12f9e8615b736f330345ccda38560a885">I9c324</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
    <li>
      Added lint check to warn against redundant
      <code translate="no" dir="ltr">fontFamily</code>
      parameter usages in Wear widgets. (
      <a href="https://android-review.googlesource.com/#/q/I7730ccbdd3e8c0390f0691adc17b72280670f496">I7730c</a>
      )
    </li>
  </ul>
