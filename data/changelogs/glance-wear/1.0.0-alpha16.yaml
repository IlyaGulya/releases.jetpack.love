changelogHtml: |
  <h3 id="1.0.0-alpha16" data-text="Version 1.0.0-alpha16" tabindex="-1">Version 1.0.0-alpha16</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.glance.wear:wear:1.0.0-alpha16</code>
    ,
    <code translate="no" dir="ltr">androidx.glance.wear:wear-core:1.0.0-alpha16</code>
    , and
    <code translate="no" dir="ltr">androidx.glance.wear:wear-tooling-preview:1.0.0-alpha16</code>
    are released. Version 1.0.0-alpha16 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/61ee8cd421d0c0252d8db0253b739de537999371..384f3c27346bf5812f359330dc2310f0cbb66402/glance/wear">these commits</a>
    .
  </p>
  <p><strong>New features</strong></p>
  <ul>
    <li>
      Added Lint validation for
      <code translate="no" dir="ltr">&lt;wearwidget-provider&gt;</code>
      XML metadata to ensure required configuration elements (such as
      <code translate="no" dir="ltr">container</code>
      and
      <code translate="no" dir="ltr">previewImage</code>
      ) are present. (
      <a href="https://android-review.googlesource.com/#/q/Ia99833b17e492bfb49f34fa513c6e34f2138f7f5">Ia9983</a>
      ,
      <a href="https://issuetracker.google.com/issues/464458215">b/464458215</a>
      )
    </li>
    <li>
      Added Lint error warning for setting black or transparent background to a Wear Widget (
      <a href="https://android-review.googlesource.com/#/q/Idedb0242b97a17aeda7c917c6973fb317939706e">Idedb0</a>
      ,
      <a href="https://issuetracker.google.com/issues/529269573">b/529269573</a>
      )
    </li>
    <li>
      Enabled
      <code translate="no" dir="ltr">CORE_TEXT</code>
      Remote Compose operation for Wear Widgets profile. This allows
      <code translate="no" dir="ltr">RemoteText</code>
      to use variable font features, such as font axes, line heights, etc., on supported Host renderers, with automatic fallback when its not supported.
    </li>
  </ul>
  <p><strong>Fixes</strong></p>
  <ul>
    <li>
      Updated KDocs for
      <code translate="no" dir="ltr">AssociateWithGlanceWearWidget</code>
      annotation per developers' feedback
    </li>
  </ul>
