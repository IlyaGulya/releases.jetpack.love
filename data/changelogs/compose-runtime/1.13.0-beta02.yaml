changelogHtml: |
  <h3 id="1.13.0-beta02" data-text="Version 1.13.0-beta02" tabindex="-1">Version 1.13.0-beta02</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.runtime:runtime-*:1.13.0-beta02</code>
    is released. Version 1.13.0-beta02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/55d45bc889e6e54d26f897e1299b3f5d6ca78acb..8c4a5fab030e62e6dac58c45f5fff974facf903f/compose/runtime">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed a memory leak in
      <code translate="no" dir="ltr">ComputedState</code>
      that could the recorded values of states from being released. Also fixed an issue that could prevent
      <code translate="no" dir="ltr">ComputedState</code>
      from invalidating correctly when its calculation block called
      <code translate="no" dir="ltr">Snapshot.withoutReadObservation</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I880eb0988468959f19d3ed781f8559a5e4298bf9">I880eb</a>
      )
    </li>
  </ul>
