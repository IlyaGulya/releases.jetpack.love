changelogHtml: |
  <h3 id="1.13.0-alpha01" data-text="Version 1.13.0-alpha01" tabindex="-1">Version 1.13.0-alpha01</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.runtime:runtime-*:1.13.0-alpha01</code>
    is released. Version 1.13.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/963bf914f78b389bdddef0da7f36bee19d897274..e25ec03c7788f3a71bd0290253e35cb311fa4f5f/compose/runtime">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <p>
        We've adjusted the
        <code translate="no" dir="ltr">LinkTable</code>
        feature flag to reduce contention in merged proguard rule sets and to increase compatibility when an app is minified outside of Gradle. The proguard syntax used to configure the flag has changed slightly. See below, and note the added parenthesis (
        <a href="https://android-review.googlesource.com/#/q/I419da7dd5ae6de407d2309c11198210e894fbda8">I419da</a>
        ):
        <code translate="no" dir="ltr">-assumevalues public class androidx.compose.runtime.ComposeRuntimeFlags { static boolean isLinkBufferComposerEnabled() return true; }</code>
      </p>
    </li>
    <li>
      <p>
        <code translate="no" dir="ltr">produceState()</code>
        and
        <code translate="no" dir="ltr">Flow.collectAsState()</code>
        now accept a
        <code translate="no" dir="ltr">SnapshotMutationPolicy</code>
        argument to control the equality and merging policy of the underlying
        <code translate="no" dir="ltr">State</code>
        object. (
        <a href="https://android-review.googlesource.com/#/q/I0c1672cad07da8cfd19fd93df54b59e040dcef21">I0c167</a>
        ,
        <a href="https://issuetracker.google.com/issues/405128869">b/405128869</a>
        )
      </p>
    </li>
    <li>
      <p>
        Made
        <code translate="no" dir="ltr">@ComposableTarget</code>
        repeatable. See the updated documentation for more information. (
        <a href="https://android-review.googlesource.com/#/q/I99a891b63f9f1c2b611117fcf55db6254fe9ee77">I99a89</a>
        ,
        <a href="https://issuetracker.google.com/issues/481422057">b/481422057</a>
        )
      </p>
    </li>
    <li>
      <p>
        Added
        <code translate="no" dir="ltr">RecompositionTracer</code>
        to record recomposition invalidation flow (
        <a href="https://android-review.googlesource.com/#/q/I1dbc18d06eb0593446462062de5b1a1afbd7426b">I1dbc1</a>
        ,
        <a href="https://android-review.googlesource.com/#/q/Ia991d32923ca94d41999007bfd25697c5d8dba8a">Ia991d</a>
        ,
        <a href="https://issuetracker.google.com/issues/531813367">b/531813367</a>
        )
      </p>
    </li>
    <li>
      <p>
        Exposed observable
        <code translate="no" dir="ltr">keys</code>
        on
        <code translate="no" dir="ltr">SaveableStateHolder</code>
        to simplify navigation/back stack state management and remove the need for external
        <code translate="no" dir="ltr">key</code>
        tracking. Access via
        <code translate="no" dir="ltr">holder.keys</code>
        ; remove with
        <code translate="no" dir="ltr">removeState</code>
        . (
        <a href="https://android-review.googlesource.com/#/q/I9bbbbb908db412063ea99fecd2ebfff78929af24">I9bbbb</a>
        ,
        <a href="https://issuetracker.google.com/issues/398887924">b/398887924</a>
        )
      </p>
    </li>
    <li>
      <p>
        Added
        <code translate="no" dir="ltr">staticCompositionLocalWithComputedDefaultOf</code>
        to create
        <code translate="no" dir="ltr">ProvidableCompositionLocals</code>
        that act as static when provided, or computed when unprovided. (
        <a href="https://android-review.googlesource.com/#/q/I844e4d856fe81e34273f1ec228d29cf288eb04d7">I844e4</a>
        )
      </p>
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue in the
      <code translate="no" dir="ltr">GapComposer</code>
      that can cause
      <code translate="no" dir="ltr">RememberObserver</code>
      instances after a
      <code translate="no" dir="ltr">withCompositionLocal</code>
      block to incorrectly execute their forget callbacks before
      <code translate="no" dir="ltr">RememberObserver</code>
      s in the block. (
      <a href="https://android-review.googlesource.com/#/q/I4d54cb4f4bded090d77b65ead27b60ef455c487c">I4d54c</a>
      )
    </li>
    <li>
      Fixed a low-volume exception when writing to a mutable state object. (
      <a href="https://android-review.googlesource.com/#/q/I48194daf951489710c7942bfc30f1006c6221608">I48194</a>
      ,
      <a href="https://issuetracker.google.com/issues/503110696">b/503110696</a>
      )
    </li>
    <li>
      Fixed a bug in
      <code translate="no" dir="ltr">SnapshotStateSet.writeToParcel</code>
      where it was only serializing the first entry. (
      <a href="https://android-review.googlesource.com/#/q/I64f4c91903ddb920bb624149bf6fa0b9f12383da">I64f4c</a>
      ,
      <a href="https://issuetracker.google.com/issues/537461421">b/537461421</a>
      )
    </li>
    <li>
      The
      <code translate="no" dir="ltr">CancellationException</code>
      s used to cancel
      <code translate="no" dir="ltr">LaunchedEffect</code>
      s and remembered
      <code translate="no" dir="ltr">CoroutineScopes</code>
      have been tweaked for clarity when appearing in stack traces. (
      <a href="https://android-review.googlesource.com/#/q/I89840ede0b993b20ead4405befa1174a257fea20">I89840</a>
      ,
      <a href="https://issuetracker.google.com/issues/449897855">b/449897855</a>
      )
    </li>
    <li>
      Optimized companion object initialization of
      <code translate="no" dir="ltr">compose:runtime</code>
      value classes (
      <code translate="no" dir="ltr">ComposeStackTraceMode</code>
      ,
      <code translate="no" dir="ltr">GroupKind</code>
      ) by using dynamic getters. (
      <a href="https://android-review.googlesource.com/#/q/I50640b7f06085022234faeedcfea14f20974f254">I50640</a>
      )
    </li>
    <li>
      Remove requirement for
      <code translate="no" dir="ltr">compileSdk</code>
      37 (
      <a href="https://android-review.googlesource.com/#/q/If78b4fbdec15e6b1d6ad34a487ae10b2e2494325">If78b4</a>
      )
    </li>
  </ul>
  <p><strong>External Contribution</strong></p>
  <ul>
    <li>
      Fixed parent compositions becoming unresponsive when erroring subcomposition is removed during Live Edit. (
      <a href="https://android-review.googlesource.com/#/q/I3717cdfbd23927aa66a023c5dc9e30133e0f8153">I3717c</a>
      )
    </li>
    <li>
      Fixed Live Edit recovery after an error in a subcomposition so parent compositions continue observing state changes. (
      <a href="https://android-review.googlesource.com/#/q/I63fb5e04a2d34eab3b79c2fefa97118ff204da25">I63fb5</a>
      )
    </li>
  </ul>
  <h2 id="version_112_2" data-text="Version 1.12" tabindex="-1">Version 1.12</h2>
