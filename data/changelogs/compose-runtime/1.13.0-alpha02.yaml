changelogHtml: |
  <h3 id="1.13.0-alpha02" data-text="Version 1.13.0-alpha02" tabindex="-1">Version 1.13.0-alpha02</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.runtime:runtime-*:1.13.0-alpha02</code>
    is released. Version 1.13.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e9a673661e45bb2eaea8dd43632ce3e1ea6a2094..449c5b3007e5870f6c89fe2f8ee8c0557b6e5c6c/compose/runtime">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">withLocalRetainedValuesStore</code>
      , which lets you return values from the content lambda. (
      <a href="https://android-review.googlesource.com/#/q/I8e871d907df66a2be49269c3e1f123d7c7db2acb">I8e871</a>
      ,
      <a href="https://issuetracker.google.com/issues/542168593">b/542168593</a>
      )
    </li>
    <li>
      Added nullable overloads of
      <code translate="no" dir="ltr">rememberSerializable</code>
      for
      <code translate="no" dir="ltr">MutableState</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I77b834338f1d8fda735dd60b1b719bbd0f23137b">I77b83</a>
      ,
      <a href="https://issuetracker.google.com/issues/543285462">b/543285462</a>
      )
    </li>
  </ul>
