changelogHtml: |
  <h3 id="2.4.1" data-text="Version 2.4.1" tabindex="-1">Version 2.4.1</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.test.uiautomator:uiautomator:2.4.1</code>
    ,
    <code translate="no" dir="ltr">androidx.test.uiautomator:uiautomator-shell:2.4.1</code>
    , and
    <code translate="no" dir="ltr">androidx.test.uiautomator:uiautomator-shell-android:2.4.1</code>
    are released. Version 2.4.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ec9022d156846f24e22bec3e475d4206d6f321ea..3054cd1c711b06fa33d39e66427dfc37e91c637d/test/uiautomator">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue in
      <code translate="no" dir="ltr">ShellServer</code>
      where random port selection could lead to port collisions and startup failures. (
      <a href="https://android-review.googlesource.com/#/q/I1951b6a1c46dbc7abfd08b33c1496258dac3522a">I1951b</a>
      )
    </li>
  </ul>
