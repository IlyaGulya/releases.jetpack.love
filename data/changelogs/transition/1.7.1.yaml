changelogHtml: |
  <h3 id="1.7.1" data-text="Version 1.7.1" tabindex="-1">Version 1.7.1</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.transition:transition:1.7.1</code>
    and
    <code translate="no" dir="ltr">androidx.transition:transition-ktx:1.7.1</code>
    are released. Version 1.7.1 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b29cf052e4fc6e84103bf548ba5759009897453f..8bbfd1897e869a1edab00c290206a73c4739863c/transition">these commits</a>
    .
  </p>
  <p><strong>External Contribution</strong></p>
  <ul>
    <li>
      Fixed a leak in Transition that was caused by seeking transitions not being properly cleaned up on cancellation or completion. Thank you Bryan Herbst! (
      <a href="https://android-review.googlesource.com/#/q/Idf7d4d6668846374b498e89cb59f9fb4efe6324f">Idf7d4</a>
      ,
      <a href="https://issuetracker.google.com/435193212">b/435193212</a>
      )
    </li>
  </ul>
