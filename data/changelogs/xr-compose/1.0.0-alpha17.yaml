version: 1.0.0-alpha17
releaseDate: 2026-08-12
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha17" data-text="Version 1.0.0-alpha17" tabindex="-1">Version 1.0.0-alpha17</h3>
  <p>August 12, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.compose:compose:1.0.0-alpha17</code>
    and
    <code translate="no" dir="ltr">androidx.xr.compose:compose-testing:1.0.0-alpha17</code>
    are released. Version 1.0.0-alpha17 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/acddfd8ada1ae0da79f5ae0f95f5c07e79c6d4e1..21d3a25e98cb0aafed30e30d4e1d89bba15ed1d7/xr/compose">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Remove the
      <code translate="no" dir="ltr">Meter</code>
      value class, it is replaced by
      <code translate="no" dir="ltr">virtualPixelDensity</code>
      in
      <code translate="no" dir="ltr">Scenecore</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I690ee091ef7f69e60d2de1564a87ba7da59291fb">I690ee</a>
      )
    </li>
    <li>
      The
      <code translate="no" dir="ltr">SpatialGltfModel</code>
      API is now experimental and must be opted in for use. (
      <a href="https://android-review.googlesource.com/#/q/I4557e117894af094e08343c84ecfdde25a089376">I4557e</a>
      )
    </li>
    <li>
      Make
      <code translate="no" dir="ltr">system</code>
      resizable nullable (
      <a href="https://android-review.googlesource.com/#/q/Ib00930218f248f77b701cd9e09d4fc216a7984e8">Ib0093</a>
      )
    </li>
    <li>
      Exposed
      <code translate="no" dir="ltr">Density</code>
      in
      <code translate="no" dir="ltr">SubspaceSemanticsInfo</code>
      for testing. (
      <a href="https://android-review.googlesource.com/#/q/I2e826dfca3b87f7202aa3bd0370e25f70d66704f">I2e826</a>
      )
    </li>
    <li>
      Rename
      <code translate="no" dir="ltr">ResizePolicy</code>
      default option to
      <code translate="no" dir="ltr">system</code>
      and add a new
      <code translate="no" dir="ltr">Default</code>
      option without parameters (
      <a href="https://android-review.googlesource.com/#/q/Ic8b1609787fd568af045f9ce96d38881e3bdbe38">Ic8b16</a>
      )
    </li>
    <li>
      Mark
      <code translate="no" dir="ltr">FollowTarget</code>
      experimental. The whole
      <code translate="no" dir="ltr">FollowingSubspace</code>
      API is now experimental. (
      <a href="https://android-review.googlesource.com/#/q/Id4ee3f8ac3b0452edfb8b32bcaf75fe6cc5f699a">Id4ee3</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">GltfAnimation</code>
      APIs (
      <a href="https://android-review.googlesource.com/#/q/Ic28943cb8bed77701fa7880b079b6bea75df1b52">Ic2894</a>
      )
    </li>
    <li>
      Renamed the parameterized
      <code translate="no" dir="ltr">MovePolicy.default()</code>
      method to
      <code translate="no" dir="ltr">MovePolicy.system()</code>
      . Introduced a
      <code translate="no" dir="ltr">val MovePolicy.Default</code>
      property to represent the standard default movement behavior. (
      <a href="https://android-review.googlesource.com/#/q/Iedcc9c9b99fead311db82c6d4598323a52400699">Iedcc9</a>
      )
    </li>
    <li>
      Expand
      <code translate="no" dir="ltr">ExperimentalMoveAnchorPolicy</code>
      opt in requirements to
      <code translate="no" dir="ltr">PlaneSemantic</code>
      and
      <code translate="no" dir="ltr">PlaneOrientation</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ief9272baf58da98a77520837aee05a8f20da5683">Ief927</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">resetMins</code>
      from
      <code translate="no" dir="ltr">VolumeConstraints.offset</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ib2f2f9080b33c6d4ca3a2a469504e4be2e8b30cc">Ib2f2f</a>
      )
    </li>
    <li>
      Removed deprecated
      <code translate="no" dir="ltr">SceneCoreEntitySizeAdapter</code>
      function. (
      <a href="https://android-review.googlesource.com/#/q/Ib6722ad2823b518b1596615f882bb2d9b870a1af">Ib6722</a>
      )
    </li>
    <li>
      Removed deprecated
      <code translate="no" dir="ltr">Subspace</code>
      overload with
      <code translate="no" dir="ltr">allowUnboundedSubspace</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I8e97fef7f94c7335869aa6342d04d85231092a97">I8e97f</a>
      )
    </li>
    <li>
      Removed deprecated semantics modifier overload. (
      <a href="https://android-review.googlesource.com/#/q/I4ac105d7bba51cc5ce34489e1e228201fb8c2fb1">I4ac10</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed issue where children of a
      <code translate="no" dir="ltr">Composable</code>
      with an
      <code translate="no" dir="ltr">InteractionPolicy</code>
      attached trigger input events (
      <a href="https://android-review.googlesource.com/#/q/Icdba6b5a89559fc521beba2c14e8ef2e30f42f21">Icdba6</a>
      )
    </li>
  </ul>
