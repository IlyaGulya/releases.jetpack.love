changelogHtml: |
  <h3 id="1.9.0-beta01" data-text="Version 1.9.0-beta01" tabindex="-1">Version 1.9.0-beta01</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.mediarouter:mediarouter:1.9.0-beta01</code>
    and
    <code translate="no" dir="ltr">androidx.mediarouter:mediarouter-testing:1.9.0-beta01</code>
    are released. Version 1.9.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..37705d642c4e1b8a8c2bf2b34b5d6d0d3537660e/mediarouter">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed a
      <code translate="no" dir="ltr">NullPointerException</code>
      in
      <code translate="no" dir="ltr">RegisteredMediaRouteProvider</code>
      when receiving unsolicited dynamic route controller responses or null descriptor bundles from route providers. (
      <a href="https://android-review.googlesource.com/#/q/I94579491fc9c3fb80ee0f300bf1daa9fc1777727">I94579</a>
      )
    </li>
  </ul>
