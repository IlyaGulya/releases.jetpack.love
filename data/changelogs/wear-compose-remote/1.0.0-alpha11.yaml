changelogHtml: |
  <h3 id="1.0.0-alpha11" data-text="Version 1.0.0-alpha11" tabindex="-1">Version 1.0.0-alpha11</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose.remote:remote-material3:1.0.0-alpha11</code>
    is released. Version 1.0.0-alpha11 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..e4bd62f853853bf3522ed15681c58ef28b09ed44/wear/compose/remote/remote-material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteEdgeButton</code>
      component to
      <code translate="no" dir="ltr">wear:compose:remote:remote-material3</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I017a62f443ab3d7a820506f732d022364e496d8c">I017a6</a>
      )
    </li>
    <li>
      Made indeterminate
      <code translate="no" dir="ltr">RemoteCircularProgressIndicator</code>
      and
      <code translate="no" dir="ltr">RemoteProgressIndicatorDefaults.IndeterminateStrokeWidth</code>
      public APIs. (
      <a href="https://android-review.googlesource.com/#/q/I937fc73183d1b4adb3a654385d47901b38f51091">I937fc</a>
      )
    </li>
    <li>
      Made
      <code translate="no" dir="ltr">RemoteTimeText</code>
      and
      <code translate="no" dir="ltr">RemoteTimeTextDefaults</code>
      public APIs. (
      <a href="https://android-review.googlesource.com/#/q/I83809b58d80692d89b09a94ed4350dfb01ee060d">I83809</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteLinearProgressIndicator</code>
      component. (
      <a href="https://android-review.googlesource.com/#/q/I828f3c7f2322f428649387a064160068c5a65063">I828f3</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteModifier.defaultMinSize</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If86a524e62e4053fa404d841fb5c8d8444e26810">If86a5</a>
      )
    </li>
    <li>
      Added intro and outro animations to
      <code translate="no" dir="ltr">RemoteCurvedProgressIndicator</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I680125646f0c6bc2c3b7872714352e586701a64a">I68012</a>
      )
    </li>
    <li>
      Updated
      <code translate="no" dir="ltr">RemoteCircularProgressIndicator</code>
      to default to
      <code translate="no" dir="ltr">RemoteProgressIndicatorDefaults.DefaultStrokeWidth</code>
      (12.rdp) and exposed
      <code translate="no" dir="ltr">largeStrokeWidth(screenSize)</code>
      and
      <code translate="no" dir="ltr">smallStrokeWidth(screenSize)</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I1f16ed52992f145be2eaa4073385e26cf59447b0">I1f16e</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
