libraryId: wear-compose-remote
groupId: androidx.wear
version: 1.0.0-alpha12
releaseDate: 2026-09-23
#language=html
changelogHtml: |
  <h3 id="remote-material3-1.0.0-alpha12" data-text="Version 1.0.0-alpha12" tabindex="-1">Version 1.0.0-alpha12</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose.remote:remote-material3:1.0.0-alpha12</code>
    is released. Version 1.0.0-alpha12 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..7b7434f12dfb811bb3828261e14cd5c87ce8fa66/wear/compose/remote/remote-material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">ImageVector.toRemoteImageVector()</code>
      and
      <code translate="no" dir="ltr">RemoteImageVector.vectorResource(@DrawableRes id: Int)</code>
      to convert Compose UI
      <code translate="no" dir="ltr">ImageVector</code>
      and drawable vector resources to
      <code translate="no" dir="ltr">RemoteImageVector</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia8383096088ccfbf93f17af836cdff9fe34cc7e2">Ia8383</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">RemoteSplitSwitchButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSplitSwitchButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemoteSplitSwitchButtonColors</code>
      as public APIs in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/Ic9b7f96d61eb858080ace1cbc217ab10c5cf7bec">Ic9b7f</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">RemoteSplitRadioButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSplitRadioButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemoteSplitRadioButtonColors</code>
      as public APIs in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/I4d0c215ae29e6e67debd3e0638be81157b167db4">I4d0c2</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">RemoteSplitCheckboxButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSplitCheckboxButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemoteSplitCheckboxButtonColors</code>
      as public APIs in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/Iffdefc715e7c8057045db4fe08cbcac536417aa9">Iffdef</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">RemoteSwitchButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSwitchButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemoteSwitchButtonColors</code>
      as public APIs in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/I0155b1ec3560bed817f3c419d405ab19a08fa2f8">I0155b</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">RemoteRadioButton</code>
      ,
      <code translate="no" dir="ltr">RemoteRadioButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemoteRadioButtonColors</code>
      as public APIs in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/I513ce620df5ef45b77cdbe3a838633180e05aed9">I513ce</a>
      )
    </li>
    <li>
      Expose
      <code translate="no" dir="ltr">RemoteCheckboxButton</code>
      ,
      <code translate="no" dir="ltr">RemoteCheckboxButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemoteCheckboxButtonColors</code>
      as public APIs in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/If5c8a72db238d6411fcff3260bd73ea554e0a18d">If5c8a</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">filledIconButtonColors</code>
      ,
      <code translate="no" dir="ltr">filledTonalIconButtonColors</code>
      ,
      <code translate="no" dir="ltr">filledVariantIconButtonColors</code>
      , and
      <code translate="no" dir="ltr">outlinedIconButtonColors</code>
      to
      <code translate="no" dir="ltr">RemoteIconButtonDefaults</code>
      in Wear Material 3 Remote Compose, and update
      <code translate="no" dir="ltr">iconButtonColors</code>
      and
      <code translate="no" dir="ltr">textButtonColors</code>
      parameter defaults to null. (
      <a href="https://android-review.googlesource.com/#/q/Ib0b0efb859f2fade902e5cead5afc3b8a4b5a94d">Ib0b0e</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">containerPainter</code>
      support to
      <code translate="no" dir="ltr">RemoteCard</code>
      and
      <code translate="no" dir="ltr">RemoteTitleCard</code>
      in Wear Material 3 Remote Compose. (
      <a href="https://android-review.googlesource.com/#/q/I4f1bc6f0abf6abc20a7760f852fb718bf37fc1b5">I4f1bc</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed
      <code translate="no" dir="ltr">RemoteEdgeButton</code>
      text spilling outside button arc shape on long labels. (
      <a href="https://android-review.googlesource.com/#/q/I2eb3d0d1f43d0f2bbef283789086a5841b577ea6">I2eb3d</a>
      )
    </li>
  </ul>
