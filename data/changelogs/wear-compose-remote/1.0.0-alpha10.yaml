version: 1.0.0-alpha10
releaseDate: 2026-08-26
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha10" data-text="Version 1.0.0-alpha10" tabindex="-1">Version 1.0.0-alpha10</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose.remote:remote-material3:1.0.0-alpha10</code>
    is released. Version 1.0.0-alpha10 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea/wear/compose/remote/remote-material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">fontFeatureSettings</code>
      and
      <code translate="no" dir="ltr">fontVariationSettings</code>
      support in
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      ,
      <code translate="no" dir="ltr">RemoteText</code>
      , and
      <code translate="no" dir="ltr">RemoteTimeText</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I6e78d7a602506d1a5741ad4dbe6f713720214527">I6e78d</a>
      ,
      <a href="https://issuetracker.google.com/issues/544644370">b/544644370</a>
      )
    </li>
    <li>
      Migrated basic Remote Compose widgets (
      <code translate="no" dir="ltr">RemoteBasicText</code>
      ,
      <code translate="no" dir="ltr">RemoteBasicImage</code>
      ,
      <code translate="no" dir="ltr">RemoteSpacer</code>
      ,
      <code translate="no" dir="ltr">RemoteBasicIcon</code>
      ) to the new remote-foundation library. (
      <a href="https://android-review.googlesource.com/#/q/I259b24dae1931f3508fba0eb0e40d6068ab82b5c">I259b2</a>
      ,
      <a href="https://issuetracker.google.com/issues/532028292">b/532028292</a>
      )
    </li>
    <li>
      Added support for
      <code translate="no" dir="ltr">fontVariationSettings</code>
      in
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I2c44ac1efd17e49a575ec53f0336c8c666275a48">I2c44a</a>
      ,
      <a href="https://issuetracker.google.com/issues/542047368">b/542047368</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteCurvedProgressIndicator</code>
      component to Wear Remote Compose Material 3 library. (
      <a href="https://android-review.googlesource.com/#/q/I975cf6ad62dcdfc1310a3e0aeedba1ba1a56caf6">I975cf</a>
      ,
      <a href="https://issuetracker.google.com/issues/530084464">b/530084464</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Add
      <code translate="no" dir="ltr">animateRemoteFloatAsState</code>
      and
      <code translate="no" dir="ltr">RemoteAnimationSpec</code>
      APIs (
      <a href="https://android-review.googlesource.com/#/q/I404cb526c4a1ebb963c28d07d2937b8d2ae110f1">I404cb</a>
      ,
      <a href="https://issuetracker.google.com/issues/549015113">b/549015113</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">CompactButtonIconSpacing</code>
      (4.rdp) to
      <code translate="no" dir="ltr">RemoteButtonDefaults</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Idbec74000af63b860b9efd166344a8d3104fa388">Idbec7</a>
      ,
      <a href="https://issuetracker.google.com/issues/542906622">b/542906622</a>
      ,
      <a href="https://issuetracker.google.com/issues/541382559">b/541382559</a>
      ,
      <a href="https://issuetracker.google.com/issues/541382046">b/541382046</a>
      ,
      <a href="https://issuetracker.google.com/issues/541382257">b/541382257</a>
      )
    </li>
    <li>
      Fix border width scaling and alignment in
      <code translate="no" dir="ltr">RemoteButton</code>
      and
      <code translate="no" dir="ltr">RemoteCard</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I8458bb022067d3b3decf4d9a1ef9746ab46f2827">I8458b</a>
      ,
      <a href="https://issuetracker.google.com/issues/544653389">b/544653389</a>
      )
    </li>
  </ul>
