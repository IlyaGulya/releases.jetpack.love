libraryId: wear-compose-remote
groupId: androidx.wear
version: 1.0.0-alpha15
releaseDate: 2026-11-04
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha15" data-text="Version 1.0.0-alpha15" tabindex="-1">Version 1.0.0-alpha15</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose.remote:remote-material3:1.0.0-alpha15</code>
    is released. Version 1.0.0-alpha15 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/3566803898b060d7136357220affc9ece8236019..9b2acdf2ecd36aa5ddf9c43ebfc288ed11d2c49e/wear/compose/remote/remote-material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Aligned
      <code translate="no" dir="ltr">RemoteButton</code>
      ,
      <code translate="no" dir="ltr">RemoteCompactButton</code>
      (including defaulting
      <code translate="no" dir="ltr">label</code>
      to
      <code translate="no" dir="ltr">null</code>
      ),
      <code translate="no" dir="ltr">RemoteIconButton</code>
      ,
      <code translate="no" dir="ltr">RemoteTextButton</code>
      ,
      <code translate="no" dir="ltr">RemoteEdgeButton</code>
      ,
      <code translate="no" dir="ltr">RemoteCheckboxButton</code>
      ,
      <code translate="no" dir="ltr">RemoteRadioButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSwitchButton</code>
      ,
      <code translate="no" dir="ltr">RemoteTitleCard</code>
      ,
      <code translate="no" dir="ltr">RemoteOutlinedCard</code>
      ,
      <code translate="no" dir="ltr">RemoteCardDefaults.outlinedCardBorder</code>
      ,
      <code translate="no" dir="ltr">RemoteHorizontalPageIndicator</code>
      ,
      <code translate="no" dir="ltr">RemoteVerticalPageIndicator</code>
      , and
      <code translate="no" dir="ltr">RemoteText</code>
      parameter order, types, and names with Wear Compose Material 3, adopting
      <code translate="no" dir="ltr">RemoteBorderStroke</code>
      for button borders and
      <code translate="no" dir="ltr">indicatorSize</code>
      (
      <code translate="no" dir="ltr">RemotePageIndicatorDefaults.IndicatorSize</code>
      ) for page indicators. (
      <a href="https://android-review.googlesource.com/#/q/If09ffd4987f888b77c0a8d47601dca053f755013">If09ff</a>
      )
    </li>
    <li>
      Updated action callbacks (
      <code translate="no" dir="ltr">onClick</code>
      ,
      <code translate="no" dir="ltr">onCheckedChange</code>
      ,
      <code translate="no" dir="ltr">onSelect</code>
      ,
      <code translate="no" dir="ltr">onContainerClick</code>
      , and
      <code translate="no" dir="ltr">onSelectionClick</code>
      ) across
      <code translate="no" dir="ltr">remote-material3</code>
      components to use
      <code translate="no" dir="ltr">RemoteAction</code>
      instead of
      <code translate="no" dir="ltr">Action</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I19913e9857793b177ddbc440342bb3e28db42826">I19913</a>
      )
    </li>
    <li>
      Reordered
      <code translate="no" dir="ltr">RemoteEdgeButtonShape.createOutline</code>
      parameters to
      <code translate="no" dir="ltr">(size, layoutDirection, density)</code>
      to match
      <code translate="no" dir="ltr">RemoteShape.createOutline</code>
      and Compose
      <code translate="no" dir="ltr">Shape.createOutline</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ifb87adb4b42eaee3874312f61aa5cca5571daa12">Ifb87a</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">copy()</code>
      to
      <code translate="no" dir="ltr">RemoteProgressIndicatorColors</code>
      and
      <code translate="no" dir="ltr">RemoteShapes</code>
      , made
      <code translate="no" dir="ltr">copy()</code>
      parameters non-nullable across
      <code translate="no" dir="ltr">*Colors</code>
      and
      <code translate="no" dir="ltr">*Shapes</code>
      classes, removed
      <code translate="no" dir="ltr">@Composable</code>
      from non-theme shape properties on
      <code translate="no" dir="ltr">*Defaults</code>
      objects, removed the redundant
      <code translate="no" dir="ltr">RemoteEdgeButtonDefaults.shape</code>
      property (use
      <code translate="no" dir="ltr">RemoteEdgeButtonDefaults.shape(buttonSize)</code>
      ), and renamed constants on
      <code translate="no" dir="ltr">RemotePageIndicatorDefaults</code>
      and
      <code translate="no" dir="ltr">RemoteTimeTextDefaults</code>
      to
      <code translate="no" dir="ltr">PascalCase</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iae17044880c1a48c4bb37043e183adafaf03a4a9">Iae170</a>
      )
    </li>
    <li>
      Removed
      <code translate="no" dir="ltr">DefaultRemotePageIndicatorState</code>
      and
      <code translate="no" dir="ltr">RemoteModifier.buttonSizeModifier()</code>
      from the public API. (
      <a href="https://android-review.googlesource.com/#/q/I3ada2c9051e157bc26ffd1099c7f09e5310eef4c">I3ada2</a>
      )
    </li>
    <li>
      Added a required
      <code translate="no" dir="ltr">defaultFontFamily</code>
      parameter to the
      <code translate="no" dir="ltr">RemoteTypography(Typography)</code>
      constructor to apply a
      <code translate="no" dir="ltr">RemoteFontFamily</code>
      to every style. Pass
      <code translate="no" dir="ltr">RemoteFontFamily.Default</code>
      for the previous behavior. (
      <a href="https://android-review.googlesource.com/#/q/I34646152dd520b22d2ee43cd8b295cd3826be84e">I34646</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">RemoteButton</code>
      ,
      <code translate="no" dir="ltr">RemoteCompactButton</code>
      ,
      <code translate="no" dir="ltr">RemoteIconButton</code>
      , and
      <code translate="no" dir="ltr">RemoteTextButton</code>
      now clip their container backgrounds to custom
      <code translate="no" dir="ltr">RemoteShape</code>
      outlines when the creation profile supports path clipping. (
      <a href="https://android-review.googlesource.com/#/q/I3b0ab8eb261e1e363e1695b12d0899571f9fe568">I3b0ab</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteTimeText</code>
      now defaults its color to
      <code translate="no" dir="ltr">onBackground</code>
      with luminance 80, matching Wear Compose Material 3
      <code translate="no" dir="ltr">TimeText</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ib53fcf9d30bec282eee850c711ae712002d957ec">Ib53fc</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteSplitCheckboxButton</code>
      now draws the same check mark and check animation as
      <code translate="no" dir="ltr">RemoteCheckboxButton</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I96f9f8b9c7b38d137cf19bd19b81f626e675c519">I96f9f</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteSplitSwitchButton</code>
      now mirrors the switch thumb in right-to-left layouts and draws the same thumb check mark as
      <code translate="no" dir="ltr">RemoteSwitchButton</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I686ec277cb9ddcc3ea1a01d46ffbd0a7411d4908">I686ec</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RemoteButtonDefaults.containerPainter</code>
      and
      <code translate="no" dir="ltr">RemoteCardDefaults.containerPainter</code>
      ignoring alpha and
      <code translate="no" dir="ltr">disabledContainerOpacity</code>
      , and aligned
      <code translate="no" dir="ltr">RemoteIconButtonDefaults</code>
      <code translate="no" dir="ltr">contentColor</code>
      defaults with Wear Compose Material 3. (
      <a href="https://android-review.googlesource.com/#/q/I9c5fbdab637df486682845835cfb87b5258a8da9">I9c5fb</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteCheckboxButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSwitchButton</code>
      , and
      <code translate="no" dir="ltr">RemoteRadioButton</code>
      now tint their icon with the icon colors from their colors, which default to the primary color, matching Wear Compose Material 3. (
      <a href="https://android-review.googlesource.com/#/q/I315906845f3443a01230665605bc00acae0dfcb1">I31590</a>
      )
    </li>
    <li>
      Remote selection buttons and their split variants now animate their container and content colors with the slow effects spec of
      <code translate="no" dir="ltr">RemoteMaterialTheme.motionScheme</code>
      , matching Wear Compose Material 3, and the
      <code translate="no" dir="ltr">RemoteCheckboxButton</code>
      tick no longer rotates while being unchecked. (
      <a href="https://android-review.googlesource.com/#/q/I822aa6b9e0f2e4da980f4b9c0a656dbfa32559af">I822aa</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteCircularProgressIndicator</code>
      and
      <code translate="no" dir="ltr">RemoteLinearProgressIndicator</code>
      now animate progress changes with
      <code translate="no" dir="ltr">RemoteMaterialTheme.motionScheme</code>
      , matching Wear Compose Material 3, and
      <code translate="no" dir="ltr">RemoteCircularProgressIndicator</code>
      now coerces progress into
      <code translate="no" dir="ltr">0f..1f</code>
      . The indeterminate
      <code translate="no" dir="ltr">RemoteCircularProgressIndicator</code>
      now uses the standard easing for its trims. (
      <a href="https://android-review.googlesource.com/#/q/Ief8ea398cc2c6dfc8c3566a7aa19c2954009929e">Ief8ea</a>
      )
    </li>
    <li>
      Aligned default colors in
      <code translate="no" dir="ltr">RemoteButtonDefaults</code>
      ,
      <code translate="no" dir="ltr">RemoteCardDefaults.outlinedCardBorderColor</code>
      ,
      <code translate="no" dir="ltr">RemoteCheckboxButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">RemotePageIndicatorDefaults</code>
      with Wear Compose Material 3. (
      <a href="https://android-review.googlesource.com/#/q/I87510409fe33840e58a96f66348801fbe730ce13">I87510</a>
      )
    </li>
  </ul>
