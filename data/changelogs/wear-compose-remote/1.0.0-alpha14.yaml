libraryId: wear-compose-remote
groupId: androidx.wear
version: 1.0.0-alpha14
releaseDate: 2026-10-21
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha14" data-text="Version 1.0.0-alpha14" tabindex="-1">Version 1.0.0-alpha14</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose.remote:remote-material3:1.0.0-alpha14</code>
    is released. Version 1.0.0-alpha14 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/988ac9734e8223273eb7f186ee1639ee68deb025..95347b245f1527ec6856a3daa580a1c0abbddc11/wear/compose/remote/remote-material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Added
      <code translate="no" dir="ltr">dynamicRemoteColorScheme</code>
      () to create a
      <code translate="no" dir="ltr">RemoteColorScheme</code>
      whose colors follow the player's Android system (dynamic) colors. (
      <a href="https://android-review.googlesource.com/#/q/I35bf53a27fb18b817e6a1ca9826f1a7a04b2bfcf">I35bf5</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteIntroOutroCurvedProgressIndicator</code>
      replaces the
      <code translate="no" dir="ltr">RemoteCurvedProgressIndicator</code>
      overload that took
      <code translate="no" dir="ltr">totalTimerDurationMillis</code>
      . Its intro and outro animations play when the progress leaves its start and once it reaches its end, so it works for goals as well as timers. (
      <a href="https://android-review.googlesource.com/#/q/I96317e8ef03a3fb4753e0574ce9f53de4c6f2b75">I96317</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteMotionScheme</code>
      and
      <code translate="no" dir="ltr">RemoteMaterialTheme.motionScheme</code>
      to Remote Wear Material3, matching Wear Compose Material 3
      <code translate="no" dir="ltr">MotionScheme</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I9bd93a178f041d2de6c9fa203bf8c317864414f2">I9bd93</a>
      )
    </li>
    <li>
      Remove
      <code translate="no" dir="ltr">combinedFontVariationSettings</code>
      from
      <code translate="no" dir="ltr">RemoteTextStyle</code>
      to honor Compose separation of font features and font variations. (
      <a href="https://android-review.googlesource.com/#/q/I91856d55995f0c08d0dd021a47397ff9d611b24c">I91856</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">RemoteTextStyle.fromTextStyle</code>
      now selects font variation settings from the font that matches the style's font weight and font style. (
      <a href="https://android-review.googlesource.com/#/q/I2ab3914794f82f425e1b256acec001e693faf7d2">I2ab39</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteSegmentedCircularProgressIndicator</code>
      to Remote Wear Material3. (
      <a href="https://android-review.googlesource.com/#/q/I814b772f3f1d73bb2312a9e40eea1a678f58029e">I814b7</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteTextToggleButton</code>
      to Remote Wear Material3. (
      <a href="https://android-review.googlesource.com/#/q/Ie5d96009e3c25a618305c5a10f4ed2a668994c90">Ie5d96</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">RemoteIconToggleButton</code>
      to Remote Wear Material3. (
      <a href="https://android-review.googlesource.com/#/q/I825b28ed3acd0a86f9129286a98eb328d8ff73f7">I825b2</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RemoteCurvedProgressIndicator</code>
      losing its gap at low progress when
      <code translate="no" dir="ltr">dotCollapsible = false</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iac3d2b7caf16a5d366948b65de10e6cb4952bdd6">Iac3d2</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RemoteSplitCheckboxButton</code>
      ,
      <code translate="no" dir="ltr">RemoteSplitRadioButton</code>
      , and
      <code translate="no" dir="ltr">RemoteSplitSwitchButton</code>
      outer corners appearing square on renderers that do not apply the outer rounded clip. (
      <a href="https://android-review.googlesource.com/#/q/I59e9397998296e67bafba6b013949b4ece077819">I59e93</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">RemoteTypography</code>
      now preserves font variation settings from the font that matches each style's font weight and font style alongside
      <code translate="no" dir="ltr">fontFeatureSettings</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I2ab3914794f82f425e1b256acec001e693faf7d2">I2ab39</a>
      )
    </li>
  </ul>
