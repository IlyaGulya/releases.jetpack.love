libraryId: wear-compose-remote
groupId: androidx.wear
version: 1.0.0-alpha13
releaseDate: 2026-10-07
#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha13" data-text="Version 1.0.0-alpha13" tabindex="-1">Version 1.0.0-alpha13</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.wear.compose.remote:remote-material3:1.0.0-alpha13</code>
    is released. Version 1.0.0-alpha13 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..dfba882dc7bd28aa4e7febb9c51b9a62fdfb14d0/wear/compose/remote/remote-material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add
      <code translate="no" dir="ltr">RemoteButtonDefaults</code>
      .
      <code translate="no" dir="ltr">buttonWithContainerPainterColors</code>
      overload supporting color customization. (
      <a href="https://android-review.googlesource.com/#/q/If62d48451da68d44793ddcc2c6048f93baf6ec8b">If62d4</a>
      )
    </li>
    <li>
      Introduce
      <code translate="no" dir="ltr">RemoteBorderStroke</code>
      and add border:
      <code translate="no" dir="ltr">RemoteBorderStroke</code>
      ? parameter to
      <code translate="no" dir="ltr">RemoteCard</code>
      ,
      <code translate="no" dir="ltr">RemoteAppCard</code>
      , and
      <code translate="no" dir="ltr">RemoteTitleCard</code>
      . Add
      <code translate="no" dir="ltr">RemoteCardDefaults</code>
      .
      <code translate="no" dir="ltr">outlinedCardBorder</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I57abffd93e499158eeb48dba19ab7327b8c81653">I57abf</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">backgroundColor</code>
      and container background arc rendering to
      <code translate="no" dir="ltr">RemoteHorizontalPageIndicator</code>
      and
      <code translate="no" dir="ltr">RemoteVerticalPageIndicator</code>
      to match Material 3 specifications. (
      <a href="https://android-review.googlesource.com/#/q/Ifd0628e9829d6139c5f6c329b714bb6230b7b211">Ifd062</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">childButtonColors</code>
      to
      <code translate="no" dir="ltr">RemoteButtonDefaults</code>
      , and add unbounded
      <code translate="no" dir="ltr">RemoteButtonDefaults</code>
      .
      <code translate="no" dir="ltr">scrimBrush</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iadcf266556c39e9eb767baebac1aa141a1fa4ea1">Iadcf2</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Animate
      <code translate="no" dir="ltr">RemoteSwitchButton</code>
      and
      <code translate="no" dir="ltr">RemoteSplitSwitchButton</code>
      in Wear Remote Compose Material 3 (
      <a href="https://android-review.googlesource.com/#/q/I1b4a28dc13637a1237d54453e9f8da57d5949454">I1b4a2</a>
      )
    </li>
    <li>
      Animate
      <code translate="no" dir="ltr">RemoteRadioButton</code>
      and
      <code translate="no" dir="ltr">RemoteSplitRadioButton</code>
      in Wear Remote Compose Material 3 (
      <a href="https://android-review.googlesource.com/#/q/Ifc655662731764fd5b335a5c3215276ad4097e1a">Ifc655</a>
      )
    </li>
    <li>
      Animate
      <code translate="no" dir="ltr">RemoteCheckboxButton</code>
      and
      <code translate="no" dir="ltr">RemoteSplitCheckboxButton</code>
      in Wear Remote Compose Material 3 (
      <a href="https://android-review.googlesource.com/#/q/Icf89cccf65febea2fc7064c3cde8932ac538c9e9">Icf89c</a>
      )
    </li>
  </ul>
