changelogHtml: |
  <h3 id="1.5.0-rc01" data-text="Version 1.5.0-rc01" tabindex="-1">Version 1.5.0-rc01</h3>
  <p>November 04, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3:material3-*:1.5.0-rc01</code>
    is released. Version 1.5.0-rc01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4d933c98df7baa7ea2b83eea6e086915961e0ff..1f549b6f5ba84cb3553be9c79110c4c5f6413039/compose/material3">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Resolve hardcoded pressed shape in
      <code translate="no" dir="ltr">ToggleButton</code>
      to use design token
      <code translate="no" dir="ltr">ButtonSmallTokens.PressedContainerShape</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ia60dc38f5dc5174eb7028ee81945a37b9521471b">Ia60dc</a>
      ,
      <a href="https://issuetracker.google.com/issues/531792521">b/531792521</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RangeSlider</code>
      not updating values on tap when thumbs overlap. (
      <a href="https://android-review.googlesource.com/#/q/I91d428e504f8b76c2a1903e56c18b47120e98a12">I91d42</a>
      ,
      <a href="https://issuetracker.google.com/issues/352467346">b/352467346</a>
      )
    </li>
    <li>
      Fixed floating-point precision loss in discrete
      <code translate="no" dir="ltr">Slider</code>
      and
      <code translate="no" dir="ltr">RangeSlider</code>
      when snapping to integer ticks. (
      <a href="https://android-review.googlesource.com/#/q/I91d428e504f8b76c2a1903e56c18b47120e98a12">I91d42</a>
      ,
      <a href="https://issuetracker.google.com/issues/237634010">b/237634010</a>
      )
    </li>
    <li>
      Fixed
      <code translate="no" dir="ltr">RangeSlider</code>
      inside a horizontally scrollable container scrolling the container when dragging a thumb. (
      <a href="https://android-review.googlesource.com/#/q/I91d428e504f8b76c2a1903e56c18b47120e98a12">I91d42</a>
      ,
      <a href="https://issuetracker.google.com/issues/415838608">b/415838608</a>
      )
    </li>
  </ul>
