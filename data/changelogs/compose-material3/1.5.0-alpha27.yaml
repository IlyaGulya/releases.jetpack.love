groupId: androidx.compose
version: 1.5.0-alpha27
releaseDate: 2026-08-26
#language=html
changelogHtml: |
  <h3 id="1.5.0-alpha27" data-text="Version 1.5.0-alpha27" tabindex="-1">Version 1.5.0-alpha27</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3:material3-*:1.5.0-alpha27</code>
    is released. Version 1.5.0-alpha27 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..e803e681a62cf709ac0eef07a56ac6cc0bba332a/compose/material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Renamed
      <code translate="no" dir="ltr">RichTimePickerDialog</code>
      to
      <code translate="no" dir="ltr">VibrantTimePickerDialog</code>
      , renamed
      <code translate="no" dir="ltr">richColors</code>
      to
      <code translate="no" dir="ltr">vibrantColors</code>
      in
      <code translate="no" dir="ltr">TimePickerDefaults</code>
      and
      <code translate="no" dir="ltr">TimeInputDefaults</code>
      , renamed
      <code translate="no" dir="ltr">richContainerColor</code>
      and
      <code translate="no" dir="ltr">richShape</code>
      to
      <code translate="no" dir="ltr">vibrantContainerColor</code>
      and
      <code translate="no" dir="ltr">vibrantShape</code>
      in
      <code translate="no" dir="ltr">TimePickerDialogDefaults</code>
      , and renamed unselected color properties to
      <code translate="no" dir="ltr">periodSelectorContainerColor</code>
      ,
      <code translate="no" dir="ltr">periodSelectorContentColor</code>
      ,
      <code translate="no" dir="ltr">timeSelectorContainerColor</code>
      ,
      <code translate="no" dir="ltr">timeSelectorContentColor</code>
      , and
      <code translate="no" dir="ltr">clockDialContentColor</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iea5aa467256e7e84889eaa46325ed79445ffdf5d">Iea5aa</a>
      )
    </li>
    <li>
      Update the Rich
      <code translate="no" dir="ltr">TimePicker</code>
      API to allow for an uncontained scroll/input dialog. (
      <a href="https://android-review.googlesource.com/#/q/I2b3b625f1fd185d19d26dede024f261ddfa4af8f">I2b3b6</a>
      )
    </li>
    <li>
      Introduced
      <code translate="no" dir="ltr">SelectableDropdownMenuItem</code>
      and
      <code translate="no" dir="ltr">CheckableDropdownMenuItem</code>
      for selectable and checkable expressive menu items. Updated
      <code translate="no" dir="ltr">DropdownMenuItem</code>
      with shape to use
      <code translate="no" dir="ltr">MenuItemColors</code>
      , and added
      <code translate="no" dir="ltr">MenuDefaults.itemVibrantColors()</code>
      to support vibrant
      <code translate="no" dir="ltr">MenuItemColors</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I160ca23104cb58328af2c05ff946c5166a8fc91a">I160ca</a>
      )
    </li>
    <li>
      Added opinionated expressive
      <code translate="no" dir="ltr">ToggleButton</code>
      ,
      <code translate="no" dir="ltr">ElevatedToggleButton</code>
      ,
      <code translate="no" dir="ltr">FilledTonalToggleButton</code>
      , and
      <code translate="no" dir="ltr">OutlinedToggleButton</code>
      overloads with
      <code translate="no" dir="ltr">ButtonSize</code>
      and
      <code translate="no" dir="ltr">icon</code>
      slot. Simplified
      <code translate="no" dir="ltr">ToggleButtonDefaults</code>
      ,
      <code translate="no" dir="ltr">ElevatedToggleButtonDefaults</code>
      ,
      <code translate="no" dir="ltr">FilledTonalToggleButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">OutlinedToggleButtonDefaults</code>
      method names to
      <code translate="no" dir="ltr">colors()</code>
      and
      <code translate="no" dir="ltr">border()</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Iab484ab734ad5fedd308c54fcfbe9ddf37d0b391">Iab484</a>
      )
    </li>
    <li>
      Removed deprecated overloads of
      <code translate="no" dir="ltr">pinnedScrollBehavior</code>
      and
      <code translate="no" dir="ltr">enterAlwaysScrollBehavior</code>
      from
      <code translate="no" dir="ltr">TopAppBarDefaults</code>
      . Use the overloads that take
      <code translate="no" dir="ltr">ScrollableState</code>
      instead. (
      <a href="https://android-review.googlesource.com/#/q/Idef9d20d5c9fd92e61d6d4bd27b717ea601ea93a">Idef9d</a>
      )
    </li>
    <li>
      Removed deprecated experimental API
      <code translate="no" dir="ltr">LocalMotionScheme</code>
      from
      <code translate="no" dir="ltr">MaterialTheme</code>
      . Use
      <code translate="no" dir="ltr">MaterialTheme.motionScheme</code>
      instead. (
      <a href="https://android-review.googlesource.com/#/q/I4b61dd15fae45469a3cb9b0ee25b1448d66dd525">I4b61d</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">TimeInputDefaults</code>
      and
      <code translate="no" dir="ltr">TimeInputColors</code>
      for
      <code translate="no" dir="ltr">TimeInput</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I7534e77ac6a8ae9da3789ff29878460edd2f153d">I7534e</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">ScrollDisplayModeToggle</code>
      announced 'Switch to scroll mode' while in scroll mode. (
      <a href="https://android-review.googlesource.com/#/q/I2d588d1c52938f7f4b7d2243b6e52d61e003ee5e">I2d588</a>
      )
    </li>
    <li>
      Fixed an issue where
      <code translate="no" dir="ltr">DropdownMenuItem</code>
      without a leading icon did not align trailing icons to the end of the menu item. (
      <a href="https://android-review.googlesource.com/#/q/Ia24ff1947a6d41a5af08d5fd2eeaab88e57e0bbf">Ia24ff</a>
      ,
      <a href="https://issuetracker.google.com/issues/542873381">b/542873381</a>
      )
    </li>
  </ul>
