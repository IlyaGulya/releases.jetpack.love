libraryId: compose-material3
groupId: androidx.compose
version: 1.5.0-beta01
releaseDate: 2026-10-07
#language=html
changelogHtml: |
  <h3 id="1.5.0-beta01" data-text="Version 1.5.0-beta01" tabindex="-1">Version 1.5.0-beta01</h3>
  <p>October 07, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3:material3-*:1.5.0-beta01</code>
    is released. Version 1.5.0-beta01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f..19991f2c0858aadfcb442ce02b2c8e4743c96898/compose/material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Restored
      <code translate="no" dir="ltr">TopAppBarDefaults.enterAlwaysScrollBehavior</code>
      overload taking
      <code translate="no" dir="ltr">reverseLayout</code>
      as deprecated with warning to maintain compatibility with 1.4. (
      <a href="https://android-review.googlesource.com/#/q/I4a87a01c8f6a1c616be56d61ff472021c6797f4b">I4a87a</a>
      )
    </li>
    <li>
      Restored
      <code translate="no" dir="ltr">DraggableState</code>
      on
      <code translate="no" dir="ltr">SliderState</code>
      and retained
      <code translate="no" dir="ltr">Slider</code>
      ,
      <code translate="no" dir="ltr">VerticalSlider</code>
      , and
      <code translate="no" dir="ltr">RangeSlider</code>
      overloads with nullable
      <code translate="no" dir="ltr">onValueChange</code>
      as hidden deprecated APIs to maintain binary compatibility. (
      <a href="https://android-review.googlesource.com/#/q/Ie4aee051062a922220fbe747b43d02955ced680c">Ie4aee</a>
      )
    </li>
    <li>
      Updated
      <code translate="no" dir="ltr">PolygonShape</code>
      APIs: moved
      <code translate="no" dir="ltr">CornerRounding</code>
      to top-level with
      <code translate="no" dir="ltr">dp()</code>
      and
      <code translate="no" dir="ltr">fraction()</code>
      factories, replaced
      <code translate="no" dir="ltr">transformed()</code>
      and
      <code translate="no" dir="ltr">scaledToFit()</code>
      extensions with in-place mutable
      <code translate="no" dir="ltr">PolygonShape.transform(PolygonShapeTransformScope.() -&gt; Unit)</code>
      and
      <code translate="no" dir="ltr">PolygonShape.copy()</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If5970afe91c37146e7de4521ca916e59d31b924e">If5970</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">HorizontalCenteredHeroCarousel</code>
      's
      <code translate="no" dir="ltr">maxItemWidth</code>
      parameter has been renamed to
      <code translate="no" dir="ltr">preferredItemWidth</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Ie7883232c6428c649335c1bcbdd6d51057dc0304">Ie7883</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">CarouselDefaults.ItemSpacing</code>
      and
      <code translate="no" dir="ltr">CarouselDefaults.ContentPadding</code>
      , which hold the default item spacing and content padding used by the carousel composables. (
      <a href="https://android-review.googlesource.com/#/q/I2f36abfea23f415297488cbcbfa3cc69a186ebe8">I2f36a</a>
      )
    </li>
  </ul>
