version: 1.5.0-alpha28
releaseDate: 2026-09-09
#language=html
changelogHtml: |
  <h3 id="1.5.0-alpha28" data-text="Version 1.5.0-alpha28" tabindex="-1">Version 1.5.0-alpha28</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3:material3-*:1.5.0-alpha28</code>
    is released. Version 1.5.0-alpha28 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..e4bd62f853853bf3522ed15681c58ef28b09ed44/compose/material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Renamed and simplified the multi-aspect carousel API to a global
      <code translate="no" dir="ltr">carouselParallaxScrollEffect</code>
      modifier (
      <a href="https://android-review.googlesource.com/#/q/I46b17fbc7eb3b0d061ce059234976a7d5a9912b5">I46b17</a>
      )
    </li>
    <li>
      Removed deprecated
      <code translate="no" dir="ltr">ToggleButton</code>
      overloads. Added utility functions (
      <code translate="no" dir="ltr">contentPaddingFor</code>
      ,
      <code translate="no" dir="ltr">shapesFor</code>
      ) and default constants (including
      <code translate="no" dir="ltr">size</code>
      ) to
      <code translate="no" dir="ltr">ToggleButtonDefaults</code>
      ,
      <code translate="no" dir="ltr">ElevatedToggleButtonDefaults</code>
      ,
      <code translate="no" dir="ltr">FilledTonalToggleButtonDefaults</code>
      , and
      <code translate="no" dir="ltr">OutlinedToggleButtonDefaults</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I998cf18c0880f30a68e5be04faf9f65d5c192190">I998cf</a>
      )
    </li>
    <li>
      <p>
        Deprecated stateless
        <code translate="no" dir="ltr">Slider</code>
        and
        <code translate="no" dir="ltr">RangeSlider</code>
        overloads in favor of their stateful versions. Renamed
        <code translate="no" dir="ltr">activeRangeStart</code>
        and
        <code translate="no" dir="ltr">activeRangeEnd</code>
        in
        <code translate="no" dir="ltr">RangeSliderState</code>
        to
        <code translate="no" dir="ltr">startValue</code>
        and
        <code translate="no" dir="ltr">endValue</code>
        , deprecating older unpromoted and experimental Slider APIs with
        <code translate="no" dir="ltr">DeprecationLevel.HIDDEN</code>
        . (
        <a href="https://android-review.googlesource.com/#/q/If8995438653fe44d5d108787e920c7fe06f6ff69">If8995</a>
        )
      </p>

      <p>
        To migrate
        <code translate="no" dir="ltr">Slider</code>
        , from:
        <code translate="no" dir="ltr">kotlin var value by remember { mutableFloatStateOf(0.5f) } Slider(value = value, onValueChange = { value = it })</code>
        To:
        <code translate="no" dir="ltr">kotlin val state = remember { SliderState(value = 0.5f) } Slider(state = state)</code>
      </p>

      <p>
        To migrate
        <code translate="no" dir="ltr">RangeSlider</code>
        , from:
        <code translate="no" dir="ltr">kotlin var range by remember { mutableStateOf(0.2f..0.8f) } RangeSlider(value = range, onValueChange = { range = it })</code>
        To:
        <code translate="no" dir="ltr">kotlin val state = remember { RangeSliderState(startValue = 0.2f, endValue = 0.8f) } RangeSlider(state = state)</code>
      </p>
    </li>
    <li>
      <p>
        Add enabled boolean and disabled color params to
        <code translate="no" dir="ltr">ScrollField</code>
        (
        <a href="https://android-review.googlesource.com/#/q/Iab61234eee7cb08a56fceec0662031c8fb6662e6">Iab612</a>
        )
      </p>
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      Add focus ring support for
      <code translate="no" dir="ltr">ScrollField</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/If21d62b64ce61062fef82a506495e0937f1d5ee3">If21d6</a>
      )
    </li>
    <li>
      Make design feedback adjustments for expressive
      <code translate="no" dir="ltr">TimePicker</code>
      in dial mode. (
      <a href="https://android-review.googlesource.com/#/q/I8795e1940eed2779a9bde406a835a4c7073d638e">I8795e</a>
      )
    </li>
    <li>
      Make padding adjustments for expressive
      <code translate="no" dir="ltr">TimePicker</code>
      in scroll and input mode. (
      <a href="https://android-review.googlesource.com/#/q/Iddb335d93eb206d21e16406bb74481ede39d89aa">Iddb33</a>
      )
    </li>
    <li>
      Updates toggle height/layout calculation based on item count for expressive
      <code translate="no" dir="ltr">TimePicker.kt</code>
      in uncontained mode. (
      <a href="https://android-review.googlesource.com/#/q/I30700af712234d9a6b8a4a747fa5d736dfdc4d70">I30700</a>
      )
    </li>
    <li>
      Fixed an issue where AM/PM controls were truncated in
      <code translate="no" dir="ltr">TimePicker</code>
      when large text or font scaling was enabled. (
      <a href="https://android-review.googlesource.com/#/q/Iaca60a918c140a3e702f6261bf538c9b8eada89f">Iaca60</a>
      )
    </li>
    <li>
      Updated
      <code translate="no" dir="ltr">SecureTextField</code>
      and
      <code translate="no" dir="ltr">OutlinedSecureTextField</code>
      components (as well as deprecated
      <code translate="no" dir="ltr">BasicSecureTextField</code>
      overloads) to use
      <code translate="no" dir="ltr">TextObfuscationMode.System</code>
      as the default obfuscation mode instead of
      <code translate="no" dir="ltr">TextObfuscationMode.RevealLastTyped</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I76c7ee604ecea755df3c91dfa281778532338f4d">I76c7e</a>
      )
    </li>
  </ul>
