version: 1.5.0-alpha29
releaseDate: 2026-09-23
#language=html
changelogHtml: |
  <h3 id="1.5.0-alpha29" data-text="Version 1.5.0-alpha29" tabindex="-1">Version 1.5.0-alpha29</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.compose.material3:material3-*:1.5.0-alpha29</code>
    is released. Version 1.5.0-alpha29 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..3991baac26fe4b1099b35ec36fc40a116cca22f5/compose/material3">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <strong>Source breaking change</strong>
      :
      <code translate="no" dir="ltr">onValueChange</code>
      is now a required parameter in
      <code translate="no" dir="ltr">Slider</code>
      and
      <code translate="no" dir="ltr">RangeSlider</code>
      and its order in the parameter list has changed
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">DatePicker</code>
      now resolves in 1 frame by computing month navigation availability directly from the displayed month index. (
      <a href="https://android-review.googlesource.com/#/q/I08db7973b21ec076f76456926a35d6f15ffdb401">I08db7</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">TimeInput</code>
      now internally uses the new
      <code translate="no" dir="ltr">TextFieldState</code>
      text field APIs. (
      <a href="https://android-review.googlesource.com/#/q/Ia7492b79370ed4c48ba6f6512021d9795e0ca0d1">Ia7492</a>
      ,
      <a href="https://issuetracker.google.com/issues/353692863">b/353692863</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">DateInput</code>
      now internally uses the new
      <code translate="no" dir="ltr">TextFieldState</code>
      text field APIs. (
      <a href="https://android-review.googlesource.com/#/q/I5ad3d9297690778c8f8403dbf9d90209418ec16a">I5ad3d</a>
      ,
      <a href="https://issuetracker.google.com/issues/353692863">b/353692863</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">Slider</code>
      and
      <code translate="no" dir="ltr">RangeSlider</code>
      now handle
      <code translate="no" dir="ltr">onValueChange</code>
      and
      <code translate="no" dir="ltr">onValueChangeFinished</code>
      directly in their implementations instead of passing them into
      <code translate="no" dir="ltr">SliderState</code>
      and
      <code translate="no" dir="ltr">RangeSliderState</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I959ac9a6e2adbf55969b16c9dbe75e92faa1c7ad">I959ac</a>
      )
    </li>
  </ul>
