changelogHtml: |
  <h3 id="1.0.0-alpha16" data-text="Version 1.0.0-alpha16" tabindex="-1">Version 1.0.0-alpha16</h3>
  <p>July 29, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer:1.0.0-alpha16</code>
    and
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer-google-fonts:1.0.0-alpha16</code>
    are released. Version 1.0.0-alpha16 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/ba3014c143b9c9782fe30bc766c5dced55e13453..dfb121e34f93d3d85ec4bfdd682e8022b7435a1d/xr/glimmer">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Add page indicator API for use with the
      <code translate="no" dir="ltr">GlimmerHorizontalPager</code>
      . This component is bundled by default when using the Pager, but may also be used separately as long as it is provided a
      <code translate="no" dir="ltr">GlimmerPagerState</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I549905a1208c8d2f08d1fefd3822df4ce629e65d">I54990</a>
      ,
      <a href="https://issuetracker.google.com/issues/481669397">b/481669397</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">ButtonGroup</code>
      component (
      <a href="https://android-review.googlesource.com/#/q/I263240c6e18f7c196ea59cbc21a7c6246a6a6964">I26324</a>
      ,
      <a href="https://issuetracker.google.com/issues/481662773">b/481662773</a>
      )
    </li>
  </ul>
