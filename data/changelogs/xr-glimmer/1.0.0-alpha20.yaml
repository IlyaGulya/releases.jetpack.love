#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha20" data-text="Version 1.0.0-alpha20" tabindex="-1">Version 1.0.0-alpha20</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer:1.0.0-alpha20</code>
    and
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer-google-fonts:1.0.0-alpha20</code>
    are released. Version 1.0.0-alpha20 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..89e86b645127754c154f3679b6f0aa29678a0c47/xr/glimmer">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Adds Glimmer
      <code translate="no" dir="ltr">AlertDialog</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I01019c1ac5da1d3c86175a57698ceda0bd3b185a">I01019</a>
      )
    </li>
    <li>
      Libraries now target Kotlin 2.2 and require kotlinc 2.2 (
      <a href="https://android-review.googlesource.com/#/q/I823967fe6b9524b448184ef366c562316bd6a323">I82396</a>
      ,
      <a href="https://issuetracker.google.com/issues/498369605">b/498369605</a>
      )
    </li>
    <li>
      add
      <code translate="no" dir="ltr">LeadingImageCard</code>
      and
      <code translate="no" dir="ltr">TrailingImageCard</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Icdf91f7c7f5af3b499975f1fbe0c6f85f100fab3">Icdf91</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">ImageCard</code>
      API and remove
      <code translate="no" dir="ltr">header</code>
      param from
      <code translate="no" dir="ltr">Card</code>
      and
      <code translate="no" dir="ltr">ActionCard</code>
      (
      <a href="https://android-review.googlesource.com/#/q/I81f625f51086f9d51cdd08efca087f90621a46cd">I81f62</a>
      )
    </li>
    <li>
      Added
      <code translate="no" dir="ltr">IconMarker</code>
      components used for anchoring to real-world objects. (
      <a href="https://android-review.googlesource.com/#/q/I958d6008ef36935141bb7761326128655195a609">I958d6</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/I99bfdb355ffd7f1083dbdac4167b1f5577740116">I99bfd</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
  </ul>
