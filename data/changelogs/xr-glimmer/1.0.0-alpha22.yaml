changelogHtml: |
  <h3 id="1.0.0-alpha22" data-text="Version 1.0.0-alpha22" tabindex="-1">Version 1.0.0-alpha22</h3>
  <p>October 21, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer:1.0.0-alpha22</code>
    and
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer-google-fonts:1.0.0-alpha22</code>
    are released. Version 1.0.0-alpha22 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/988ac9734e8223273eb7f186ee1639ee68deb025..b463fe32f4f38cfc70d99bf57a4587ff83459dcc/xr/glimmer">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">AlertDialog</code>
      's text parameter is now optional and has moved to after title. (
      <a href="https://android-review.googlesource.com/#/q/I0e0d46f64fc6745e4c1572c0a043c998f5c4e56e">I0e0d4</a>
      )
    </li>
    <li>
      Introduce
      <code translate="no" dir="ltr">focusedBackgroundColor</code>
      and
      <code translate="no" dir="ltr">focusedCheckedBackgroundColor</code>
      for
      <code translate="no" dir="ltr">ToggleButton</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Iab0ba2fc6f16f1b51ca53a85f1b5aaff7676c388">Iab0ba</a>
      )
    </li>
    <li>
      Renamed
      <code translate="no" dir="ltr">AlertDialog</code>
      's
      <code translate="no" dir="ltr">shape</code>
      ,
      <code translate="no" dir="ltr">contentColor</code>
      , and
      <code translate="no" dir="ltr">contentPadding</code>
      parameters (and the matching
      <code translate="no" dir="ltr">AlertDialogDefaults</code>
      members) to
      <code translate="no" dir="ltr">containerShape</code>
      ,
      <code translate="no" dir="ltr">containerContentColor</code>
      , and
      <code translate="no" dir="ltr">containerContentPadding</code>
      , to clarify that they only apply to the dialog container, not the buttons. (
      <a href="https://android-review.googlesource.com/#/q/I24f24d29c743e7a9b7d45f932469116b56dcb890">I24f24</a>
      )
    </li>
    <li>
      Introduce
      <code translate="no" dir="ltr">focusedBackgroundColor</code>
      and
      <code translate="no" dir="ltr">focusedCheckedBackgroundColor</code>
      for
      <code translate="no" dir="ltr">IconToggleButton</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Id5d8dab3b1defcdf300727fb30182d8d63115310">Id5d8d</a>
      )
    </li>
    <li>
      Fixes an edge case bug with rendering certain rounded rectangle outlines in
      <code translate="no" dir="ltr">Modifier.border</code>
      .
      <code translate="no" dir="ltr">ComposeFoundationFlags.isRoundedRectangleBorderRenderingFixEnabled</code>
      can be used to disable this change if it causes issues. (
      <a href="https://android-review.googlesource.com/#/q/I191415aaa3e9b2a7816c14b7ebd0fc1ed0a90931">I19141</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">Modifier.border</code>
      now supports rendering generic / polygon shapes with a runtime shader, when using the new border implementation. (
      <a href="https://android-review.googlesource.com/#/q/I128cacfaad9825dcef47d479d71291357fe48463">I128ca</a>
      )
    </li>
  </ul>
