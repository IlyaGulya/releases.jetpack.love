#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha19" data-text="Version 1.0.0-alpha19" tabindex="-1">Version 1.0.0-alpha19</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer:1.0.0-alpha19</code>
    and
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer-google-fonts:1.0.0-alpha19</code>
    are released. Version 1.0.0-alpha19 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/f3ed195f0c9ef9eafe437351d974c9ec49ecc2ea..29145690a62ff2392f25acec3dfe7baadff4c72d/xr/glimmer">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Change parameter name of
      <code translate="no" dir="ltr">color</code>
      to
      <code translate="no" dir="ltr">baseColor</code>
      for both
      <code translate="no" dir="ltr">SurfaceDefaults.color</code>
      and
      <code translate="no" dir="ltr">SurfaceDefaults.focusedColor</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Id1a0851d2af92c381440673a9b9edb546a1a41a1">Id1a08</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">pageOffsetFraction</code>
      parameter to
      <code translate="no" dir="ltr">animateScrollToPage</code>
      and
      <code translate="no" dir="ltr">scrollToPage</code>
      functions in
      <code translate="no" dir="ltr">GlimmerPagerState</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I5ed0de61b83b2d0df0b905d8cdf63a2e7ef7937b">I5ed0d</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
