#language=html
changelogHtml: |
  <h3 id="1.0.0-alpha18" data-text="Version 1.0.0-alpha18" tabindex="-1">Version 1.0.0-alpha18</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer:1.0.0-alpha18</code>
    and
    <code translate="no" dir="ltr">androidx.xr.glimmer:glimmer-google-fonts:1.0.0-alpha18</code>
    are released. Version 1.0.0-alpha18 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/384f3c27346bf5812f359330dc2310f0cbb66402..e803e681a62cf709ac0eef07a56ac6cc0bba332a/xr/glimmer">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Change
      <code translate="no" dir="ltr">ButtonGroupState.Saver</code>
      serialized type from
      <code translate="no" dir="ltr">Int</code>
      to
      <code translate="no" dir="ltr">*</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I78af53fffaf6f242d01ca0741c249eaa6a6a6964">I78af5</a>
      )
    </li>
    <li>
      Make
      <code translate="no" dir="ltr">SurfaceDefaults.color</code>
      and
      <code translate="no" dir="ltr">SurfaceDefaults.focusedColor</code>
      , and
      <code translate="no" dir="ltr">checkedBackgroundColor</code>
      function in
      <code translate="no" dir="ltr">IconToggleButton</code>
      and
      <code translate="no" dir="ltr">ToggleButton</code>
      ,
      <code translate="no" dir="ltr">@Composable</code>
      functions. (
      <a href="https://android-review.googlesource.com/#/q/I52eb51936311a48a29fb746f1dedde4226792333">I52eb5</a>
      ,
      <a href="https://issuetracker.google.com/issues/481943080">b/481943080</a>
      )
    </li>
    <li>
      Add
      <code translate="no" dir="ltr">focusedColor</code>
      and
      <code translate="no" dir="ltr">focusedContentColor</code>
      parameters to
      <code translate="no" dir="ltr">Modifier.surface()</code>
      function to customize colors of the focused surface. (
      <a href="https://android-review.googlesource.com/#/q/Ied24a423eb2222e35c025de71d2d68a014ef964e">Ied24a</a>
      )
    </li>
    <li>
      Remove border customization from all components and outline color from
      <code translate="no" dir="ltr">GlimmerTheme.colors</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/I0d8142155934e8491a01995fee8ad1bfd0dc5afd">I0d814</a>
      )
    </li>
  </ul>
