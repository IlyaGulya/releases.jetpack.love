changelogHtml: |
  <h3 id="1.14.0-alpha02" data-text="Version 1.14.0-alpha02" tabindex="-1">Version 1.14.0-alpha02</h3>
  <p>September 09, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.activity:activity:1.14.0-alpha02</code>
    ,
    <code translate="no" dir="ltr">androidx.activity:activity-compose:1.14.0-alpha02</code>
    , and
    <code translate="no" dir="ltr">androidx.activity:activity-ktx:1.14.0-alpha02</code>
    are released. Version 1.14.0-alpha02 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/235b7e5c8cc27d65d8800e28fcc32e33313b417b..e4bd62f853853bf3522ed15681c58ef28b09ed44/activity">these commits</a>
    .
  </p>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">compileSdk</code>
      for Compose libraries updated to 37.1. This will require transitively updating
      <code translate="no" dir="ltr">compileSdk</code>
      for all apps and libraries using Compose. (
      <a href="https://android-review.googlesource.com/#/q/I05b0f9385d2b99ddcc4041b2ce2d96aea3bd391e">I05b0f</a>
      )
    </li>
  </ul>
