changelogHtml: |
  <h3 id="1.14.0-alpha03" data-text="Version 1.14.0-alpha03" tabindex="-1">Version 1.14.0-alpha03</h3>
  <p>September 23, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.activity:activity:1.14.0-alpha03</code>
    ,
    <code translate="no" dir="ltr">androidx.activity:activity-compose:1.14.0-alpha03</code>
    , and
    <code translate="no" dir="ltr">androidx.activity:activity-ktx:1.14.0-alpha03</code>
    are released. Version 1.14.0-alpha03 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/e4bd62f853853bf3522ed15681c58ef28b09ed44..b2b5ae7b0fe1bb4eece7018878fe5f18c5967a2f/activity">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Use
      <code translate="no" dir="ltr">WindowCompat#enableEdgeToEdge(Window)</code>
      instead of
      <code translate="no" dir="ltr">EdgeToEdge#enable()</code>
      (
      <a href="https://android-review.googlesource.com/#/q/Ibff3ee1970f18642d5be7177c7ee74ea7b0df73e">Ibff3e</a>
      )
    </li>
    <li>
      Material 2 text field overloads that accept
      <code translate="no" dir="ltr">value, onValueChange</code>
      parameters are deprecated. Please migrate to the overload that uses
      <code translate="no" dir="ltr">TextFieldState</code>
      to hoist its state. (
      <a href="https://android-review.googlesource.com/#/q/I6b841e6850afbc22bec2424c3762927ec4f65670">I6b841</a>
      ,
      <a href="https://issuetracker.google.com/issues/556234973">b/556234973</a>
      )
    </li>
  </ul>
  <p><strong>Bug Fixes</strong></p>
  <ul>
    <li>
      <code translate="no" dir="ltr">androidx.lifecycle:lifecycle-runtime</code>
      dependency was updated to 2.10.0. This version is required for bundled lifecycle runtime lint checks to run with AGP version 9.5.0-alpha04 or later. (
      <a href="https://android-review.googlesource.com/#/q/I99bfdb355ffd7f1083dbdac4167b1f5577740116">I99bfd</a>
      ,
      <a href="https://issuetracker.google.com/issues/556807521">b/556807521</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">ComponentActivity</code>
      new
      <code translate="no" dir="ltr">defaultViewModelArgs</code>
      now supports direct boot configuration as well. (
      <a href="https://android-review.googlesource.com/#/q/I10a08f430362f9e809763fe70db60e68edcc4b42">I10a08</a>
      )
    </li>
  </ul>
