changelogHtml: |
  <h3 id="1.14.0-alpha01" data-text="Version 1.14.0-alpha01" tabindex="-1">Version 1.14.0-alpha01</h3>
  <p>August 26, 2026</p>
  <p>
    <code translate="no" dir="ltr">androidx.activity:activity:1.14.0-alpha01</code>
    ,
    <code translate="no" dir="ltr">androidx.activity:activity-compose:1.14.0-alpha01</code>
    , and
    <code translate="no" dir="ltr">androidx.activity:activity-ktx:1.14.0-alpha01</code>
    are released. Version 1.14.0-alpha01 contains
    <a href="https://android.googlesource.com/platform/frameworks/support/+log/475afe04599ffc0893939effda40187916c4ceb0..235b7e5c8cc27d65d8800e28fcc32e33313b417b/activity">these commits</a>
    .
  </p>
  <p><strong>API Changes</strong></p>
  <ul>
    <li>
      Intent extras are no longer automatically added to
      <code translate="no" dir="ltr">defaultViewModelCreationExtras</code>
      for exported activities. Developers of exported activities can override
      <code translate="no" dir="ltr">defaultViewModelArgs</code>
      to explicitly provide validated intent extras. (
      <a href="https://android-review.googlesource.com/#/q/Id0cb62a32d4e6283f9f30cc4461dad3caaeb2fc4">Id0cb6</a>
      ,
      <a href="https://issuetracker.google.com/issues/213646066">b/213646066</a>
      )
    </li>
    <li>
      Activity now provides
      <code translate="no" dir="ltr">NavigationEventDispatcherOwner</code>
      and
      <code translate="no" dir="ltr">OnBackPressedDispatcherOwner</code>
      factory functions for creating the instances of the respective components easily. (
      <a href="https://android-review.googlesource.com/#/q/I1d2593f457a8315db3344872f65e0c692910d398">I1d259</a>
      ,
      <a href="https://android-review.googlesource.com/#/q/Iadd5caacdd7877c6b6806af1ed93af2263929dd6">Iadd5c</a>
      )
    </li>
    <li>
      <code translate="no" dir="ltr">OnBackPressedDispatcher</code>
      now provides an
      <code translate="no" dir="ltr">asNavigationEventDispatcher</code>
      extension to easily covert it to a
      <code translate="no" dir="ltr">NavigationEventDispatcher</code>
      . (
      <a href="https://android-review.googlesource.com/#/q/Id11cfd91a90f04001ad7cde5020d33e46e1ce7e4">Id11cf</a>
      )
    </li>
  </ul>
